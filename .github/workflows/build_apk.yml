                existing: project,
                initialMode: livePreview ? 'web_preview' : null,
                repository: widget.repository,
                apiFactory: widget.apiFactory,
                onSaveProject: (updated) async {
                  final next = List<AppProject>.from(widget.projects);
                  final index = next.indexWhere((p) => p.id == updated.id);
                  if (index == -1) { next.insert(0, updated); } else { next[index] = updated; }
