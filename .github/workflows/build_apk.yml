            Future<void> _renameFolder(String oldPath) async {
              if (oldPath == 'lib' || oldPath == 'android') { _message('The top-level project folders cannot be renamed.'); return; }
              final containsNativeSources = _additionalFiles.keys.any((file) => file.startsWith('$oldPath/') && (file.endsWith('.kt') || file.endsWith('.java')));
              if ((oldPath.startsWith('android/app/src/main/kotlin/') || oldPath.startsWith('android/app/src/main/java/') || oldPath == 'android/app/src/main/kotlin' || oldPath == 'android/app/src/main/java') && containsNativeSources) {
                _message('This folder contains native Android code. Renaming a package folder can break package declarations and AndroidManifest.xml. Keep its name aligned with the package, or update the source package and manifest references first. No files were changed.');
                return;
              }
                        final oldSlash = oldPath.lastIndexOf('/');
                        final oldParent = oldSlash < 0 ? '' : oldPath.substring(0, oldSlash);
              final controller = TextEditingController(text: oldPath.split('/').last);
