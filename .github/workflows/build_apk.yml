name: Build Simple App Builder or a Flutter project

# Manual runs build the Simple App Builder APK. App requests build an APK or AAB.
# A project created inside the app triggers repository_dispatch with a per-build payload.
run-name: ${{ github.event.client_payload.request_id || 'Build Simple App Builder' }}
on:
  workflow_dispatch:
  repository_dispatch:
    types: [build_flutter_app]

permissions:
  contents: read

# Do not expose PATs as workflow secrets. The mobile app stores them locally and
# sends authenticated REST API requests directly to GitHub to dispatch this job.
jobs:
  build:
    name: Generate app builder and requested Flutter output
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize dynamic app-build payload
        id: app_payload
        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, uuid
          from pathlib import Path
          event_path = Path(os.environ['GITHUB_EVENT_PATH'])
          event = json.loads(event_path.read_text(encoding='utf-8'))
          payload = event.get('client_payload') or {}
          if not isinstance(payload, dict):
              raise SystemExit('GitHub dispatch client_payload must be a JSON object.')
          icon = payload.get('icon') if isinstance(payload.get('icon'), dict) else {}
          options = payload.get('options') if isinstance(payload.get('options'), dict) else {}
          # Prefer the current flat format while allowing earlier nested payloads.
          values = {
              'project_name': payload.get('project_name', ''),
              'package_name': payload.get('package_name', ''),
              'dependencies': payload.get('dependencies', ''),
              'android_dependencies': payload.get('android_dependencies', ''),
              'dart_code': payload.get('dart_code', ''),
              'source_archive_base64': payload.get('source_archive_base64', ''),
              'has_custom_icon': payload.get('has_custom_icon', icon.get('custom', False)),
              'icon_path': payload.get('icon_path', icon.get('path', '')),
              'dynamic_themed_icon': payload.get('dynamic_themed_icon', options.get('dynamic_themed_icon', True)),
              'build_format': payload.get('build_format', options.get('build_format', 'apk')),
              'sign_release': payload.get('sign_release', options.get('sign_release', False)),
              'app_version': payload.get('app_version', options.get('app_version', options.get('version', payload.get('version', '1.0.0+1')))),
              'request_id': payload.get('request_id', ''),
          }
          output_path = Path(os.environ['GITHUB_OUTPUT'])
          with output_path.open('a', encoding='utf-8') as output:
              for key, raw_value in values.items():
                  if isinstance(raw_value, bool):
                      value = str(raw_value).lower()
                  elif raw_value is None:
                      value = ''
                  else:
                      value = str(raw_value)
                  delimiter = 'SAB_' + uuid.uuid4().hex
                  while delimiter in value:
                      delimiter = 'SAB_' + uuid.uuid4().hex
                  output.write(f'{key}<<{delimiter}\n{value}\n{delimiter}\n')
          print('Normalized app-build payload using the flat schema (legacy nested fields remain supported).')
          PY

      - name: Validate generated-app request

        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        env:
          PROJECT_NAME: ${{ steps.app_payload.outputs.project_name }}
          PACKAGE_NAME: ${{ steps.app_payload.outputs.package_name }}
          DART_CODE: ${{ steps.app_payload.outputs.dart_code }}
          SOURCE_ARCHIVE_B64: ${{ steps.app_payload.outputs.source_archive_base64 }}
          DEPENDENCIES: ${{ steps.app_payload.outputs.dependencies }}
          ANDROID_DEPENDENCIES: ${{ steps.app_payload.outputs.android_dependencies }}
          HAS_CUSTOM_ICON: ${{ steps.app_payload.outputs.has_custom_icon }}
          ICON_PATH: ${{ steps.app_payload.outputs.icon_path }}
          DYNAMIC_THEMED_ICON: ${{ steps.app_payload.outputs.dynamic_themed_icon }}
          BUILD_FORMAT: ${{ steps.app_payload.outputs.build_format }}
          SIGN_RELEASE: ${{ steps.app_payload.outputs.sign_release }}
          APP_VERSION: ${{ steps.app_payload.outputs.app_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          name = os.environ.get('PROJECT_NAME', '').strip()
          package = os.environ.get('PACKAGE_NAME', '').strip()
          source = os.environ.get('DART_CODE', '')
          bundle = os.environ.get('SOURCE_ARCHIVE_B64', '').strip()
          deps = os.environ.get('DEPENDENCIES', '')
          if not name or len(name) > 60 or any(ord(c) < 32 for c in name):
              sys.exit('project_name must be 1–60 characters and contain no control characters.')
          if not re.fullmatch(r'[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}', package):
              sys.exit('package_name must be lowercase reverse-DNS format with at least three segments, e.g. com.example.myapp.')
          app_version = os.environ.get('APP_VERSION', '').strip() or '1.0.0+1'
          version_match = re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\+([1-9]\d*)', app_version)
          if not version_match:
              sys.exit('app_version must use major.minor.patch+buildNumber format, e.g. 1.2.0+5.')
          if int(version_match.group(4)) > 2100000000:
              sys.exit('app_version buildNumber must be <= 2100000000 for Android versionCode.')
          # This validator runs only for app-created repository_dispatch events.
          # Manual workflow_dispatch builds the builder APK and has no project inputs.
          source_zip = Path('.simple-app-builder/source.zip')
          if not bundle and not source.strip() and not source_zip.is_file():
              sys.exit('No source was supplied and .simple-app-builder/source.zip is missing from this repository. Open the project in Simple App Builder and retry the build.')
          if bundle and source.strip():
              sys.exit('Provide either source_archive_base64 or dart_code, not both.')
          if os.environ.get('HAS_CUSTOM_ICON', '').lower() == 'true':
              icon_path = os.environ.get('ICON_PATH', '').strip()
              if not re.fullmatch(r'\.simple-app-builder/icons/[0-9]+-[0-9]+\.png', icon_path):
                  sys.exit('Custom icon path is missing or invalid. Select the icon again and retry.')
          if bundle and not re.fullmatch(r'[A-Za-z0-9+/=]+', bundle):
              sys.exit('source_archive_base64 contains invalid characters.')
          if (os.environ.get('DYNAMIC_THEMED_ICON', '').lower() or 'true') not in ('true', 'false'):
              sys.exit('dynamic_themed_icon must be true or false.')
          output_format = (os.environ.get('BUILD_FORMAT', '').strip().lower() or 'apk')
          if output_format not in ('apk', 'aab'):
              sys.exit('build_format must be apk or aab.')
          if (os.environ.get('SIGN_RELEASE', '').strip().lower() or 'false') not in ('true', 'false'):
              sys.exit('sign_release must be true or false.')
          if len(source.encode('utf-8')) > 50000:
              sys.exit('dart_code exceeds 50 KB. Use the mobile builder multi-file archive mode instead.')
          for dep in re.split(r'[,;\s]+', deps.strip()):
              if dep and not re.fullmatch(r'[a-z][a-z0-9_]*', dep):
                  sys.exit(f'Invalid dependency package name: {dep!r}. Use comma-separated pub.dev package names only.')
          android_deps = [item for item in re.split(r'[,;\s]+', os.environ.get('ANDROID_DEPENDENCIES', '').strip()) if item]
          if len(android_deps) > 20:
              sys.exit('Use at most 20 Android Maven dependencies.')
          for coordinate in android_deps:
              if not re.fullmatch(r'[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.+-]+', coordinate):
                  sys.exit(f'Invalid Android Maven coordinate: {coordinate!r}. Use group:artifact:version, e.g. androidx.core:core-ktx:1.15.0.')
          print('Generated-app request payload passed validation.')
          PY

      - name: Prepare artifact name
        id: metadata
        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        env:
          PROJECT_NAME: ${{ steps.app_payload.outputs.project_name }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)"
          if [[ -z "$slug" ]]; then slug="flutter-app"; fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Set up Zulu Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          # Do not enable setup-java's Gradle cache here: this repository may only
          # contain the workflow, while Flutter/Gradle projects are generated later
          # under RUNNER_TEMP. setup-java cache discovery would fail before that.

      - name: Set up pinned Flutter stable SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          pub-cache: true

      # Derive a reusable Gradle-cache key from the template, project archive, and
      # manually supplied package list. This avoids creating a brand-new large cache
      # for every single run while still refreshing when project/dependency inputs change.
      - name: Compute Gradle cache key
        id: gradle-cache-key
        shell: bash
        env:
          EXTRA_DEPENDENCIES: ${{ steps.app_payload.outputs.dependencies }}
          ANDROID_EXTRA_DEPENDENCIES: ${{ steps.app_payload.outputs.android_dependencies }}
        run: |
          set -euo pipefail
          # Key Gradle cache by the actual imported pub package names, not the full
          # source ZIP. This avoids a cache miss for every code edit while refreshing
          # the key when an auto-detected or manually requested package changes.
          python3 - "$GITHUB_WORKSPACE/.simple-app-builder/source.zip" "$EXTRA_DEPENDENCIES" "$GITHUB_WORKSPACE/.github/workflows/build_apk.yml" "$ANDROID_EXTRA_DEPENDENCIES" >> "$GITHUB_OUTPUT" <<'PYCACHE'
          import hashlib, re, sys, zipfile
          from pathlib import Path
          archive_path = Path(sys.argv[1])
          explicit = sys.argv[2]
          workflow_path = Path(sys.argv[3])
          android_explicit = sys.argv[4] if len(sys.argv) > 4 else ''
          android_dependencies = set(item for item in re.split(r'[,;\s]+', android_explicit.strip()) if item)
          packages = set(item for item in re.split(r'[,;\s]+', explicit.strip()) if item)
          if archive_path.is_file():
              try:
                  with zipfile.ZipFile(archive_path) as zf:
                      for entry in zf.infolist():
                          if entry.is_dir() or not entry.filename.startswith('lib/') or not entry.filename.endswith('.dart') or entry.file_size > 1024 * 1024:
                              continue
                          source = zf.read(entry).decode('utf-8', errors='ignore')
                          packages.update(re.findall(r"package:([A-Za-z][A-Za-z0-9_]*)/", source))
              except (OSError, zipfile.BadZipFile):
                  print('::warning::Could not inspect source ZIP while computing cache key; using explicit dependency names only.', file=sys.stderr)
          packages.difference_update({'flutter', 'flutter_test', 'integration_test'})
          workflow_digest = hashlib.sha256(workflow_path.read_bytes()).hexdigest()
          material = 'flutter-3.47.7-gradle-cache-v6\n' + workflow_digest + '\n' + '\n'.join(sorted(packages)) + '\nANDROID\n' + '\n'.join(sorted(android_dependencies))
          print('hash=' + hashlib.sha256(material.encode()).hexdigest())
          PYCACHE

      # Cache Gradle distributions and downloaded Android/Gradle dependencies.
      # Flutter SDK and Pub package caches are handled by subosito/flutter-action above.
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v6-${{ steps.gradle-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-gradle-v6-

      # Helper applies consistent Android metadata and internet permission. New Flutter
      # templates use build.gradle.kts; the fallback handles older Groovy templates.
      - name: Create Android project patch helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/patch_android_project.py" <<'PY'
          import re, sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          project = Path(sys.argv[1])
          app_label = sys.argv[2]
          application_id = sys.argv[3]
          app_version = sys.argv[4] if len(sys.argv) > 4 else '1.0.0+1'
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\+([1-9]\d*)', app_version):
              raise SystemExit('app_version must use major.minor.patch+buildNumber format, e.g. 1.2.0+5.')
          if int(app_version.rsplit('+', 1)[1]) > 2100000000:
              raise SystemExit('app_version buildNumber must be <= 2100000000 for Android versionCode.')
          pubspec = project / 'pubspec.yaml'
          if pubspec.is_file():
              pub_text = pubspec.read_text(encoding='utf-8')
              pub_text, count = re.subn(r'(?m)^version\s*:\s*.*$', f'version: {app_version}', pub_text, count=1)
              if count == 0:
                  name_match = re.search(r'(?m)^name\s*:', pub_text)
                  if not name_match:
                      raise SystemExit('Could not locate the name field in generated pubspec.yaml to set the project version.')
                  end = pub_text.find('\n', name_match.start())
                  end = len(pub_text) if end < 0 else end + 1
                  pub_text = pub_text[:end] + f'version: {app_version}\n' + pub_text[end:]
              pubspec.write_text(pub_text, encoding='utf-8')
          manifest = project / 'android/app/src/main/AndroidManifest.xml'
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find('application')
          if app is None:
              raise SystemExit(f'No <application> element in {manifest}')
          app.set(f'{{{android_ns}}}label', app_label)
          internet = f'{{{android_ns}}}name'
          if not any(node.tag == 'uses-permission' and node.get(internet) == 'android.permission.INTERNET' for node in root):
              permission = ET.Element('uses-permission')
              permission.set(internet, 'android.permission.INTERNET')
              root.insert(0, permission)
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          # Use conservative Gradle performance defaults. AGP 9 compatibility is handled
          # by pinning the generated Android toolchain to AGP 8.11.1 below; AGP 9 may ignore
          # legacy DSL opt-out properties, so those flags are deliberately not relied upon.
          properties = project / 'android/gradle.properties'
          properties.parent.mkdir(parents=True, exist_ok=True)
          prop_text = properties.read_text(encoding='utf-8') if properties.exists() else ''
          for key, value in (('org.gradle.caching', 'true'), ('org.gradle.parallel', 'true'), ('org.gradle.workers.max', '4'), ('org.gradle.jvmargs', '-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8')):
              if re.search(rf'(?m)^\s*{re.escape(key)}\s*=', prop_text):
                  prop_text = re.sub(rf'(?m)^\s*{re.escape(key)}\s*=.*$', f'{key}={value}', prop_text)
              else:
                  prop_text += f'\n{key}={value}\n'
          properties.write_text(prop_text.lstrip('\n'), encoding='utf-8')

          gradle_files = [project / 'android/app/build.gradle.kts', project / 'android/app/build.gradle']
          gradle = next((p for p in gradle_files if p.exists()), None)
          if gradle is None:
              raise SystemExit('Could not locate android/app/build.gradle(.kts)')
          data = gradle.read_text(encoding='utf-8')
          data = re.sub(r'namespace\s*=\s*["\'][^"\']+["\']', f'namespace = "{application_id}"', data, count=1)
          data = re.sub(r'applicationId\s*=\s*["\'][^"\']+["\']', f'applicationId = "{application_id}"', data, count=1)
          data = data.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          data = data.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
          gradle.write_text(data, encoding='utf-8')

          # Pin generated Android projects to a stable AGP 8 toolchain. AGP 9 ignores
          # legacy DSL opt-outs and breaks a number of existing Flutter plugins.
          android_dir = project / 'android'
          for candidate in (android_dir / 'settings.gradle.kts', android_dir / 'settings.gradle',
                            android_dir / 'build.gradle.kts', android_dir / 'build.gradle'):
              if not candidate.is_file():
                  continue
              source = candidate.read_text(encoding='utf-8')
              source = re.sub(r'(id\s*\(?\s*["\']com\.android\.(?:application|library)["\']\s*\)?\s*version\s*["\'])[^"\']+(["\'])', r'\g<1>8.11.1\2', source)
              source = re.sub(r'(com\.android\.tools\.build:gradle:)[0-9][A-Za-z0-9_.-]*', r'\g<1>8.11.1', source)
              candidate.write_text(source, encoding='utf-8')
          version_catalog = android_dir / 'gradle/libs.versions.toml'
          if version_catalog.is_file():
              catalog = version_catalog.read_text(encoding='utf-8')
              catalog = re.sub(r'(?m)^(\s*(?:agp|androidGradlePlugin|android_gradle_plugin)\s*=\s*")[^"]+(")', r'\g<1>8.11.1\2', catalog)
              version_catalog.write_text(catalog, encoding='utf-8')
          wrapper = android_dir / 'gradle/wrapper/gradle-wrapper.properties'
          if wrapper.is_file():
              wrapper_text = wrapper.read_text(encoding='utf-8')
              wrapper_text = re.sub(r'gradle-[0-9][A-Za-z0-9_.-]*-(?:bin|all)\.zip', 'gradle-8.13-bin.zip', wrapper_text)
              wrapper.write_text(wrapper_text, encoding='utf-8')
          print('Pinned generated Android project to AGP 8.11.1 / Gradle 8.13 where a version declaration is present.')
          PY
          cat > "$RUNNER_TEMP/patch_flutter_plugin_gradle.py" <<'PYPLUGIN'
          import json, re, sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          project_root = Path(sys.argv[1]).resolve() if len(sys.argv) > 1 else None
          def detect_agp_version():
              if project_root is None:
                  return None
              candidates = [
                  project_root / 'android/settings.gradle.kts',
                  project_root / 'android/settings.gradle',
                  project_root / 'android/build.gradle.kts',
                  project_root / 'android/build.gradle',
              ]
              for candidate in candidates:
                  if not candidate.is_file():
                      continue
                  source = candidate.read_text(encoding='utf-8')
                  match = re.search(r'id\s*\(?\s*["\']com\.android\.application["\']\s*\)?\s*version\s*["\']([^"\']+)', source)
                  if match:
                      return match.group(1)
                  match = re.search(r'com\.android\.tools\.build:gradle:([0-9][A-Za-z0-9_.-]*)', source)
                  if match:
                      return match.group(1)
              return None

          agp_version = detect_agp_version()
          package_roots = []
          package_config = project_root / '.dart_tool/package_config.json' if project_root else None
          if package_config and package_config.is_file():
              try:
                  config = json.loads(package_config.read_text(encoding='utf-8'))
                  for item in config.get('packages', []):
                      uri = urlparse(item.get('rootUri', ''))
                      if uri.scheme == 'file':
                          package_roots.append(Path(unquote(uri.path)).resolve())
                      elif not uri.scheme:
                          package_roots.append((package_config.parent / unquote(uri.path)).resolve())
              except Exception as exc:
                  print(f'::warning::Could not read package_config.json for Kotlin preflight: {exc}')
          if not package_roots:
              cache = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
              if cache.exists(): package_roots = list(cache.glob('*'))
          patched = []
          inspected = 0
          for package_dir in package_roots:
                  android_dir = package_dir / 'android'
                  for gradle in (android_dir / 'build.gradle', android_dir / 'build.gradle.kts'):
                      if not gradle.is_file():
                          continue
                      text = gradle.read_text(encoding='utf-8')
                      if not re.search(r'kotlin-android|org\.jetbrains\.kotlin\.android', text):
                          continue
                      inspected += 1
                      original = text
                      is_kts = gradle.suffix == '.kts'
                      plugin_block = re.search(r'(?ms)(plugins\s*\{)(.*?)(\})', text)
                      android_plugin = re.compile(r'(?m)^\s*id\s*\(?\s*["\']com\.android\.(?:library|application)["\']') if is_kts else re.compile(r'(?m)^\s*id\s+["\']com\.android\.(?:library|application)["\']')
                      kotlin_plugin = re.compile(r'(?m)^\s*id\s*\(?\s*["\'](?:kotlin-android|org\.jetbrains\.kotlin\.android)["\']') if is_kts else re.compile(r'(?m)^\s*id\s+["\'](?:kotlin-android|org\.jetbrains\.kotlin\.android)["\']')
                      if plugin_block:
                          body = plugin_block.group(2)
                          lines = body.strip('\n').splitlines() if body.strip('\n') else []
                          android_indexes = [i for i, line in enumerate(lines) if android_plugin.search(line)]
                          kotlin_indexes = [i for i, line in enumerate(lines) if kotlin_plugin.search(line)]
                          # If kotlin is declared in plugins{}, ensure a compatible Android plugin
                          # is declared before it. Preserve any existing Android plugin/version line.
                          if kotlin_indexes and (not android_indexes or min(android_indexes) > min(kotlin_indexes)):
                              kotlin_index = min(kotlin_indexes)
                              if android_indexes:
                                  android_index = min(android_indexes)
                                  android_line = lines.pop(android_index).strip()
                                  if android_index < kotlin_index:
                                      kotlin_index -= 1
                              else:
                                  if agp_version:
                                      android_line = f'id("com.android.library") version "{agp_version}"' if is_kts else f"id 'com.android.library' version '{agp_version}'"
                                  else:
                                      android_line = 'id("com.android.library")' if is_kts else "id 'com.android.library'"
                              kotlin_indexes = [i for i, line in enumerate(lines) if kotlin_plugin.search(line)]
                              kotlin_index = min(kotlin_indexes)
                              indent_match = re.match(r'^\s*', lines[kotlin_index])
                              indent = indent_match.group(0) if indent_match else '    '
                              lines.insert(kotlin_index, indent + android_line)
                              normalized_body = '\n' + '\n'.join(lines) + '\n'
                              text = text[:plugin_block.start(2)] + normalized_body + text[plugin_block.end(2):]
                      # Legacy `apply plugin` files, and mixed plugins{} + imperative application.
                      kapply_pattern = re.compile(r'(?m)^\s*apply\s*\(\s*plugin\s*=\s*["\'](?:kotlin-android|org\.jetbrains\.kotlin\.android)["\']\s*\)') if is_kts else re.compile(r'(?m)^\s*apply\s+plugin\s*:\s*["\'](?:kotlin-android|org\.jetbrains\.kotlin\.android)["\']')
                      aapply_pattern = re.compile(r'(?m)^\s*apply\s*\(\s*plugin\s*=\s*["\']com\.android\.(?:library|application)["\']\s*\)') if is_kts else re.compile(r'(?m)^\s*apply\s+plugin\s*:\s*["\']com\.android\.(?:library|application)["\']')
                      kotlin_apply = kapply_pattern.search(text)
                      if kotlin_apply:
                          android_before = aapply_pattern.search(text[:kotlin_apply.start()])
                          if not android_before:
                              android_line = 'apply(plugin = "com.android.library")' if is_kts else "apply plugin: 'com.android.library'"
                              # Put the Android plugin before Kotlin. If a plugins{} block exists,
                              # it is executed first, so use it when the Kotlin apply is outside it.
                              block = re.search(r'(?ms)(plugins\s*\{)(.*?)(\})', text)
                              if block and not kotlin_plugin.search(block.group(2)):
                                  if not android_plugin.search(block.group(2)):
                                      new_body = block.group(2)
                                      lines = new_body.strip('\n').splitlines() if new_body.strip('\n') else []
                                      lines.append(('    ' + ('id("com.android.library")' if is_kts else "id 'com.android.library'")))
                                      rebuilt = '\n' + '\n'.join(lines) + '\n'
                                      text = text[:block.start(2)] + rebuilt + text[block.end(2):]
                                  # If Android is already applied in plugins{}, its application
                                  # precedes imperative `apply plugin: kotlin-android` automatically.
                              else:
                                  kotlin_apply = kapply_pattern.search(text)
                                  text = text[:kotlin_apply.start()] + android_line + '\n' + text[kotlin_apply.start():]
                      if text != original:
                          gradle.write_text(text, encoding='utf-8')
                          patched.append(str(gradle))
