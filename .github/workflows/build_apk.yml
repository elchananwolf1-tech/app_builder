              if (!_isSafeFolderPath(newPath) || newPath == oldPath || newPath.startsWith('$oldPath/')) { _message('Choose a valid new folder name.'); return; }
              final newConflicts = _folders.contains(newPath) || _folders.any((folder) => folder.startsWith('$newPath/')) || _allProjectFiles().keys.any((file) => file.startsWith('$newPath/'));
              if (newConflicts) { _message('A folder or file already exists at that destination.'); return; }
              setState(() {
                final movedFiles = <String, String>{};
                for (final entry in _additionalFiles.entries) {
                  final key = entry.key.startsWith('$oldPath/') ? '$newPath${entry.key.substring(oldPath.length)}' : entry.key;
                  movedFiles[key] = entry.value;
                }
                final movedFolders = <String>{};
                for (final folder in _folders) {
                  if (folder == oldPath || folder.startsWith('$oldPath/')) {
                    movedFolders.add('$newPath${folder.substring(oldPath.length)}');
                  } else {
                    movedFolders.add(folder);
