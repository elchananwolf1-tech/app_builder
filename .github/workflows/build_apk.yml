              if (!_isSafeProjectFilePath(entry.key) || entry.key == 'lib/main.dart') continue;
              final bytes = Uint8List.fromList(utf8.encode(entry.value));
              backup.addFile(ArchiveFile(entry.key, bytes.length, bytes));
