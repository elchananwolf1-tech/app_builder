          class LivePreviewScreen extends StatefulWidget {
            const LivePreviewScreen({super.key, required this.root, required this.title});
            final Directory root;
            final String title;

            @override
            State<LivePreviewScreen> createState() => _LivePreviewScreenState();
          }

          class _LivePreviewScreenState extends State<LivePreviewScreen> {
            HttpServer? _server;
            WebViewController? _controller;
            String? _error;
            bool _loading = true;
            Uri? _previewUri;

            @override
            void initState() {
              super.initState();
              unawaited(_startPreviewServer());
            }

            Future<void> _startPreviewServer() async {
              final previousServer = _server;
              if (previousServer != null) {
                try { await previousServer.close(force: true); } catch (_) {}
                _server = null;
              }
              if (mounted) setState(() { _loading = true; _error = null; _controller = null; });
              try {
                if (!await File('${widget.root.path}${Platform.pathSeparator}index.html').exists()) {
                  throw Exception('Preview index.html was not found in ${widget.root.path}.');
                }
                final server = await HttpServer.bind(InternetAddress.loopbackIPv4, 0, shared: false);
                _server = server;
                unawaited(server.forEach(_serveRequest));
                final uri = Uri.parse('http://127.0.0.1:${server.port}/index.html');
                final controller = WebViewController();
                await controller.setJavaScriptMode(JavaScriptMode.unrestricted);
                await controller.setNavigationDelegate(NavigationDelegate(
                  onNavigationRequest: (request) {
                    final target = Uri.tryParse(request.url);
                    if (target != null && target.scheme == 'http' && target.host == '127.0.0.1' && target.port == server.port) {
                      return NavigationDecision.navigate;
                    }
                    // Keep the local preview sandboxed to its own web bundle.
                    return NavigationDecision.prevent;
                  },
                  onWebResourceError: (error) {
                    if (error.isForMainFrame == true && mounted) setState(() => _error = 'Preview page error: ${error.description}');
                  },
                ));
                _previewUri = uri;
                _controller = controller;
                await controller.loadRequest(uri);
                if (mounted) setState(() { _loading = false; _error = null; });
              } catch (error) {
                if (mounted) setState(() { _loading = false; _error = error.toString(); });
              }
            }

            Future<void> _serveRequest(HttpRequest request) async {
              try {
                final raw = request.uri.path == '/' ? 'index.html' : Uri.decodeComponent(request.uri.path.substring(1));
                final segments = raw.replaceAll('\\', '/').split('/');
                if (raw.startsWith('/') || segments.any((part) => part.isEmpty || part == '.' || part == '..') || raw.contains('\\')) {
                  request.response.statusCode = HttpStatus.badRequest;
                  await request.response.close();
                  return;
                }
                final file = File('${widget.root.path}${Platform.pathSeparator}${segments.join(Platform.pathSeparator)}');
                if (!await file.exists()) {
                  request.response.statusCode = HttpStatus.notFound;
                  request.response.headers.set(HttpHeaders.contentTypeHeader, 'text/plain; charset=utf-8');
                  request.response.write('Not found: $raw');
                  await request.response.close();
                  return;
                }
                final extension = raw.contains('.') ? raw.split('.').last.toLowerCase() : '';
                const mimeTypes = <String, String>{
                  'html': 'text/html; charset=utf-8',
                  'js': 'application/javascript; charset=utf-8',
                  'mjs': 'application/javascript; charset=utf-8',
                  'css': 'text/css; charset=utf-8',
                  'json': 'application/json; charset=utf-8',
                  'wasm': 'application/wasm',
                  'svg': 'image/svg+xml',
                  'png': 'image/png',
                  'jpg': 'image/jpeg',
                  'jpeg': 'image/jpeg',
                  'webp': 'image/webp',
                  'ico': 'image/x-icon',
                  'woff': 'font/woff',
                  'woff2': 'font/woff2',
                  'ttf': 'font/ttf',
                  'txt': 'text/plain; charset=utf-8',
                  'xml': 'application/xml; charset=utf-8',
                };
                request.response.headers.set(HttpHeaders.contentTypeHeader, mimeTypes[extension] ?? 'application/octet-stream');
                request.response.headers.set('X-Content-Type-Options', 'nosniff');
                await request.response.addStream(file.openRead());
                await request.response.close();
              } catch (_) {
                try { request.response.statusCode = HttpStatus.internalServerError; await request.response.close(); } catch (_) {}
              }
            }

            Future<void> _retryPreview() async {
              if (_controller == null || _previewUri == null) {
                await _startPreviewServer();
              } else {
                await _reload();
              }
            }

            Future<void> _reload() async {
              final controller = _controller;
              final uri = _previewUri;
              if (controller == null || uri == null) return;
              setState(() { _loading = true; _error = null; });
              try {
                await controller.reload();
              } catch (error) {
                if (mounted) setState(() => _error = error.toString());
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            void dispose() {
              final server = _server;
              if (server != null) unawaited(server.close(force: true));
              super.dispose();
            }

            @override
            Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: Text(widget.title), actions: [IconButton(tooltip: 'Reload or retry preview', onPressed: _retryPreview, icon: const Icon(Icons.refresh))]),
              body: Column(children: [
                if (_loading) const LinearProgressIndicator(),
                if (_error != null && _controller != null) Padding(padding: const EdgeInsets.all(10), child: SelectableText(_error!)),
                Expanded(child: _controller != null
                  ? WebViewWidget(controller: _controller!)
                  : _loading
                    ? const Center(child: CircularProgressIndicator())
                    : Center(child: Padding(padding: const EdgeInsets.all(24), child: Column(mainAxisSize: MainAxisSize.min, children: [
                        const Icon(Icons.web_asset_off, size: 48),
                        const SizedBox(height: 12),
                        Text(_error ?? 'Could not start the local preview.'),
                        const SizedBox(height: 12),
                        FilledButton.icon(onPressed: _retryPreview, icon: const Icon(Icons.refresh), label: const Text('Retry preview')),
                      ])))),
              ]),
            );
          }

          class CodeEditorScreen extends StatefulWidget {
            const CodeEditorScreen({super.key, required this.title, required this.initialText, required this.kind});
            final String title;
            final String initialText;
            final String kind;

            @override
            State<CodeEditorScreen> createState() => _CodeEditorScreenState();
          }

          class _CodeEditorScreenState extends State<CodeEditorScreen> {
            late final CodeController _controller;

            @override
            void initState() {
              super.initState();
              _controller = CodeController(
                text: widget.initialText,
                language: widget.kind == 'yaml' ? yaml_language.yaml : dart_language.dart,
              );
            }

            @override
            void dispose() { _controller.dispose(); super.dispose(); }

            @override
            Widget build(BuildContext context) {
              final dark = Theme.of(context).brightness == Brightness.dark;
              return Scaffold(
                appBar: AppBar(title: Text(widget.title), actions: [IconButton(tooltip: 'Save changes', onPressed: () => Navigator.pop(context, _controller.text), icon: const Icon(Icons.check))]),
                body: CodeTheme(
                  data: CodeThemeData(styles: dark ? monokaiSublimeTheme : githubTheme),
                  child: CodeField(
                    controller: _controller,
                    expands: true,
                    wrap: false,
                    padding: const EdgeInsets.all(16),
                    textStyle: const TextStyle(fontFamily: 'monospace', fontSize: 13, height: 1.45),
                    gutterStyle: GutterStyle(showLineNumbers: true, showErrors: false, showFoldingHandles: true, width: 54, margin: 12),
                  ),
                ),
              );
            }
          }
          DART
          # Builder launcher assets come from the template repository's root logo.png.
          # The monochrome alpha mask enables Android 13+ themed icons; the system chooses tint.
          if [[ -f "$GITHUB_WORKSPACE/logo.png" ]]; then
            if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y python3-pil
            fi
            python3 "$RUNNER_TEMP/prepare_launcher_icons.py" "$GITHUB_WORKSPACE/logo.png" "$BUILDER_DIR/assets" true '#FFFFFF' true
            flutter pub add --dev flutter_launcher_icons:^0.14.4
            cat >> pubspec.yaml <<'ICONCONFIG'
          flutter_launcher_icons:
            android: true
            image_path: "assets/app_icon.png"
            adaptive_icon_background: "assets/app_icon_background.png"
            adaptive_icon_foreground: "assets/app_icon_foreground.png"
            adaptive_icon_monochrome: "assets/app_icon_monochrome.png"
          ICONCONFIG
            dart run flutter_launcher_icons
          else
            echo "::warning::logo.png was not found at the repository root; using Flutter's default launcher icon."
          fi
          flutter pub get
          python3 "$RUNNER_TEMP/patch_flutter_plugin_gradle.py" "$BUILDER_DIR"
          flutter build apk --release --no-pub --dart-define=BUILDER_REPOSITORY="$GITHUB_REPOSITORY"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/simple-app-builder.apk"

      # Upload the builder first so it remains available even when a user's app has a
      # Dart compile error later in the same run.
      - name: Upload Simple App Builder APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: simple-app-builder-${{ github.run_number }}
          path: dist/simple-app-builder.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Build the target project from the multi-file source archive after the builder artifact is safe.
      - name: Create the requested Flutter project and restore its Dart file tree
        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        env:
          PROJECT_NAME: ${{ github.event.client_payload.project_name }}
          PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          DART_CODE: ${{ github.event.client_payload.dart_code }}
          SOURCE_ARCHIVE_B64: ${{ github.event.client_payload.source_archive_base64 }}
          SOURCE_ARCHIVE_PATH: ${{ github.workspace }}/.simple-app-builder/source.zip
          DEPENDENCIES: ${{ github.event.client_payload.dependencies }}
          ICON_PATH: ${{ github.event.client_payload.icon_path }}
          REMOVE_BACKGROUND: ${{ github.event.client_payload.remove_background }}
          ICON_BACKGROUND_COLOR: ${{ github.event.client_payload.icon_background_color }}
          DYNAMIC_THEMED_ICON: ${{ github.event.client_payload.dynamic_themed_icon }}
        run: |
          set -euo pipefail
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          ORG="${PACKAGE_NAME%.*}"
          APP_SLUG="${PACKAGE_NAME##*.}"
          flutter create --org "$ORG" --project-name "$APP_SLUG" "$TARGET_DIR"

          # The builder commits its source ZIP to this repository before dispatching the
          # event. Reading it from checkout avoids duplicating large source in GitHub's
          # 64 KB repository_dispatch payload. Legacy inline archive payloads remain supported.
          # Only safe Dart files under lib/ are restored; zip-slip and oversized archives fail clearly.
          python3 - "$TARGET_DIR" <<'PYFILES'
          import base64, io, os, re, shutil, sys, zipfile
          from pathlib import Path, PurePosixPath

          target = Path(sys.argv[1]).resolve()
          bundle = os.environ.get('SOURCE_ARCHIVE_B64', '').strip()
          archive_path = Path(os.environ.get('SOURCE_ARCHIVE_PATH', '.simple-app-builder/source.zip'))
          legacy_source = os.environ.get('DART_CODE', '')
          lib_dir = target / 'lib'
          shutil.rmtree(lib_dir, ignore_errors=True)
          lib_dir.mkdir(parents=True, exist_ok=True)

          if bundle or archive_path.is_file():
              try:
                  zipped = base64.b64decode(bundle, validate=True) if bundle else archive_path.read_bytes()
                  if len(zipped) > 5 * 1024 * 1024:
                      raise ValueError('compressed archive exceeds 5 MB')
                  with zipfile.ZipFile(io.BytesIO(zipped)) as archive:
                      entries = [info for info in archive.infolist() if not info.is_dir()]
                      if not entries:
                          raise ValueError('source archive is empty')
                      if len(entries) > 200:
                          raise ValueError('source archive contains more than 200 files')
                      total_unpacked = 0
                      for info in entries:
                          rel = PurePosixPath(info.filename)
                          if rel.is_absolute() or '..' in rel.parts or '\\' in info.filename:
                              raise ValueError(f'unsafe file path: {info.filename!r}')
                          if len(rel.parts) < 2 or rel.parts[0] != 'lib' or rel.suffix != '.dart':
                              raise ValueError(f'only Dart files under lib/ are allowed: {info.filename!r}')
                          if any(part in ('', '.') for part in rel.parts):
                              raise ValueError(f'invalid file path: {info.filename!r}')
                          if info.file_size > 1024 * 1024:
                              raise ValueError(f'file is larger than 1 MB: {info.filename!r}')
                          total_unpacked += info.file_size
                          if total_unpacked > 2 * 1024 * 1024:
                              raise ValueError('total Dart source exceeds 2 MB')
                          destination = (target / Path(*rel.parts)).resolve()
                          if lib_dir.resolve() not in destination.parents:
                              raise ValueError(f'path escapes lib/: {info.filename!r}')
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          destination.write_bytes(archive.read(info))
              except (ValueError, zipfile.BadZipFile, OSError) as exc:
                  raise SystemExit(f'Could not restore Dart source archive: {exc}')
          else:
              if not legacy_source.strip():
                  raise SystemExit('No source archive or legacy dart_code was provided.')
              (lib_dir / 'main.dart').write_text(legacy_source, encoding='utf-8')

          main_file = lib_dir / 'main.dart'
          if not main_file.is_file() or not main_file.read_text(encoding='utf-8').strip():
              raise SystemExit('Project source must contain a non-empty lib/main.dart entry point.')
          print('Restored source tree:')
          for source_file in sorted(lib_dir.rglob('*.dart')):
              print(f'  {source_file.relative_to(target)}')
          PYFILES

          python3 "$RUNNER_TEMP/patch_android_project.py" "$TARGET_DIR" "$PROJECT_NAME" "$PACKAGE_NAME"

          # Detect packages across every Dart source file, then merge with explicitly
          # requested packages. This supports imports in lib/screens/, lib/widgets/, etc.
          python3 - "$TARGET_DIR" > "$RUNNER_TEMP/target_dependencies.txt" <<'PYDEPS'
          import os, re, sys
          from pathlib import Path
          target = Path(sys.argv[1])
          packages = set()
          for source_file in (target / 'lib').rglob('*.dart'):
              source = source_file.read_text(encoding='utf-8')
              packages.update(re.findall(r"package:([A-Za-z][A-Za-z0-9_]*)/", source))
          for dep in re.split(r'[,;\s]+', os.environ.get('DEPENDENCIES', '').strip()):
              if dep:
                  if not re.fullmatch(r'[a-z][a-z0-9_]*', dep):
                      raise SystemExit(f'Invalid dependency package name: {dep!r}')
                  packages.add(dep)
          own_package = os.environ.get('PACKAGE_NAME', '').split('.')[-1]
          ignored = {'flutter', 'flutter_test', 'integration_test', own_package}
          for package in sorted(packages - ignored):
              if re.fullmatch(r'[a-z][a-z0-9_]*', package):
                  print(package)
          PYDEPS
          mapfile -t EXTRA_DEPENDENCIES < "$RUNNER_TEMP/target_dependencies.txt"
          cd "$TARGET_DIR"
          if ((${#EXTRA_DEPENDENCIES[@]})); then
            echo "Installing detected/requested package dependencies: ${EXTRA_DEPENDENCIES[*]}"
            flutter pub add "${EXTRA_DEPENDENCIES[@]}"
          fi
          flutter pub get

          # Best-effort compatibility repair for cached Flutter plugins with legacy or
          # out-of-order Kotlin/Android Gradle plugin declarations. The same preflight
          # also runs when building the builder APK itself.
          python3 "$RUNNER_TEMP/patch_flutter_plugin_gradle.py" "$TARGET_DIR"

      - name: Apply selected image or repository logo.png to Android launcher icons
        if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.build_format != 'web_preview' }}
        shell: bash
        env:
          ICON_PATH: ${{ github.event.client_payload.icon_path }}
          HAS_CUSTOM_ICON: ${{ github.event.client_payload.has_custom_icon }}
          REMOVE_BACKGROUND: ${{ github.event.client_payload.remove_background }}
          ICON_BACKGROUND_COLOR: ${{ github.event.client_payload.icon_background_color }}
          DYNAMIC_THEMED_ICON: ${{ github.event.client_payload.dynamic_themed_icon }}
        run: |
          set -euo pipefail
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          ICON_SOURCE=""
          if [[ "${HAS_CUSTOM_ICON,,}" == "true" ]]; then
            if [[ ! "$ICON_PATH" =~ ^\.simple-app-builder/icons/[0-9]+-[0-9]+\.png$ ]]; then
              echo 'ERROR: The requested icon path is invalid.' >&2
              exit 1
            fi
            ICON_SOURCE="$GITHUB_WORKSPACE/$ICON_PATH"
            if [[ ! -f "$ICON_SOURCE" ]]; then
              echo "ERROR: A custom icon was requested, but $ICON_PATH is missing from the checked-out repository." >&2
              exit 1
            fi
          elif [[ -f "$GITHUB_WORKSPACE/logo.png" ]]; then
            ICON_SOURCE="$GITHUB_WORKSPACE/logo.png"
            echo 'No project-specific icon was selected; using repository-root logo.png as the fallback.'
          else
            echo 'No project-specific icon and no logo.png fallback were found; keeping Flutter launcher icons.'
            exit 0
          fi
          if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y python3-pil
          fi
          mkdir -p "$TARGET_DIR/assets"
          REMOVE_BACKGROUND="${REMOVE_BACKGROUND:-true}"
          ICON_BACKGROUND_COLOR="${ICON_BACKGROUND_COLOR:-#FFFFFF}"
          DYNAMIC_THEMED_ICON="${DYNAMIC_THEMED_ICON:-true}"
          if [[ ! "$ICON_BACKGROUND_COLOR" =~ ^#[0-9A-Fa-f]{6}$ ]]; then
            echo "ERROR: Invalid icon background color: $ICON_BACKGROUND_COLOR" >&2
            exit 1
          fi
          # When background removal is off, leave the original artwork intact and
          # use a neutral adaptive background. The monochrome mask still removes white.
          PROCESS_BACKGROUND_COLOR="$ICON_BACKGROUND_COLOR"
          ADAPTIVE_BACKGROUND_COLOR="$ICON_BACKGROUND_COLOR"
          if [[ "${REMOVE_BACKGROUND,,}" == "true" ]]; then
            # For true transparency, adaptive_icon_background must be a PNG asset,
            # not a hex color (a hex color necessarily paints a solid square).
            ADAPTIVE_BACKGROUND_COLOR="assets/app_icon_background.png"
          else
            PROCESS_BACKGROUND_COLOR="#FFFFFF"
            ADAPTIVE_BACKGROUND_COLOR="$ICON_BACKGROUND_COLOR"
          fi
          python3 "$RUNNER_TEMP/prepare_launcher_icons.py" "$ICON_SOURCE" "$TARGET_DIR/assets" "$REMOVE_BACKGROUND" "$PROCESS_BACKGROUND_COLOR" "$DYNAMIC_THEMED_ICON"
          cd "$TARGET_DIR"
          flutter pub add --dev flutter_launcher_icons:^0.14.4
          cat >> pubspec.yaml <<ICONCONFIG
          flutter_launcher_icons:
            android: true
            image_path: "assets/app_icon.png"
            adaptive_icon_background: "$ADAPTIVE_BACKGROUND_COLOR"
            adaptive_icon_foreground: "assets/app_icon_foreground.png"
          ICONCONFIG
          if [[ "${DYNAMIC_THEMED_ICON,,}" == "true" ]]; then
            printf '  adaptive_icon_monochrome: "assets/app_icon_monochrome.png"\n' >> pubspec.yaml
            echo 'Dynamic themed icon enabled: Android 13+ monochrome layer will be generated.'
          else
            echo 'Dynamic themed icon disabled by project settings.'
          fi
          dart run flutter_launcher_icons
          echo 'Applied color, round, and adaptive launcher icons using the selected background options.'

      - name: Configure Android release signing (optional)
        if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sign_release == true && (github.event.client_payload.build_format == '' || github.event.client_payload.build_format == 'apk' || github.event.client_payload.build_format == 'aab') }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_KEY_ALIAS" ]]; then
            echo 'Signing was requested, but one or more required Actions secrets are missing.' >&2
            echo 'Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS in Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$TARGET_DIR/android/upload-keystore.jks"
          cat > "$TARGET_DIR/android/key.properties" <<KEYPROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          KEYPROPS
          python3 - "$TARGET_DIR" <<'PYSIGN'
          import re, sys
          from pathlib import Path
          
          def block_range(source, pattern):
              match = re.search(pattern, source, re.M)
              if not match:
                  return None
              opening = source.find('{', match.start())
              if opening < 0:
                  return None
              depth = 0
              quote = None
              escaped = False
              for index in range(opening, len(source)):
                  char = source[index]
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in ('"', "'"):
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return opening, index
              return None
          
          def insert_line_before(source, index, content):
              line_start = source.rfind('\n', 0, index) + 1
              return source[:line_start] + content.rstrip() + '\n' + source[line_start:]
          
          root = Path(sys.argv[1])
          groovy = root / 'android/app/build.gradle'
          kotlin = root / 'android/app/build.gradle.kts'
          gradle = groovy if groovy.exists() else kotlin
          if not gradle.exists():
              raise SystemExit('Could not find app/build.gradle or app/build.gradle.kts for signing.')
          text = gradle.read_text(encoding='utf-8')
          is_kts = gradle.suffix == '.kts'
          if 'import java.util.Properties' not in text:
              text = 'import java.util.Properties\nimport java.io.FileInputStream\n' + text
          if is_kts:
              props = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) { keystoreProperties.load(FileInputStream(keystorePropertiesFile)) }
          '''
          else:
              props = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }
          '''
          if 'keystorePropertiesFile' not in text:
              android_match = re.search(r'(?m)^android\s*\{', text)
              if not android_match:
                  raise SystemExit('Could not find android { in app Gradle file; signing config cannot be applied safely.')
              text = text[:android_match.start()] + props.rstrip() + '\n\n' + text[android_match.start():]
          
          if is_kts:
              release_entry = '''        create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
          '''
          else:
              release_entry = '''        release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
          '''
          config_range = block_range(text, r'(?m)^\s*signingConfigs\s*\{')
          config_text = text[config_range[0]:config_range[1]+1] if config_range else ''
          if is_kts:
              has_release_config = 'create("release")' in config_text or bool(re.search(r'(?m)^\s*getByName\("release"\)\s*\{', config_text))
          else:
              has_release_config = bool(re.search(r'(?m)^\s*release\s*\{', config_text))
          if not has_release_config:
              if config_range:
                  text = insert_line_before(text, config_range[1], release_entry)
              else:
                  build_types = re.search(r'(?m)^\s*buildTypes\s*\{', text)
                  if not build_types:
                      raise SystemExit('Could not find buildTypes { in app Gradle file; signing config cannot be applied safely.')
                  if is_kts:
                      block = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
                  else:
                      block = '''    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
                  text = insert_line_before(text, build_types.start(), block)
          
          build_range = block_range(text, r'(?m)^\s*buildTypes\s*\{')
          if not build_range:
              raise SystemExit('Could not locate buildTypes block for release signing.')
          build_body = text[build_range[0]+1:build_range[1]]
          release_range = block_range(build_body, r'(?m)^\s*release\s*\{')
          if not release_range:
              raise SystemExit('Could not locate buildTypes.release block for release signing.')
          release_body = build_body[release_range[0]+1:release_range[1]]
          if is_kts:
              release_body = re.sub(r'signingConfig\s*=\s*signingConfigs(?:\.debug|\.getByName\(["\']debug["\']\))', 'signingConfig = signingConfigs.getByName("release")', release_body)
              if not re.search(r'(?m)^\s*signingConfig\s*=', release_body):
                  release_body = '\n            signingConfig = signingConfigs.getByName("release")' + release_body
          else:
              release_body = re.sub(r'signingConfig\s+(?:signingConfigs\.debug|signingConfigs\.getByName\(["\']debug["\']\))', 'signingConfig signingConfigs.release', release_body)
              if not re.search(r'(?m)^\s*signingConfig\s+', release_body):
                  release_body = '\n            signingConfig signingConfigs.release' + release_body
          absolute_release_start = build_range[0] + 1 + release_range[0] + 1
          absolute_release_end = build_range[0] + 1 + release_range[1]
          text = text[:absolute_release_start] + release_body + text[absolute_release_end:]
          gradle.write_text(text, encoding='utf-8')
          print(f'Configured optional release signing in {gradle}; keystore secrets were not logged.')
          PYSIGN

      - name: Build requested output
        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        env:
          BUILD_FORMAT: ${{ github.event.client_payload.build_format }}
          SIGN_RELEASE: ${{ github.event.client_payload.sign_release }}
        run: |
          set -euo pipefail
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$TARGET_DIR"
          BUILD_FORMAT="${BUILD_FORMAT:-apk}"
          case "$BUILD_FORMAT" in
            web_preview)
              echo 'Building Flutter Web preview. This compiles the source for web; no Android package is created.'
              flutter create --platforms=web .
              flutter build web --release --no-pub
              (cd build/web && zip -q -r "$GITHUB_WORKSPACE/dist/${{ steps.metadata.outputs.slug }}-web.zip" .)
              ;;
            aab)
              flutter build appbundle --release --no-pub
              cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/${{ steps.metadata.outputs.slug }}-release.aab"
              ;;
            apk)
              flutter build apk --release --no-pub
              cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/${{ steps.metadata.outputs.slug }}-release.apk"
              ;;
            *) echo "Unsupported build format: $BUILD_FORMAT" >&2; exit 1 ;;
          esac

      - name: Upload generated release APK
        if: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.build_format == '' || github.event.client_payload.build_format == 'apk') }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk-${{ steps.metadata.outputs.slug }}
          path: dist/${{ steps.metadata.outputs.slug }}-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload generated Android App Bundle
        if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.build_format == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-aab-${{ steps.metadata.outputs.slug }}
          path: dist/${{ steps.metadata.outputs.slug }}-release.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload generated Flutter Web preview
        if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.build_format == 'web_preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-web-${{ steps.metadata.outputs.slug }}
          path: dist/${{ steps.metadata.outputs.slug }}-web.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
