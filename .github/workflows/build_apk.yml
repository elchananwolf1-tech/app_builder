            Future<void> _renameFolder(String oldPath) async {
              final controller = TextEditingController(text: oldPath);
              final newPath = await showDialog<String>(context: context, builder: (dialogContext) => AlertDialog(
                title: const Text('Rename folder'),
                content: TextField(controller: controller, autofocus: true, autocorrect: false, decoration: const InputDecoration(labelText: 'New folder path', hintText: 'lib/models/new_name')),
                actions: [TextButton(onPressed: () => Navigator.pop(dialogContext), child: const Text('Cancel')), FilledButton(onPressed: () => Navigator.pop(dialogContext, controller.text.trim()), child: const Text('Rename'))],
              ));
              controller.dispose();
              if (newPath == null || newPath == oldPath) return;
              if (!_isSafeFolderPath(newPath) || newPath.startsWith('$oldPath/') || oldPath.startsWith('$newPath/')) { _message('Choose a valid destination folder outside the folder being renamed.'); return; }
              final newConflicts = _folders.contains(newPath) || _folders.any((folder) => folder.startsWith('$newPath/')) || _additionalFiles.keys.any((file) => file.startsWith('$newPath/'));
              if (newConflicts) { _message('The destination folder or a file in it already exists.'); return; }
              setState(() {
                final movedFiles = <String, String>{};
                for (final entry in _additionalFiles.entries) {
                  final key = entry.key.startsWith('$oldPath/') ? '$newPath${entry.key.substring(oldPath.length)}' : entry.key;
                  movedFiles[key] = entry.value;
                }
                final movedFolders = <String>{};
                for (final folder in _folders) {
                  if (folder == oldPath || folder.startsWith('$oldPath/')) {
                    movedFolders.add('$newPath${folder.substring(oldPath.length)}');
                  } else {
                    movedFolders.add(folder);
                  }
                }
                movedFolders.addAll(_folderAncestors('$newPath/placeholder.dart'));
                _additionalFiles = movedFiles;
                _folders = movedFolders;
                _selectedTemplate = 'Custom project';
              });
              _message('Folder renamed to $newPath. Imports in Dart files may need updating.');
            }

            Future<void> _deleteFolder(String path) async {
              final confirmed = await showDialog<bool>(context: context, builder: (dialogContext) => AlertDialog(
                title: const Text('Delete folder?'),
                content: Text('Delete folder $path and all Dart files inside it? lib/main.dart is never deleted by this action.'),
                actions: [TextButton(onPressed: () => Navigator.pop(dialogContext, false), child: const Text('Cancel')), FilledButton(onPressed: () => Navigator.pop(dialogContext, true), child: const Text('Delete folder'))],
              ));
              if (confirmed != true) return;
              setState(() {
                _additionalFiles.removeWhere((file, _) => file.startsWith('$path/'));
                _folders.removeWhere((folder) => folder == path || folder.startsWith('$path/'));
              });
            }

            Future<void> _applyTemplate() async {
              if (_selectedTemplate == 'Custom project') {
                _message('Choose a starter template first.');
