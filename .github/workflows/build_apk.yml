                  iconBackgroundColor: iconBackgroundColor ?? this.iconBackgroundColor,
                  dynamicThemedIcon: dynamicThemedIcon ?? this.dynamicThemedIcon,
                  buildFormat: buildFormat ?? this.buildFormat,
                  signRelease: signRelease ?? this.signRelease,
                );

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'name': name,
                  'packageName': packageName,
                  'dartCode': dartCode,
                  'additionalFiles': additionalFiles,
                  'folders': folders.toList()..sort(),
                  'dependencies': dependencies,
                  'iconBase64': iconBase64,
                  'repository': repository,
                  'removeBackground': removeBackground,
                  'iconBackgroundColor': iconBackgroundColor,
                  'dynamicThemedIcon': dynamicThemedIcon,
                  'buildFormat': buildFormat,
                  'signRelease': signRelease,
                };

            factory AppProject.fromJson(Map<String, dynamic> json) {
              final files = <String, String>{};
              final rawFiles = json['additionalFiles'];
              if (rawFiles is Map) {
                for (final entry in rawFiles.entries) {
                  final path = entry.key.toString();
                  if (_isSafeDartPath(path) && path != 'lib/main.dart') files[path] = entry.value.toString();
                }
              }
              final folders = <String>{};
              final rawFolders = json['folders'];
              if (rawFolders is List) {
                for (final folder in rawFolders) {
                  final path = folder.toString();
                  if (_isSafeFolderPath(path)) folders.add(path);
                }
              }
              for (final path in files.keys) {
                folders.addAll(_folderAncestors(path));
              }
              return AppProject(
                id: (json['id'] ?? DateTime.now().microsecondsSinceEpoch).toString(),
                name: (json['name'] ?? 'Untitled app').toString(),
                packageName: (json['packageName'] ?? 'com.example.myapp').toString(),
                dartCode: (json['dartCode'] ?? '').toString(),
                additionalFiles: files,
                folders: folders,
                dependencies: (json['dependencies'] ?? '').toString(),
                iconBase64: json['iconBase64']?.toString(),
                repository: (json['repository'] ?? '').toString(),
                removeBackground: json['removeBackground'] is bool ? json['removeBackground'] as bool : true,
                iconBackgroundColor: (json['iconBackgroundColor'] ?? '#FFFFFF').toString(),
                dynamicThemedIcon: json['dynamicThemedIcon'] is bool ? json['dynamicThemedIcon'] as bool : true,
                buildFormat: (json['buildFormat'] ?? 'apk').toString() == 'aab' ? 'aab' : 'apk',
                signRelease: json['signRelease'] is bool ? json['signRelease'] as bool : false,
              );
            }
          }

