              _androidDependencies.removeListener(_scheduleDraftSave);
              if (_name.text.trim().isNotEmpty) unawaited(widget.onSaveProject(_project()));
              _name.dispose();
              _packageName.dispose();
              _version.dispose();
              _dependencies.dispose();
              _androidDependencies.dispose();
              _repositoryName.dispose();
              super.dispose();
