            String _stubForProjectFile(String path, String kind) {
              final leaf = path.split('/').last;
              if (kind == 'dart') {
                if (path == 'lib/main.dart') return '''import 'package:flutter/material.dart';

          void main() => runApp(const _App());

          class _App extends StatelessWidget {
            const _App({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              debugShowCheckedModeBanner: false,
              theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.indigo),
              home: const Scaffold(body: Center(child: Text('Your app starts here'))),
            );
          }
          ''';
                final className = _widgetClassNameForPath(path);
                return '''import 'package:flutter/material.dart';
          
          class $className extends StatelessWidget {
            const $className({super.key});
          
            @override
            Widget build(BuildContext context) => const SizedBox.shrink();
          }
          ''';
              }
              if (kind == 'kotlin' || kind == 'java') {
                final root = kind == 'kotlin' ? '/kotlin/' : '/java/';
                final pieces = path.split('/');
                final rootIndex = pieces.indexOf(kind);
                final base = rootIndex >= 0 && rootIndex + 1 < pieces.length - 1 ? pieces.sublist(rootIndex + 1, pieces.length - 1).join('.') : _packageName.text.trim();
                final packagePath = base.isEmpty ? _packageName.text.trim() : base;
                final className = leaf.replaceFirst(RegExp(kind == 'kotlin' ? r'\.kt$' : r'\.java$'), '');
                if (kind == 'kotlin') {
                  if (className == 'MainActivity') return 'package $packagePath\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity : FlutterActivity()\n';
                  return 'package $packagePath\n\nclass $className {\n}\n';
                }
                if (className == 'MainActivity') return 'package $packagePath;\n\nimport io.flutter.embedding.android.FlutterActivity;\n\npublic class MainActivity extends FlutterActivity {\n}\n';
                return 'package $packagePath;\n\npublic class $className {\n}\n';
              }
              if (kind == 'xml') {
                if (leaf == 'AndroidManifest.xml') return '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application>
            </application>
          </manifest>
          ''';
                return '<resources>\n</resources>\n';
              }
              if (kind == 'proguard') return '# Add Android R8/ProGuard rules here.\n';
              return '';
