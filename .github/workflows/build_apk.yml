            Future<void> _importMainDart() async {
              final picked = await FilePicker.pickFile(dialogTitle: 'Select the app entry-point Dart file', type: FileType.custom, allowedExtensions: const ['dart']);
              if (picked == null) return;
              try {
                final bytes = await picked.readAsBytes();
                if (bytes.isEmpty) { _message('The selected Dart file is empty.'); return; }
                setState(() {
                  _dartCode = utf8.decode(bytes, allowMalformed: true);
                  _mainFileExists = true;
                  _folders.addAll(_folderAncestors('lib/main.dart'));
                  _selectedTemplate = 'Custom project';
                });
                _scheduleDraftSave();
                _message('Imported ${picked.name} as lib/main.dart. Use folder or ZIP import to preserve multiple file paths.');
              } catch (error) {
                _message('Could not read the Dart file: $error');
              }
            }
          
              Future<void> _mergeImportedProjectFiles(Map<String, String> imported, {required String sourceName}) async {
              if (imported.isEmpty) {
                _message('No supported Dart or Android source files were found. Supported paths are lib/**/*.dart and selected Android Kotlin/Java/XML/ProGuard files.');
                return;
              }
              final totalBytes = imported.values.fold<int>(0, (sum, source) => sum + utf8.encode(source).length);
              final dartBytes = imported.entries.where((entry) => entry.key.startsWith('lib/')).fold<int>(0, (sum, entry) => sum + utf8.encode(entry.value).length);
              final androidBytes = totalBytes - dartBytes;
              if (imported.length > 250 || totalBytes > 5 * 1024 * 1024 || dartBytes > 2 * 1024 * 1024 || androidBytes > 3 * 1024 * 1024) {
                throw Exception('Import exceeds the project limits (250 files, 5 MB total, 2 MB Dart and 3 MB Android text).');
              }
              final existingFiles = _allProjectFiles();
              final conflicts = imported.keys.where(existingFiles.containsKey).toList()..sort();
              if (conflicts.isNotEmpty) {
                final preview = conflicts.take(6).join('\n');
                final replaceExisting = await showDialog<bool>(
                  context: context,
                  builder: (dialogContext) => AlertDialog(
                    title: Text('Replace ${conflicts.length} existing file(s)?'),
                    content: SingleChildScrollView(child: Text('These paths already exist in the project:\n\n$preview${conflicts.length > 6 ? '\n… and ${conflicts.length - 6} more' : ''}\n\nReplacing them will overwrite their current contents.')),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dialogContext, false), child: const Text('Cancel import')),
                      FilledButton(onPressed: () => Navigator.pop(dialogContext, true), child: const Text('Replace and import')),
                    ],
                  ),
                );
                if (replaceExisting != true || !mounted) {
                  _message('Import canceled. Existing project files were left unchanged.');
                  return;
                }
              }
              final importedCount = imported.length;
              final importedMain = imported['lib/main.dart'];
              final filesToMerge = Map<String, String>.from(imported)..remove('lib/main.dart');
              setState(() {
                if (importedMain != null) {
                  _dartCode = importedMain;
                  _mainFileExists = true;
                  _folders.addAll(_folderAncestors('lib/main.dart'));
                }
                _additionalFiles = <String, String>{..._additionalFiles, ...filesToMerge}..remove('lib/main.dart');
                for (final entry in _additionalFiles.keys) {
                  _folders.addAll(_folderAncestors(entry));
                }
                _currentFolder = '';
                _selectedTemplate = 'Custom project';
              });
              _scheduleDraftSave();
              _message('Imported $importedCount supported source/configuration file(s) from $sourceName. Unsupported assets and project-wide Gradle files were skipped to protect the generated Android project.');
            }
          
            Future<void> _importProjectFolder() async {
              final selectedPath = await FilePicker.getDirectoryPath(dialogTitle: 'Select a Flutter project folder, lib folder, or android folder');
              if (selectedPath == null || selectedPath.isEmpty) return;
              try {
                final selected = Directory(selectedPath);
                final selectedExists = await selected.exists();
                if (!selectedExists) throw Exception('The selected folder no longer exists.');
                final selectedName = selected.path.replaceAll('\\', '/').split('/').where((part) => part.isNotEmpty).last;
                final libChild = Directory('${selected.path}${Platform.pathSeparator}lib');
                final androidChild = Directory('${selected.path}${Platform.pathSeparator}android');
                Directory? libRoot;
                Directory? androidRoot;
                if (await libChild.exists() || await androidChild.exists()) {
                  if (await libChild.exists()) libRoot = libChild;
                  if (await androidChild.exists()) androidRoot = androidChild;
                } else if (selectedName == 'lib') {
                  libRoot = selected;
                } else if (selected.path.replaceAll('\\', '/').split('/').contains('android')) {
                  final segments = selected.path.replaceAll('\\', '/').split('/');
                  final androidIndex = segments.lastIndexOf('android');
                  androidRoot = Directory(segments.take(androidIndex + 1).join('/'));
                } else {
                  // Convenient fallback: a plain folder of Dart files is treated as lib/ content.
                  libRoot = selected;
                }
                final imported = <String, String>{};
                var skipped = 0;
                Future<void> collect(Directory root, String prefix, bool dartOnly) async {
                  // Walk one directory at a time so we can avoid huge generated folders and
                  // never follow symbolic links while importing a potentially untrusted tree.
                  const ignoredDirectoryNames = <String>{
                    '.git', '.dart_tool', '.gradle', 'build', 'node_modules',
                    '.idea', '.vscode', 'Pods', '.symlinks', '.pub-cache', 'coverage',
                  };
                  final pending = <Directory>[root];
                  while (pending.isNotEmpty) {
                    final directory = pending.removeLast();
                    await for (final entity in directory.list(followLinks: false)) {
                      if (entity is Link) { skipped++; continue; }
                      if (entity is Directory) {
                        final leaf = entity.path.replaceAll('\\', '/').split('/').where((part) => part.isNotEmpty).last;
                        if (ignoredDirectoryNames.contains(leaf)) { skipped++; continue; }
                        pending.add(entity);
                        continue;
                      }
                      if (entity is! File) continue;
                      final relative = entity.path.substring(root.path.length).replaceFirst(RegExp(r'^[\\/]+'), '').replaceAll(Platform.pathSeparator, '/');
                      if (relative.isEmpty) continue;
                      final path = '$prefix/$relative';
                      final supported = dartOnly ? _isSafeDartPath(path) : _isSafeAndroidFilePath(path);
                      if (!supported) { skipped++; continue; }
                      final bytes = await entity.readAsBytes();
                      if (bytes.length > 1024 * 1024) throw Exception('$path exceeds 1 MB. Remove generated or large source files and retry.');
                      imported[path] = utf8.decode(bytes, allowMalformed: true);
                      if (imported.length > 250) throw Exception('The selected folder contains more than 250 supported source files.');
                    }
                  }
                }
                if (libRoot != null) await collect(libRoot, 'lib', true);
                if (androidRoot != null) {
                  // Full Android project folder: preserve its android/ root. If a folder
                  // inside android/ was selected, its own source root is not assumed.
                  await collect(androidRoot, 'android', false);
                }
                if (imported.isEmpty) throw Exception('No supported .dart, .kt, .java, AndroidManifest.xml, Android resource XML, or proguard-rules.pro files were found.');
                await _mergeImportedProjectFiles(imported, sourceName:selected.path);
                if (skipped > 0) _message('Folder import also skipped $skipped unsupported file(s), such as image assets, Gradle scripts and generated build output.');
              } catch (error) {
                _message('Folder import failed: $error');
              }
            }
          
            Future<void> _importProjectZip() async {
              final picked = await FilePicker.pickFile(dialogTitle: 'Select a Flutter project ZIP (Dart and supported Android source)', type: FileType.custom, allowedExtensions: const ['zip']);
              if (picked == null) return;
              try {
                final bytes = await picked.readAsBytes();
                if (bytes.length > 20 * 1024 * 1024) throw Exception('ZIP is larger than 20 MB. Choose a smaller archive.');
                final archive = ZipDecoder().decodeBytes(bytes);
                final imported = <String, String>{};
                var totalUncompressed = 0;
                var skipped = 0;
                for (final file in archive.files.where((entry) => entry.isFile)) {
                  final rawPath = file.name.replaceAll('\\', '/').replaceFirst(RegExp(r'^\./'), '');
                  final parts = rawPath.split('/');
                  if (rawPath.startsWith('/') || parts.any((part) => part.isEmpty || part == '.' || part == '..')) { skipped++; continue; }
                  var path = '';
                  final libIndex = parts.indexOf('lib');
                  final androidIndex = parts.indexOf('android');
                  if (libIndex >= 0 && libIndex < parts.length - 1) {
                    path = parts.sublist(libIndex).join('/');
                    if (!_isSafeDartPath(path)) { skipped++; continue; }
                  } else if (androidIndex >= 0 && androidIndex < parts.length - 1) {
                    path = parts.sublist(androidIndex).join('/');
                    if (!_isSafeAndroidFilePath(path)) { skipped++; continue; }
                  } else if (rawPath.toLowerCase().endsWith('.dart') && !rawPath.contains('/')) {
                    path = 'lib/$rawPath';
                  } else {
                    skipped++;
                    continue;
                  }
                  final content = file.content as List<int>;
                  if (content.length > 1024 * 1024) throw Exception('$path exceeds 1 MB.');
                  totalUncompressed += content.length;
                  if (totalUncompressed > 5 * 1024 * 1024) throw Exception('ZIP has more than 5 MB of supported source files.');
                  imported[path] = utf8.decode(content, allowMalformed: true);
                  if (imported.length > 250) throw Exception('ZIP contains more than 250 supported source files.');
                }
                await _mergeImportedProjectFiles(imported, sourceName:picked.name);
                if (skipped > 0) _message('ZIP import skipped $skipped unsupported entries (assets, Gradle build files, caches, or unsafe paths).');
              } catch (error) {
                _message('ZIP import failed: $error');
              }
            }
          
            Future<void> _importAndroidFile() async {
              final picked = await FilePicker.pickFile(
                dialogTitle: 'Select a Kotlin, Java, Android XML, or ProGuard file',
                type: FileType.custom,
                allowedExtensions: const ['kt', 'java', 'xml', 'pro'],
              );
              if (picked == null) return;
              final lower = picked.name.toLowerCase();
              final kind = lower.endsWith('.kt') ? 'kotlin' : lower.endsWith('.java') ? 'java' : lower.endsWith('.pro') ? 'proguard' : 'xml';
              final defaultPath = lower == 'androidmanifest.xml'
                  ? 'android/app/src/main/AndroidManifest.xml'
                  : kind == 'kotlin'
                      ? 'android/app/src/main/kotlin/${_packageName.text.trim().replaceAll('.', '/')}/${picked.name}'
                      : kind == 'java'
                          ? 'android/app/src/main/java/${_packageName.text.trim().replaceAll('.', '/')}/${picked.name}'
                          : kind == 'proguard'
                              ? 'android/app/proguard-rules.pro'
                              : 'android/app/src/main/res/values/${picked.name}';
              final controller = TextEditingController(text: defaultPath);
              final destination = await showDialog<String>(context: context, builder: (dialogContext) => AlertDialog(
                title: const Text('Import Android source'),
                content: TextField(controller: controller, autofocus: true, autocorrect: false, decoration: const InputDecoration(labelText: 'Destination path', helperText: 'Only safe app-level Kotlin/Java, manifest, resource XML and ProGuard paths are accepted.')),
