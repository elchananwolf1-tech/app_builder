            Future<void> dispatchBuild({
              required String projectName,
              required String packageName,
              required String dependencies,
              String androidDependencies = '',
              required bool hasCustomIcon,
              required String iconPath,
              required bool dynamicThemedIcon,
              required String requestId,
              String buildFormat = 'apk',
              bool signRelease = false,
              String appVersion = '1.0.0+1',
            }) async {
              // repository_dispatch keeps project fields out of GitHub's static
              // "Run workflow" form. The mobile app sends a different payload per build.
              // repository_dispatch allows at most ten top-level client_payload properties.
              final response = await request('POST', '$_repoPath/dispatches', body: {
                'event_type': 'build_flutter_app',
                'client_payload': {
                  'project_name': projectName,
                  'package_name': packageName,
                  'dependencies': dependencies,
                  'android_dependencies': androidDependencies,
                  'has_custom_icon': hasCustomIcon,
                  'icon_path': iconPath,
                  'request_id': requestId,
                  'options': {
                    'dynamic_themed_icon': dynamicThemedIcon,
                    'build_format': buildFormat,
                    'sign_release': signRelease,
                    'app_version': appVersion,
                  },
                },
              });
              if (response.statusCode != 204 && response.statusCode != 201) {
                checkedJson(response);
                throw Exception('GitHub did not accept the app-build request.');
              }
            }
          
            int _typicalStepSeconds(String name) {
              final value = name.toLowerCase();
              if (value.contains('checkout')) return 8;
              if (value.contains('validate')) return 3;
              if (value.contains('prepare artifact')) return 2;
              if (value.contains('java')) return 12;
              if (value.contains('flutter stable')) return 45;
              if (value.contains('patch helper')) return 2;
              if (value.contains('create the requested flutter project')) return 28;
              if (value.contains('apply selected image')) return 30;
              if (value.contains('build requested output')) return 150;
              if (value.contains('upload generated release apk')) return 10;
              if (value.contains('upload generated android app bundle')) return 10;
              if (value.contains('generate the real simple app builder')) return 120;
              if (value.contains('upload simple app builder')) return 8;
              return 25;
            }
          
            int? _stepDurationSeconds(Map<String, dynamic> step) {
              final start = DateTime.tryParse((step['started_at'] ?? '').toString());
              final end = DateTime.tryParse((step['completed_at'] ?? '').toString());
              if (start == null || end == null) return null;
              final value = end.difference(start).inSeconds;
              return value < 1 ? 1 : value;
            }
          
            Future<Map<String, dynamic>?> readRunProgress(String runId) async {
              try {
                final json = checkedJson(await request('GET', '$_repoPath/actions/runs/$runId/jobs?per_page=100'));
                final jobs = (json['jobs'] as List<dynamic>? ?? const []).whereType<Map<String, dynamic>>();
                final steps = <Map<String, dynamic>>[];
                for (final job in jobs) {
                  final jobSteps = job['steps'];
                  if (jobSteps is List) steps.addAll(jobSteps.whereType<Map<String, dynamic>>());
                }
                if (steps.isEmpty) return null;
                final now = DateTime.now().toUtc();
                var completedSeconds = 0;
                var totalSeconds = 0;
                var remainingSeconds = 0;
                var activeName = 'Running GitHub Actions steps';
                for (final step in steps) {
                  final name = (step['name'] ?? 'Build step').toString();
                  final status = (step['status'] ?? 'queued').toString();
                  final conclusion = (step['conclusion'] ?? '').toString();
                  if (status == 'completed' && conclusion == 'skipped') continue;
                  final typical = _typicalStepSeconds(name);
                  if (status == 'completed') {
                    final actual = _stepDurationSeconds(step) ?? typical;
                    completedSeconds += actual;
                    totalSeconds += actual;
                  } else if (status == 'in_progress') {
                    activeName = name;
                    final started = DateTime.tryParse((step['started_at'] ?? '').toString());
                    final elapsed = started == null ? 0 : now.difference(started.toUtc()).inSeconds.clamp(0, 36000).toInt();
                    final expected = elapsed >= typical ? elapsed + (typical ~/ 4).clamp(8, 45).toInt() : typical;
                    completedSeconds += elapsed;
                    totalSeconds += expected;
                    remainingSeconds += (expected - elapsed).clamp(0, 36000).toInt();
                  } else {
                    totalSeconds += typical;
                    remainingSeconds += typical;
                  }
                }
                var percent = totalSeconds <= 0 ? 3 : (completedSeconds * 100 / totalSeconds).round();
                if (percent < 3) percent = 3;
                if (percent > 96) percent = 96;
                return {
                  'percent': percent,
                  'remainingSeconds': remainingSeconds,
                  'step': activeName,
                };
              } catch (_) {
                // Progress telemetry is best-effort. It must never fail a working build.
                return null;
              }
            }
          
            Future<Map<String, dynamic>> waitForBuild(
              String requestId,
              void Function(String message) onStatus,
              void Function(Map<String, dynamic> run, int percent, Duration? remaining, String step) onProgress,
            ) async {
              final pollingStarted = DateTime.now();
              var consecutiveNetworkFailures = 0;
              var latestProgress = 3;
              for (var attempt = 0; attempt < 660; attempt++) {
                if (DateTime.now().difference(pollingStarted) >= const Duration(minutes: 55)) {
                  throw TimeoutException('Build status polling reached 55 minutes. The remote GitHub run may still be active; open the Actions run before triggering another build.');
                }
                await Future<void>.delayed(const Duration(seconds: 5));
                late final http.Response runsResponse;
                try {
                  runsResponse = await request(
                    'GET',
                    '$_repoPath/actions/runs?event=repository_dispatch&per_page=50',
                  );
                  consecutiveNetworkFailures = 0;
                } catch (error) {
                  if (!_looksLikeNetworkError(error)) rethrow;
                  consecutiveNetworkFailures++;
                  final runUrl = 'https://github.com/${normalizeRepository(repository)}/actions';
                  onStatus('Temporary internet/DNS problem while checking GitHub (retry $consecutiveNetworkFailures). The build may still be running; reconnecting automatically.');
                  latestProgress = latestProgress < 5 ? 5 : latestProgress;
                  onProgress({'id': '', 'html_url': runUrl, 'run_number': 0}, latestProgress, null, 'Reconnecting to GitHub; remote build status is not lost');
                  continue;
                }
                if (runsResponse.statusCode == 404) {
                  onStatus('GitHub accepted the request; waiting for the new repository Actions workflow to appear…');
                  final elapsed = DateTime.now().difference(pollingStarted).inSeconds;
                  final Duration? remaining = elapsed >= 210 ? null : Duration(seconds: 240 - elapsed);
                  onProgress({'id': '', 'html_url': '', 'run_number': 0}, 2, remaining, 'Waiting for GitHub to initialize Actions');
                  continue;
                }
                final result = checkedJson(runsResponse);
                final runs = (result['workflow_runs'] as List<dynamic>? ?? const [])
                    .whereType<Map<String, dynamic>>()
                    .where((run) => (run['display_title'] ?? '').toString() == requestId)
                    .toList()
                  ..sort((a, b) => (b['run_number'] as int? ?? 0).compareTo(a['run_number'] as int? ?? 0));
                if (runs.isEmpty) {
                  onStatus('Waiting for GitHub to register the build…');
                  final elapsed = DateTime.now().difference(pollingStarted).inSeconds;
                  final Duration? remaining = elapsed >= 210 ? null : Duration(seconds: 240 - elapsed);
                  onProgress({'id': '', 'html_url': '', 'run_number': 0}, 2, remaining, 'Waiting for GitHub to register the build');
                  continue;
                }
                final run = runs.first;
                final status = (run['status'] ?? 'queued').toString();
                final number = run['run_number']?.toString() ?? '';
                final runId = (run['id'] ?? '').toString();
                onStatus('Workflow #$number: $status');
                Map<String, dynamic>? snapshot;
                if (runId.isNotEmpty) snapshot = await readRunProgress(runId);
                if (status == 'queued' || snapshot == null) {
                  final created = DateTime.tryParse((run['created_at'] ?? '').toString());
                  final queuedElapsed = created == null ? 0 : DateTime.now().toUtc().difference(created.toUtc()).inSeconds;
                  final Duration? remaining = queuedElapsed >= 240
                    ? null
                    : Duration(seconds: (240 - queuedElapsed) < 25 ? 25 : 240 - queuedElapsed);
                  latestProgress = status == 'queued' ? 3 : 8;
                  onProgress(run, latestProgress, remaining, status == 'queued' ? 'Waiting for a GitHub runner' : 'Starting build steps and estimating duration');
                } else {
                  latestProgress = (snapshot['percent'] as int?) ?? 8;
                  onProgress(run, latestProgress, Duration(seconds: (snapshot['remainingSeconds'] as int?) ?? 120), (snapshot['step'] ?? 'Building').toString());
                }
                if (status == 'completed') {
                  if (run['conclusion'] != 'success') {
                    final url = (run['html_url'] ?? '').toString();
                    throw WorkflowRunException(message: 'GitHub Actions concluded the build as ${run['conclusion'] ?? 'failure'}. Open the run or load its logs below.', runId: runId, runUrl: url);
                  }
                  onProgress(run, 97, const Duration(seconds: 8), 'Build finished; downloading the requested artifact');
                  return run;
                }
              }
              throw TimeoutException('Build did not finish within 55 minutes. Check the Actions tab in GitHub.');
            }
          
            Future<Uint8List> _downloadZipEndpoint(String endpoint) async {
              if (accounts.isEmpty) throw Exception('No GitHub account is configured.');
              final candidates = autoFailover ? accounts : <GitHubAccount>[accounts.first];
              Object? lastError;
              for (var index = 0; index < candidates.length; index++) {
                final account = candidates[index];
                for (var attempt = 0; attempt < 4; attempt++) {
                  final client = http.Client();
                  try {
                    final cleanEndpoint = endpoint.trim().replaceAll(RegExp(r'\s*/\s*'), '/').replaceAllMapped(RegExp(r'\s*([?&=])\s*'), (match) => match[1]!);
                    final uri = cleanEndpoint.startsWith('https://') ? Uri.parse(cleanEndpoint) : Uri.parse('https://api.github.com${cleanEndpoint.startsWith('/') ? cleanEndpoint : '/$cleanEndpoint'}');
                    if (uri.scheme != 'https' || uri.host.toLowerCase() != 'api.github.com') {
                      throw FormatException('Unexpected GitHub artifact URL: $uri');
                    }
                    final apiRequest = http.Request('GET', uri)
                      ..followRedirects = false
                      ..headers.addAll({
                        'Accept': 'application/vnd.github+json',
                        'Authorization': 'Bearer ${account.token}',
                        'X-GitHub-Api-Version': '2022-11-28',
                        'User-Agent': 'Simple-App-Builder',
                      });
                    final streamed = await client.send(apiRequest).timeout(const Duration(minutes: 3));
                    final initial = await http.Response.fromStream(streamed).timeout(const Duration(minutes: 3));
                    Uint8List bytes;
                    if (initial.statusCode == 302 || initial.statusCode == 303 || initial.statusCode == 307 || initial.statusCode == 308) {
                      final location = initial.headers['location'];
                      if (location == null || location.isEmpty) throw Exception('GitHub returned HTTP ${initial.statusCode} without a download Location header.');
                      // GitHub's signed artifact URL is on a separate storage host. Never forward the PAT there.
                      final downloadRequest = http.Request('GET', uri.resolve(location))..followRedirects = true;
                      final downloadStream = await client.send(downloadRequest).timeout(const Duration(minutes: 3));
                      final downloadResponse = await http.Response.fromStream(downloadStream).timeout(const Duration(minutes: 3));
                      if (downloadResponse.statusCode != 200) {
                        final excerpt = utf8.decode(downloadResponse.bodyBytes.take(300).toList(), allowMalformed: true);
                        throw Exception('Signed artifact URL returned HTTP ${downloadResponse.statusCode}: ${excerpt.trim()}');
                      }
                      bytes = Uint8List.fromList(downloadResponse.bodyBytes);
                    } else if (initial.statusCode == 200) {
                      bytes = Uint8List.fromList(initial.bodyBytes);
                    } else {
                      final retryable = initial.statusCode == 401 || initial.statusCode == 403 || initial.statusCode == 429;
                      final excerpt = initial.body.length > 300 ? initial.body.substring(0, 300) : initial.body;
                      final error = Exception('GitHub artifact download endpoint returned HTTP ${initial.statusCode}: ${excerpt.trim()}');
                      if (retryable && autoFailover && index < candidates.length - 1) { lastError = error; break; }
                      if ((initial.statusCode == 429 || initial.statusCode == 500 || initial.statusCode == 502 || initial.statusCode == 503 || initial.statusCode == 504) && attempt < 3) {
                        await Future<void>.delayed(Duration(seconds: (1 << attempt).clamp(1, 8).toInt()));
                        continue;
                      }
                      throw error;
                    }
                    if (bytes.length < 4 || bytes[0] != 0x50 || bytes[1] != 0x4b) {
                      final excerpt = utf8.decode(bytes.take(200).toList(), allowMalformed: true);
                      throw Exception('GitHub download returned ${bytes.length} bytes, but it is not a ZIP archive. ${excerpt.trim()}');
                    }
                    if (index > 0) onPromote?.call(account);
                    return bytes;
                  } catch (error) {
                    lastError = error;
                    if (_looksLikeNetworkError(error) && attempt < 3) {
                      await Future<void>.delayed(Duration(seconds: (1 << attempt).clamp(1, 8).toInt()));
                      continue;
                    }
                    if (_looksLikeNetworkError(error)) throw Exception(_githubConnectionHint(error));
                    if (autoFailover && index < candidates.length - 1) break;
                    throw Exception('Could not download GitHub ZIP data: $error');
                  } finally {
                    client.close();
                  }
                }
              }
              throw Exception('Could not download GitHub ZIP data: ${lastError ?? 'unknown download error'}');
            }
          
            Future<Uint8List> downloadGeneratedArtifact(String runId, String format) async {
              final prefix = switch (format) {
                'aab' => 'generated-aab-',
                _ => 'generated-apk-',
              };
              final label = switch (format) {
                'aab' => 'Android App Bundle',
                _ => 'APK',
              };
              final json = checkedJson(await request('GET', '$_repoPath/actions/runs/$runId/artifacts?per_page=100'));
              final artifacts = (json['artifacts'] as List<dynamic>? ?? const []).whereType<Map<String, dynamic>>();
              final matching = artifacts.where((a) =>
                (a['name'] ?? '').toString().startsWith(prefix) && a['expired'] != true).toList();
              if (matching.isEmpty) {
                final names = artifacts.map((a) => (a['name'] ?? '(unnamed)').toString()).join(', ');
                throw Exception('GitHub run succeeded but no $label artifact was attached. Artifacts reported by GitHub: ${names.isEmpty ? '(none)' : names}');
              }
              matching.sort((a, b) => ((b['created_at'] ?? '').toString()).compareTo((a['created_at'] ?? '').toString()));
              final artifactId = matching.first['id']?.toString();
              if (artifactId == null || artifactId.isEmpty) throw Exception('GitHub listed the $label artifact without an artifact ID.');
              return _downloadZipEndpoint('$_repoPath/actions/artifacts/$artifactId/zip');
            }
          
            Future<String> downloadWorkflowLogs(String runId) async {
              final zipBytes = await _downloadZipEndpoint('$_repoPath/actions/runs/$runId/logs');
              final archive = ZipDecoder().decodeBytes(zipBytes);
              final sections = <String>[];
              for (final file in archive.files.where((item) => item.isFile)) {
                final content = utf8.decode(file.content as List<int>, allowMalformed: true);
                final trimmed = content.length > 16000 ? '…(earlier log lines omitted)…\n${content.substring(content.length - 16000)}' : content;
                sections.add('===== ${file.name} =====\n$trimmed');
              }
              if (sections.isEmpty) throw Exception('The workflow log archive was empty. Open the run in GitHub to inspect it.');
              return sections.join('\n\n');
            }
          }
          
          Future<String?> verifyAccount(String username, String token) async {
            try {
              final response = await http.get(
                Uri.https('api.github.com', '/user'),
                headers: {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer $token',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Simple-App-Builder',
                },
              ).timeout(const Duration(seconds: 30));
              if (response.statusCode != 200) {
                return 'GitHub rejected this token (HTTP ${response.statusCode}). Check the token and its scopes.';
              }
              final actual = (jsonDecode(response.body) as Map<String, dynamic>)['login'].toString();
              if (actual.toLowerCase() != username.trim().toLowerCase()) {
                return 'This token belongs to "$actual", not "${username.trim()}".';
              }
              final scopeHeader = (response.headers['x-oauth-scopes'] ?? '').trim();
              if (scopeHeader.isNotEmpty) {
                final scopes = scopeHeader.split(',').map((scope) => scope.trim()).where((scope) => scope.isNotEmpty).toSet();
                final missing = <String>[];
                if (!scopes.contains('repo')) missing.add('repo');
                if (!scopes.contains('workflow')) missing.add('workflow');
                if (missing.isNotEmpty) {
                  return 'The token is valid but is missing required classic-token scopes: ${missing.join(', ')}. Create a classic token with BOTH repo and workflow scopes so the builder can create private repositories and install the workflow.';
                }
              }
              return null;
            } catch (error) {
              return 'Could not verify the account: $error';
            }
          }
          
          class SimpleAppBuilder extends StatefulWidget {
            const SimpleAppBuilder({super.key});
          
            @override
            State<SimpleAppBuilder> createState() => _SimpleAppBuilderState();
          }
          
          class _SimpleAppBuilderState extends State<SimpleAppBuilder> with WidgetsBindingObserver {
            bool _ready = false;
            List<GitHubAccount> _accounts = [];
            List<AppProject> _projects = [];
            bool _autoFailover = true;
            String _repository = compiledRepository;
            int _backupIntervalMinutes = 15;
            Map<String, String> _backupRepositories = <String, String>{};
            Timer? _backupTimer;
            Timer? _backupDebounce;
            Timer? _backupRetryTimer;
            int _backupRetryAttempt = 0;
            bool _backupSyncInProgress = false;
            bool _backupSyncRequestedAgain = false;
            bool _backupRestoreRequestedAgain = false;
            String _backupStatus = 'Preparing automatic project backup…';
          
            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _configureBackupTimer();
              _loadState();
            }

            static const List<int> _supportedBackupIntervals = <int>[5, 10, 15, 30, 60, 360];

            void _configureBackupTimer() {
              _backupTimer?.cancel();
              if (!_supportedBackupIntervals.contains(_backupIntervalMinutes)) _backupIntervalMinutes = 15;
              _backupTimer = Timer.periodic(Duration(minutes: _backupIntervalMinutes), (_) {
                unawaited(_synchronizeBackups(restoreCloud: false));
              });
            }
          
            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                unawaited(_synchronizeBackups(restoreCloud: false));
              }
            }
          
            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _backupTimer?.cancel();
              _backupDebounce?.cancel();
              _backupRetryTimer?.cancel();
              super.dispose();
            }
          
            Future<void> _loadState() async {
              final prefs = await SharedPreferences.getInstance();
              try {
                final rawAccounts = await secureStorage.read(key: 'github_accounts_v1');
                if (rawAccounts != null) {
                  _accounts = (jsonDecode(rawAccounts) as List<dynamic>)
                      .whereType<Map<String, dynamic>>()
                      .map(GitHubAccount.fromJson)
                      .where((a) => a.username.isNotEmpty && a.token.isNotEmpty)
                      .toList();
                }
              } catch (_) {
                _accounts = [];
              }
              try {
                final rawProjects = prefs.getString('projects_v1');
                if (rawProjects != null) {
                  _projects = (jsonDecode(rawProjects) as List<dynamic>)
                      .whereType<Map<String, dynamic>>()
                      .map(AppProject.fromJson)
                      .toList();
                }
              } catch (_) {
                _projects = [];
              }
              try {
                final rawBackups = prefs.getString('backup_repositories_v1');
                if (rawBackups != null) {
                  final decoded = jsonDecode(rawBackups);
                  if (decoded is Map) _backupRepositories = decoded.map<String, String>((key, value) => MapEntry<String, String>(key.toString().toLowerCase(), normalizeRepository(value.toString())));
                }
              } catch (_) { _backupRepositories = <String, String>{}; }
              _autoFailover = prefs.getBool('auto_failover') ?? true;
              final savedInterval = prefs.getInt('backup_interval_minutes') ?? 15;
              _backupIntervalMinutes = _supportedBackupIntervals.contains(savedInterval) ? savedInterval : 15;
              _configureBackupTimer();
              _repository = normalizeRepository(prefs.getString('repository') ?? compiledRepository);
              if (mounted) setState(() => _ready = true);
              if (_accounts.isNotEmpty) unawaited(_synchronizeBackups(restoreCloud: true));
            }
          
            Future<void> _saveAccounts(List<GitHubAccount> accounts) async {
              _accounts = List<GitHubAccount>.from(accounts);
              await secureStorage.write(
                key: 'github_accounts_v1',
                value: jsonEncode(_accounts.map((a) => a.toJson()).toList()),
              );
              if (mounted) setState(() {});
              if (_accounts.isNotEmpty) {
                unawaited(_synchronizeBackups(restoreCloud: true));
              } else {
                _resetBackupRetry();
              }
            }
          
            Future<void> _storeProjectsLocally(List<AppProject> projects) async {
              _projects = List<AppProject>.from(projects);
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('projects_v1', jsonEncode(_projects.map((p) => p.toJson()).toList()));
              if (mounted) setState(() {});
            }
          
            Future<void> _saveProjects(List<AppProject> projects) async {
              final previous = <String, AppProject>{for (final project in _projects) project.id: project};
              final now = DateTime.now().millisecondsSinceEpoch;
              final normalized = <AppProject>[];
              for (final project in projects) {
                final old = previous[project.id];
                var timestamp = project.updatedAtMillis;
                if (old == null) {
                  if (timestamp <= 0) timestamp = now;
                } else if (jsonEncode(_projectComparable(old)) != jsonEncode(_projectComparable(project))) {
                  timestamp = now;
                } else if (timestamp <= 0) {
                  timestamp = old.updatedAtMillis;
                }
                normalized.add(project.copyWith(updatedAtMillis: timestamp));
              }
              await _storeProjectsLocally(normalized);
              _scheduleBackupSync();
            }
          
            void _scheduleBackupSync() {
              _backupDebounce?.cancel();
              _backupDebounce = Timer(const Duration(seconds: 18), () {
                unawaited(_synchronizeBackups(restoreCloud: false));
              });
            }
          
            Future<void> _persistBackupRepositoryMap() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('backup_repositories_v1', jsonEncode(_backupRepositories));
            }
          
            void _scheduleBackupRetry({required String reason}) {
              _backupRetryTimer?.cancel();
              _backupRetryAttempt = (_backupRetryAttempt + 1).clamp(1, 5).toInt();
              const retryMinutes = <int>[1, 2, 4, 8, 15];
              final minutes = retryMinutes[_backupRetryAttempt - 1];
              if (mounted) setState(() => _backupStatus = '$reason. Retrying automatically in about $minutes minute(s).');
              _backupRetryTimer = Timer(Duration(minutes: minutes), () {
                unawaited(_synchronizeBackups(restoreCloud: true));
              });
            }
          
            void _resetBackupRetry() {
              _backupRetryAttempt = 0;
              _backupRetryTimer?.cancel();
              _backupRetryTimer = null;
            }
          
            Future<void> _synchronizeBackups({required bool restoreCloud}) async {
              if (_accounts.isEmpty) return;
              if (_backupSyncInProgress) {
                _backupSyncRequestedAgain = true;
                _backupRestoreRequestedAgain = _backupRestoreRequestedAgain || restoreCloud;
                return;
              }
              _backupSyncInProgress = true;
              try {
                if (mounted) setState(() => _backupStatus = 'Checking private backup repositories…');
                final accountRepositories = <({GitHubAccount account, String repository, GitHubApi api})>[];
                final restoredProjects = <AppProject>[];
                final backupErrors = <String>[];
                for (final account in List<GitHubAccount>.from(_accounts)) {
                  final key = account.username.toLowerCase();
                  final accountApi = GitHubApi(repository: 'placeholder/placeholder', accounts: [account], autoFailover: false);
                  var backupRepository = _backupRepositories[key] ?? '';
                  var repositoryUsable = false;
                  if (backupRepository.isNotEmpty && isValidRepository(backupRepository)) {
                    final owner = normalizeRepository(backupRepository).split('/').first;
                    final repo = normalizeRepository(backupRepository).split('/').last;
                    final check = await accountApi.request('GET', '/repos/${Uri.encodeComponent(owner)}/${Uri.encodeComponent(repo)}');
                    if (check.statusCode == 404) {
                      repositoryUsable = false;
                    } else {
                      final backupInfo = accountApi.checkedJson(check);
                      final actualFullName = normalizeRepository((backupInfo['full_name'] ?? backupRepository).toString());
                      final actualParts = actualFullName.split('/');
                      if (backupInfo['private'] != true) {
                        throw Exception('The saved backup repository $actualFullName is not private. For safety, it will not be used to store source code; change its visibility to private in GitHub first.');
                      }
                      if (actualParts.length != 2 || actualParts.first.toLowerCase() != account.username.toLowerCase() || !actualParts.last.toLowerCase().startsWith(_backupRepositoryPrefix.toLowerCase())) {
                        throw Exception('Saved backup repository mapping $actualFullName is invalid for ${account.username}. Refusing to upload source code there.');
                      }
                      repositoryUsable = true;
                    }
                  }
                  if (!repositoryUsable) {
                    backupRepository = await accountApi.findOrCreateBackupRepository(account.username);
                    _backupRepositories[key] = backupRepository;
                    await _persistBackupRepositoryMap();
                  }
                  final backupApi = accountApi.forRepository(backupRepository);
                  accountRepositories.add((account: account, repository: backupRepository, api: backupApi));
                  if (restoreCloud) {
                    try {
                      restoredProjects.addAll(await backupApi.loadBackupProjects());
                    } catch (error) {
                      backupErrors.add('Restore from $backupRepository: $error');
                    }
                  }
                }
          
                if (restoreCloud && restoredProjects.isNotEmpty) {
                  final merged = <String, AppProject>{for (final project in _projects) project.id: project};
                  for (final remote in restoredProjects) {
                    final local = merged[remote.id];
                    if (local == null || remote.updatedAtMillis > local.updatedAtMillis) merged[remote.id] = remote;
                  }
                  await _storeProjectsLocally(merged.values.toList()..sort((a, b) => b.updatedAtMillis.compareTo(a.updatedAtMillis)));
                }
          
                final snapshot = List<AppProject>.from(_projects);
                if (snapshot.isNotEmpty) {
                  for (final item in accountRepositories) {
                    try {
                      await item.api.saveBackupProjects(snapshot);
                    } catch (error) {
                      backupErrors.add('Sync to ${item.repository}: $error');
                    }
                  }
                }
                final hasNetworkBackupError = backupErrors.any((message) => _looksLikeNetworkError(Exception(message)));
                if (hasNetworkBackupError) {
                  _scheduleBackupRetry(reason: 'A temporary network/DNS issue interrupted part of backup synchronization');
                } else {
                  _resetBackupRetry();
                  if (mounted) setState(() {
                    final names = accountRepositories.map((item) => item.repository).toSet().join(', ');
                    if (accountRepositories.isEmpty) {
                      _backupStatus = 'No backup account is connected.';
                    } else if (backupErrors.isNotEmpty) {
                      final excerpt = backupErrors.take(3).join(' | ');
                      _backupStatus = 'Backups configured · ${accountRepositories.length} account(s) · $names. Some items need attention: $excerpt';
                    } else {
                      _backupStatus = 'Automatic backup active · ${accountRepositories.length} account(s) · $names · syncs on changes and every $_backupIntervalMinutes minute(s) while the app is active.';
                    }
                  });
                }
              } catch (error) {
                if (_looksLikeNetworkError(error)) {
                  _scheduleBackupRetry(reason: 'Automatic backup could not reach GitHub');
                } else if (mounted) {
                  setState(() => _backupStatus = 'Automatic backup needs attention: $error');
                }
              } finally {
                _backupSyncInProgress = false;
                if (_backupSyncRequestedAgain) {
                  final restoreAgain = _backupRestoreRequestedAgain;
                  _backupSyncRequestedAgain = false;
                  _backupRestoreRequestedAgain = false;
                  unawaited(Future<void>.delayed(const Duration(seconds: 2), () => _synchronizeBackups(restoreCloud: restoreAgain)));
                }
              }
            }
          
            Future<void> _saveFailover(bool enabled) async {
              _autoFailover = enabled;
              final prefs = await SharedPreferences.getInstance();
              await prefs.setBool('auto_failover', enabled);
              if (mounted) setState(() {});
            }

            Future<void> _saveBackupInterval(int minutes) async {
              if (!_supportedBackupIntervals.contains(minutes)) return;
              final prefs = await SharedPreferences.getInstance();
              await prefs.setInt('backup_interval_minutes', minutes);
              _backupIntervalMinutes = minutes;
              _configureBackupTimer();
              if (mounted) setState(() => _backupStatus = 'Backup frequency updated: every $minutes minute(s) while the app is active.');
              _scheduleBackupSync();
            }
          
            Future<void> _saveRepository(String repository) async {
              _repository = normalizeRepository(repository);
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('repository', _repository);
              if (mounted) setState(() {});
            }
          
            void _promoteAccount(GitHubAccount account) {
              final next = <GitHubAccount>[
                account,
                ..._accounts.where((a) => a.username.toLowerCase() != account.username.toLowerCase()),
              ];
              unawaited(_saveAccounts(next));
            }
          
            GitHubApi _api() => GitHubApi(
                  repository: _repository,
                  accounts: List<GitHubAccount>.from(_accounts),
                  autoFailover: _autoFailover,
                  onPromote: _promoteAccount,
                );
          
            ThemeData _theme(ColorScheme scheme) => ThemeData(
                  colorScheme: scheme,
                  useMaterial3: true,
                  scaffoldBackgroundColor: scheme.surface,
                  appBarTheme: const AppBarThemeData(centerTitle: false),
                  inputDecorationTheme: const InputDecorationThemeData(
                    border: OutlineInputBorder(),
                    filled: true,
                  ),
                  cardTheme: const CardThemeData(clipBehavior: Clip.antiAlias),
                );
          
            @override
            Widget build(BuildContext context) => DynamicColorBuilder(
                  builder: (ColorScheme? lightDynamic, ColorScheme? darkDynamic) {
                    // Explicit types prevent inference from widening the values to Diagnosticable.
                    final ColorScheme light = lightDynamic ??
                        ColorScheme.fromSeed(seedColor: const Color(0xFF6750A4));
                    final ColorScheme dark = darkDynamic ??
                        ColorScheme.fromSeed(
                          seedColor: const Color(0xFFD0BCFF),
                          brightness: Brightness.dark,
                        );
                    return MaterialApp(
                      title: 'Simple App Builder',
                      debugShowCheckedModeBanner: false,
                      theme: _theme(light),
                      darkTheme: _theme(dark),
                      themeMode: ThemeMode.system,
                      home: !_ready
                          ? const _LoadingScreen()
                          : _accounts.isEmpty
                              ? SetupScreen(onSetup: (account) async {
                                  await _saveAccounts([account]);
                                })
                              : DashboardScreen(
                                  accounts: _accounts,
                                  projects: _projects,
                                  autoFailover: _autoFailover,
                                  repository: _repository,
                                  backupStatus: _backupStatus,
                                  backupIntervalMinutes: _backupIntervalMinutes,
                                  apiFactory: _api,
                                  onAccountsChanged: _saveAccounts,
                                  onProjectsChanged: _saveProjects,
                                  onFailoverChanged: _saveFailover,
                                  onRepositoryChanged: _saveRepository,
                                  onBackupIntervalChanged: _saveBackupInterval,
                                ),
                    );
                  },
                );
          }
          
