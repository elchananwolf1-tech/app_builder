            Future<void> _detectIconBackgroundColor() async {
              final bytes = _iconBytes;
              if (bytes == null) { _message('Choose an image first.'); return; }
              setState(() => _detectingBackground = true);
              try {
                await Future<void>.delayed(const Duration(milliseconds: 120));
                final hex = await compute(_detectLauncherBackgroundColor, bytes);
                if (!mounted || !identical(_iconBytes, bytes)) return;
                setState(() => _iconBackgroundColor = hex);
                await _refreshIconPreview();
                _message('Detected edge background color: $hex');
              } catch (error) {
                _message('Could not detect the background color: $error');
              } finally {
                if (mounted) setState(() => _detectingBackground = false);
              }
            }

            Future<void> _importMainDart() async {
              final picked = await FilePicker.pickFile(dialogTitle: 'Select the app entry-point Dart file', type: FileType.custom, allowedExtensions: const ['dart']);
              if (picked == null) return;
              try {
                final bytes = await picked.readAsBytes();
                if (bytes.isEmpty) { _message('The selected Dart file is empty.'); return; }
                setState(() {
                  _dartCode = utf8.decode(bytes, allowMalformed: true);
                  _selectedTemplate = 'Custom project';
                });
                _message('Imported ${picked.name} as lib/main.dart. Use folder or ZIP import to preserve multiple file paths.');
              } catch (error) {
                _message('Could not read the Dart file: $error');
              }
            }

            Future<void> _importProjectFolder() async {
              final selectedPath = await FilePicker.getDirectoryPath(dialogTitle: 'Select a Flutter project folder or its lib folder');
              if (selectedPath == null || selectedPath.isEmpty) return;
              try {
                final selected = Directory(selectedPath);
                final libCandidate = Directory('${selected.path}${Platform.pathSeparator}lib');
                final sourceRoot = await libCandidate.exists() ? libCandidate : selected;
                final imported = <String, String>{};
                await for (final entity in sourceRoot.list(recursive: true, followLinks: false)) {
                  if (entity is! File || !entity.path.toLowerCase().endsWith('.dart')) continue;
                  final relative = entity.path.substring(sourceRoot.path.length).replaceFirst(RegExp(r'^[\\/]+'), '').replaceAll(Platform.pathSeparator, '/');
                  final targetPath = 'lib/$relative';
                  if (!_isSafeDartPath(targetPath)) continue;
                  final bytes = await entity.readAsBytes();
                  if (bytes.length > 1024 * 1024) throw Exception('$targetPath exceeds 1 MB. Remove generated/large Dart files and retry.');
                  imported[targetPath] = utf8.decode(bytes, allowMalformed: true);
                  if (imported.length > 200) throw Exception('The folder contains more than 200 Dart source files.');
                }
                if (!imported.containsKey('lib/main.dart')) {
                  throw Exception('No lib/main.dart was found. Choose the project root containing lib/main.dart, or choose the lib folder itself.');
                }
                final totalBytes = imported.values.fold<int>(0, (sum, source) => sum + utf8.encode(source).length);
                if (totalBytes > 2 * 1024 * 1024) throw Exception('Imported Dart source is larger than 2 MB.');
                setState(() {
                  _dartCode = imported.remove('lib/main.dart')!;
                  _additionalFiles = imported;
                  _folders = <String>{...imported.keys.expand(_folderAncestors)};
                  _selectedTemplate = 'Custom project';
                });
                _message('Imported ${_additionalFiles.length + 1} Dart files. Other Flutter project files/assets are not copied by this Dart-source importer.');
              } catch (error) {
                _message('Folder import failed: $error');
              }
            }

            Future<void> _importProjectZip() async {
              final picked = await FilePicker.pickFile(dialogTitle: 'Select a ZIP of a Flutter project or lib folder', type: FileType.custom, allowedExtensions: const ['zip']);
              if (picked == null) return;
              try {
                final bytes = await picked.readAsBytes();
                if (bytes.length > 20 * 1024 * 1024) throw Exception('ZIP is larger than 20 MB. Choose a smaller archive.');
                final archive = ZipDecoder().decodeBytes(bytes);
                final imported = <String, String>{};
                for (final file in archive.files.where((entry) => entry.isFile)) {
                  var path = file.name.replaceAll('\\', '/').replaceFirst(RegExp(r'^\./'), '');
                  if (path.startsWith('/') || path.split('/').any((part) => part == '..')) continue;
                  final pathParts = path.split('/');
                  final libIndex = pathParts.indexOf('lib');
                  if (libIndex >= 0 && libIndex < pathParts.length - 1) {
                    path = pathParts.sublist(libIndex).join('/');
                  } else if (path.toLowerCase().endsWith('.dart') && !path.contains('/')) {
                    path = 'lib/$path';
                  } else {
                    continue;
                  }
                  if (!_isSafeDartPath(path)) continue;
                  final content = file.content as List<int>;
                  if (content.length > 1024 * 1024) throw Exception('$path exceeds 1 MB.');
                  imported[path] = utf8.decode(content, allowMalformed: true);
                  if (imported.length > 200) throw Exception('ZIP contains more than 200 Dart source files.');
                }
                if (!imported.containsKey('lib/main.dart')) throw Exception('ZIP must include lib/main.dart (or main.dart at its root).');
                final totalBytes = imported.values.fold<int>(0, (sum, source) => sum + utf8.encode(source).length);
                if (totalBytes > 2 * 1024 * 1024) throw Exception('Dart source in ZIP is larger than 2 MB.');
                setState(() {
                  _dartCode = imported.remove('lib/main.dart')!;
                  _additionalFiles = imported;
                  _folders = <String>{...imported.keys.expand(_folderAncestors)};
                  _selectedTemplate = 'Custom project';
                });
                _message('Imported ${_additionalFiles.length + 1} Dart files from ${picked.name}.');
              } catch (error) {
                _message('ZIP import failed: $error');
              }
            }

            Future<void> _editFile(String path) async {
