                ]),
                actions: [TextButton(onPressed: () => Navigator.pop(dialogContext), child: const Text('Cancel')), FilledButton(onPressed: () => Navigator.pop(dialogContext, {'kind':kind,'name':controller.text.trim()}), child: const Text('Create file'))],
              )));
              controller.dispose();
              if (result == null || (result['name'] ?? '').trim().isEmpty) return;
              kind = result['kind'] ?? 'dart';
              var input = result['name']!.trim();
              if (kind == 'xml' && input.split('/').last == 'AndroidManifest.xml' && !input.startsWith('android/')) {
                input = 'android/app/src/main/AndroidManifest.xml';
              } else if (kind == 'proguard' && !input.startsWith('android/')) {
                input = 'android/app/proguard-rules.pro';
              }
              final path = _normaliseNewPath(input, folder: false, kind: kind);
              if (!_isSafeProjectFilePath(path) || (path == 'lib/main.dart' && _mainFileExists)) {
                _message('Invalid path or file already exists. Use lib/main.dart for the entry point, other Dart files under lib/, or supported native Android paths.');
                return;
              }
              if (_allProjectFiles().containsKey(path)) { _message('A file already exists there. Open it from the current folder.'); return; }
              final source = _stubForProjectFile(path, kind);
              final parent = path.substring(0, path.lastIndexOf('/'));
              setState(() {
