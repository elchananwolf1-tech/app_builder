          import sys
          from pathlib import Path
          from PIL import Image, ImageOps

          source_path = Path(sys.argv[1])
          output_dir = Path(sys.argv[2])
          dynamic_icon = len(sys.argv) > 3 and sys.argv[3].lower() == 'true'
          output_dir.mkdir(parents=True, exist_ok=True)
          try:
              with Image.open(source_path) as opened:
                  source = ImageOps.exif_transpose(opened).convert('RGBA')
          except Exception as exc:
              raise SystemExit(f'Could not decode launcher image {source_path}: {exc}')
          if source.width < 1 or source.height < 1 or source.width * source.height > 40000000:
              raise SystemExit(f'Unsupported launcher image dimensions {source.width}x{source.height}; maximum is 40 megapixels.')
          source.thumbnail((2048, 2048), Image.Resampling.LANCZOS)

          def fit(source_image, max_size=780):
              width, height = source_image.size
              if width < 1 or height < 1:
                  raise SystemExit('The logo has no visible dimensions.')
              scale = min(max_size / width, max_size / height)
              size = (max(1, round(width * scale)), max(1, round(height * scale)))
              return source_image if size == source_image.size else source_image.resize(size, Image.Resampling.LANCZOS)

          # Do not remove/replace any source pixels. Regular icons use a solid white canvas to
          # avoid Android/launcher black backgrounds when original transparency is mishandled.
          artwork = fit(source)
          white_canvas = Image.new('RGBA', (1024, 1024), (255, 255, 255, 255))
          white_canvas.alpha_composite(artwork, ((1024-artwork.width)//2, (1024-artwork.height)//2))
          white_canvas.save(output_dir / 'app_icon.png', format='PNG', optimize=True)

          # Adaptive foreground retains source alpha/colors. Opaque input logos remain opaque;
          # the configured adaptive background is white, never a generated transparent square.
          foreground = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          foreground.alpha_composite(artwork, ((1024-artwork.width)//2, (1024-artwork.height)//2))
          foreground.save(output_dir / 'app_icon_foreground.png', format='PNG', optimize=True)

          mono_path = output_dir / 'app_icon_monochrome.png'
          if mono_path.exists():
              mono_path.unlink()
          alpha = artwork.getchannel('A')
          alpha_extrema = alpha.getextrema()
          # Only produce a theme mask if the source already has real transparency. Never infer
          # transparent pixels from white/black colors: that is the background-removal feature
          # the user explicitly requested to disable.
          if dynamic_icon and alpha_extrema[0] < 255:
              bbox = alpha.getbbox()
              if bbox:
                  alpha_crop = alpha.crop(bbox)
                  silhouette = Image.new('RGBA', alpha_crop.size, (255, 255, 255, 0))
                  silhouette.putalpha(alpha_crop)
                  silhouette = fit(silhouette, 780)
                  mono = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
                  mono.alpha_composite(silhouette, ((1024-silhouette.width)//2, (1024-silhouette.height)//2))
                  mono.save(mono_path, format='PNG', optimize=True)
                  print('Generated monochrome themed-icon layer from source alpha; no colors were removed.')
          else:
              print('::warning::The logo has no transparent pixels or themed icons are disabled. Kept the logo unchanged and skipped the monochrome layer.')
          print(f'Generated a white-background launcher icon from {source_path}; the source background/colors were preserved.')
          PYICON

