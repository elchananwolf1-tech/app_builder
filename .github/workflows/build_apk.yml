                }
                movedFolders.addAll(_folderAncestors('$newPath/placeholder.dart'));
                _additionalFiles = movedFiles;
                _folders = movedFolders;
                if (_currentFolder == oldPath || _currentFolder.startsWith('$oldPath/')) {
                  _currentFolder = '$newPath${_currentFolder.substring(oldPath.length)}';
                }
                _selectedTemplate = 'Custom project';
              });
              _scheduleDraftSave();
              _message('Folder renamed to ${newPath.split('/').last}. Imports in Dart files may need updating.');
            }
          
            Future<void> _deleteFolder(String path) async {
              if (path == 'lib' || path == 'android') { _message('The top-level project folders cannot be deleted.'); return; }
              final confirmed = await showDialog<bool>(context: context, builder: (dialogContext) => AlertDialog(
                title: const Text('Delete folder?'),
                content: Text('Delete folder $path and all files inside it? lib/main.dart is never deleted by this action.'),
                actions: [TextButton(onPressed: () => Navigator.pop(dialogContext, false), child: const Text('Cancel')), FilledButton(onPressed: () => Navigator.pop(dialogContext, true), child: const Text('Delete folder'))],
              ));
              if (confirmed != true) return;
              setState(() {
                final removedNativeSources = _additionalFiles.entries
                    .where((entry) => entry.key.startsWith('$path/') && (entry.key.endsWith('.kt') || entry.key.endsWith('.java')))
                    .map((entry) => MapEntry<String, String>(entry.key, entry.value))
                    .toList();
                _removeManifestEntriesForNativeSources(removedNativeSources);
                _additionalFiles.removeWhere((file, _) => file.startsWith('$path/'));
                _folders.removeWhere((folder) => folder == path || folder.startsWith('$path/'));
                if (_currentFolder == path || _currentFolder.startsWith('$path/')) {
                  final slash = path.lastIndexOf('/');
                  _currentFolder = slash < 0 ? '' : path.substring(0, slash);
                }
              });
              _scheduleDraftSave();
            }
          
            Future<void> _applyTemplate() async {
              if (_selectedTemplate == 'Custom project') {
                _message('Choose a starter template first.');
                return;
              }
              final confirmed = await showDialog<bool>(context: context, builder: (context) => AlertDialog(
                title: const Text('Replace project source?'),
                content: const Text('Applying a template replaces the Dart source tree but keeps your Android Kotlin/Java/XML/ProGuard files and Maven dependency settings. Empty project removes Dart files and folders so you can create lib/main.dart yourself; building remains disabled until main.dart exists and contains code.'),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('Cancel')),
                  FilledButton(onPressed: () => Navigator.pop(context, true), child: const Text('Apply template')),
                ],
              ));
              if (confirmed != true) return;
              final starter = _templateFiles(_selectedTemplate);
              setState(() {
                _mainFileExists = starter.containsKey('lib/main.dart');
                _dartCode = starter['lib/main.dart'] ?? '';
                final nativeFiles = <String, String>{for (final entry in _additionalFiles.entries) if (!entry.key.startsWith('lib/')) entry.key: entry.value};
                final starterFiles = Map<String, String>.from(starter)..remove('lib/main.dart');
                _additionalFiles = <String, String>{...nativeFiles, ...starterFiles};
                _folders = <String>{..._folders.where((folder) => folder != 'lib' && !folder.startsWith('lib/')), ..._additionalFiles.keys.expand(_folderAncestors)};
                if (_mainFileExists || _additionalFiles.keys.any((path) => path.startsWith('lib/'))) {
                  _folders.addAll(_folderAncestors('lib/main.dart'));
                }
                _currentFolder = '';
              });
              _scheduleDraftSave();
            }
          
            Uint8List _createSourceArchive() {
              final sourceArchive = Archive();
              for (final entry in _allProjectFiles().entries) {
                final bytes = Uint8List.fromList(utf8.encode(entry.value));
                sourceArchive.addFile(ArchiveFile(entry.key, bytes.length, bytes));
              }
              final encoded = ZipEncoder().encode(sourceArchive);
              return Uint8List.fromList(encoded);
            }
          
            Future<void> _continue() async {
              if (_building) return;
              if (_step == 0 && !_validDetails()) return;
              if (_step == 2 && !_validateFileTree()) return;
              if (_step < 3) {
                setState(() => _step++);
                return;
              }
              await _buildAndDownload();
            }
          
            int _progressPercent = 0;
            String _progressStep = 'Preparing source files';
            Duration? _remainingEstimate;
            DateTime? _estimatedFinishAt;
          
            String _formatRemaining(Duration? duration) {
              if (duration == null) return 'Estimating…';
              final seconds = duration.inSeconds < 0 ? 0 : duration.inSeconds;
              if (seconds >= 3600) return '${seconds ~/ 3600}h ${(seconds % 3600) ~/ 60}m';
              if (seconds >= 60) return '${seconds ~/ 60}m ${seconds % 60}s';
              return '${seconds}s';
            }
          
            String _formatFinish(DateTime? value) {
              if (value == null) return 'estimating finish time';
              final local = value.toLocal();
              final h = local.hour.toString().padLeft(2, '0');
              final m = local.minute.toString().padLeft(2, '0');
              return '$h:$m';
            }
          
            void _updateProgress(int percent, Duration? remaining, String step) {
              if (!mounted) return;
              setState(() {
                final bounded = percent.clamp(0, 100).toInt();
                if (bounded > _progressPercent) _progressPercent = bounded;
                _progressStep = step;
                _remainingEstimate = remaining;
                _estimatedFinishAt = remaining == null ? null : DateTime.now().add(remaining);
              });
            }
          
            Future<void> _buildAndDownload({String? requestedFormat}) async {
              final outputFormat = requestedFormat ?? _buildFormat;
              if (_signRelease && normalizeRepository(_targetRepository).isEmpty) {
                _message('Custom signing needs GitHub Actions secrets in the app’s private repository. First build this project with signing turned off so its private repository is created. Then add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS under Settings → Secrets and variables → Actions, and rebuild with signing enabled.');
                return;
              }
              if (!_validDetails() || !_validateFileTree()) return;
              if (widget.repository.isEmpty || !isValidRepository(widget.repository)) {
                _message('The builder workflow template repository is not configured correctly. Open Settings and verify owner/repository.');
                return;
              }
              setState(() {
                _building = true;
                _status = 'Preparing source and verifying the workflow template…';
                _apkPath = null;
                _lastRunId = null;
                _lastRunUrl = null;
                _githubBuildSucceeded = false;
                _buildStartedAt = DateTime.now();
                _progressPercent = 1;
                _progressStep = 'Preparing Flutter and Android source files';
                _remainingEstimate = const Duration(minutes: 5);
                _estimatedFinishAt = DateTime.now().add(const Duration(minutes: 5));
              });
              GitHubApi? targetApi;
              String? targetBranch;
              String? cleanupIconPath;
              try {
                final archiveBytes = _createSourceArchive();
                if (archiveBytes.length > 5 * 1024 * 1024) {
                  throw Exception('The compressed Flutter/Android source archive exceeds 5 MB. Remove generated or unnecessary files and retry.');
                }
          
                final templateApi = widget.apiFactory();
                _updateProgress(3, const Duration(minutes: 5), 'Reading the builder workflow template');
                final templateBranch = await templateApi.defaultBranch();
                final workflowSource = await templateApi.readWorkflow(templateBranch);
                if (!workflowSource.contains('repository_dispatch') || !workflowSource.contains('build_flutter_app')) {
                  throw Exception('The configured build_apk.yml does not contain the expected repository_dispatch workflow for app builds. Open Settings and verify the template repository.');
                }
          
                await widget.onSaveProject(_project());
                final existingTarget = normalizeRepository(_targetRepository);
                String targetRepository;
                if (existingTarget.isNotEmpty) {
                  targetRepository = existingTarget;
                  _updateProgress(6, const Duration(minutes: 4), 'Reusing this app’s private repository');
                  targetApi = templateApi.forRepository(targetRepository);
                  targetBranch = await targetApi!.defaultBranch();
                  if (_signRelease) {
                    const requiredSigningSecrets = <String>{
                      'ANDROID_KEYSTORE_BASE64',
                      'ANDROID_KEYSTORE_PASSWORD',
                      'ANDROID_KEY_PASSWORD',
                      'ANDROID_KEY_ALIAS',
                    };
                    final presentSecrets = await targetApi!.actionSecretNames();
                    final missingSecrets = requiredSigningSecrets.difference(presentSecrets).toList()..sort();
                    if (missingSecrets.isNotEmpty) {
                      throw Exception('Release signing is enabled, but these Actions secrets are missing from $targetRepository: ${missingSecrets.join(', ')}. Open Configure signing secrets on GitHub, add all four values, then retry. The build was not started.');
                    }
                  }
                  // Keep each target repo's workflow synced with the editable template in Settings.
                  _setStatus('Updating the app repository with the current workflow template…');
                  await targetApi!.saveWorkflow(targetBranch!, workflowSource);
                } else {
                  _updateProgress(5, const Duration(minutes: 4, seconds: 30), 'Creating a new private GitHub repository');
                  _setStatus('Creating a new private repository “${_repositoryName.text.trim()}”…');
                  final created = await templateApi.createPrivateRepository(
                    _repositoryName.text.trim(),
                    description: 'Private Flutter app source and build workflow for ${_name.text.trim()}',
                  );
                  targetRepository = normalizeRepository((created['full_name'] ?? '').toString());
                  _targetRepository = targetRepository;
                  if (!isValidRepository(targetRepository)) {
                    throw Exception('GitHub created the repository but returned an invalid name: "$targetRepository".');
                  }
                  targetBranch = (created['default_branch'] ?? 'main').toString();
                  targetApi = templateApi.forRepository(targetRepository);
                  // Persist immediately so an interrupted setup can reuse and repair the repo on retry.
                  await widget.onSaveProject(_project(repository: targetRepository));
                  _setStatus('Installing build_apk.yml in $targetRepository…');
                  _updateProgress(8, const Duration(minutes: 4), 'Installing build workflow into the private repository');
                  await targetApi!.saveWorkflow(targetBranch!, workflowSource);
                }
          
                await widget.onSaveProject(_project(repository: targetRepository));
                final hasCustomIcon = _iconBytes != null;
                if (!hasCustomIcon) {
                  _updateProgress(8, const Duration(minutes: 4), 'Ensuring this app repository has a default logo');
                  final templateLogo = await templateApi.readRootLogo(templateBranch);
                  if (templateLogo != null && templateLogo.isNotEmpty) {
                    await targetApi!.saveRootLogoIfMissing(targetBranch!, templateLogo);
                  } else {
                    _setStatus('The template repository has no root logo.png; this project will use Flutter’s default icon unless you choose an icon.');
                  }
                }
                final requestId = '${_projectId}-${DateTime.now().microsecondsSinceEpoch}';
                final iconPath = hasCustomIcon
                    ? '.simple-app-builder/icons/${DateTime.now().millisecondsSinceEpoch}-${DateTime.now().microsecondsSinceEpoch}.png'
                    : '';
                _updateProgress(9, const Duration(minutes: 3, seconds: 30), 'Saving this project’s Dart source archive in its private repository');
                _setStatus('Saving the current Dart source archive to $targetRepository…');
                await targetApi!.saveProjectSourceArchive(targetBranch!, archiveBytes);
                final payloadSize = utf8.encode(jsonEncode({
                  'event_type': 'build_flutter_app',
                  'client_payload': {
                    'project_name': _name.text.trim(),
                    'package_name': _packageName.text.trim(),
                    'dependencies': _dependencies.text.trim(),
                    'android_dependencies': _androidDependencies.text.trim(),
                    'has_custom_icon': hasCustomIcon,
                    'icon_path': iconPath,
                    'request_id': requestId,
                    'options': {
                      'dynamic_themed_icon': _dynamicThemedIcon,
                      'build_format': outputFormat,
                      'sign_release': _signRelease,
                      'app_version': _version.text.trim(),
                    },
                  },
                })).length;
                if (payloadSize > 60000) throw Exception('The GitHub event payload is too large after JSON encoding. Reduce project source size or dependency list.');
                if (hasCustomIcon) {
                  _updateProgress(10, const Duration(minutes: 3, seconds: 30), 'Uploading this project’s icon to its own repository');
                  _setStatus('Uploading this project’s icon to $targetRepository…');
                  await targetApi!.uploadProjectIcon(targetBranch!, iconPath, _iconBytes!);
                  cleanupIconPath = iconPath;
                }
          
                _updateProgress(12, const Duration(minutes: 3, seconds: 30), 'Sending the build request to GitHub Actions');
                _setStatus('Sending build settings to $targetRepository; Dart files are already saved in its private repository…');
                await targetApi!.dispatchBuild(
                  projectName: _name.text.trim(),
                  packageName: _packageName.text.trim(),
                  dependencies: _dependencies.text.trim(),
                  androidDependencies: _androidDependencies.text.trim(),
                  hasCustomIcon: hasCustomIcon,
                  iconPath: iconPath,
                  dynamicThemedIcon: _dynamicThemedIcon,
                  requestId: requestId,
                  buildFormat: outputFormat,
                  signRelease: _signRelease,
                  appVersion: _version.text.trim(),
                );
                final run = await targetApi!.waitForBuild(
                  requestId,
                  _setStatus,
                  (run, percent, remaining, step) {
                    final id = (run['id'] ?? '').toString();
                    final url = (run['html_url'] ?? '').toString();
                    if (mounted) setState(() {
                      if (id.isNotEmpty) _lastRunId = id;
                      if (url.startsWith('https://')) _lastRunUrl = url;
                    });
                    final adjustedPercent = 12 + (percent * 0.80).round();
                    _updateProgress(adjustedPercent, remaining == null ? null : remaining + const Duration(seconds: 12), step);
                  },
                );
                _lastRunId = (run['id'] ?? '').toString();
                _lastRunUrl = (run['html_url'] ?? '').toString();
                _githubBuildSucceeded = true;
                _updateProgress(97, const Duration(seconds: 8), 'GitHub succeeded; retrieving the ${outputFormat.toUpperCase()} artifact');
                _setStatus('GitHub reports success for $targetRepository. Downloading the ${outputFormat.toUpperCase()} artifact…');
                final zip = await targetApi!.downloadGeneratedArtifact(_lastRunId!, outputFormat);
                final archive = ZipDecoder().decodeBytes(zip);
                final expectedExtension = outputFormat == 'aab' ? '.aab' : '.apk';
                ArchiveFile? generated;
                for (final file in archive.files) {
                  if (file.isFile && file.name.toLowerCase().endsWith(expectedExtension)) { generated = file; break; }
                }
                if (generated == null) {
                  final contents = archive.files.where((item) => item.isFile).map((item) => item.name).join(', ');
                  throw Exception('GitHub succeeded but its artifact ZIP contains no ${expectedExtension.substring(1).toUpperCase()}. ZIP entries: ${contents.isEmpty ? '(none)' : contents}. Open the GitHub run to inspect artifact publishing.');
                }
                final outputBytes = Uint8List.fromList(generated.content as List<int>);
                if (outputBytes.length < 4 || outputBytes[0] != 0x50 || outputBytes[1] != 0x4b) {
                  throw Exception('The extracted ${expectedExtension.substring(1).toUpperCase()} does not look like a valid ZIP-based Android artifact.');
                }
                final safeName = _name.text.trim().replaceAll(RegExp(r'[^A-Za-z0-9_-]+'), '-').replaceAll(RegExp(r'-+'), '-').replaceAll(RegExp(r'^-|-$'), '');
                final baseName = safeName.isEmpty ? 'generated_app' : safeName;
                final docs = await getApplicationDocumentsDirectory();
                final outputDir = Directory('${docs.path}${Platform.pathSeparator}generated_outputs');
                await outputDir.create(recursive: true);
                final outputPath = '${outputDir.path}${Platform.pathSeparator}$baseName-${DateTime.now().millisecondsSinceEpoch}$expectedExtension';
                await File(outputPath).writeAsBytes(outputBytes, flush: true);
                if (!mounted) return;
                setState(() {
                  _apkPath = outputPath;
                  _progressPercent = 100;
                  _progressStep = '${outputFormat.toUpperCase()} downloaded and saved';
                  _remainingEstimate = Duration.zero;
                  _estimatedFinishAt = DateTime.now();
                  _status = 'Build succeeded in GitHub. ${outputFormat.toUpperCase()} is ready.\nRepository: $targetRepository\nSaved inside app storage: $outputPath\nUse Save or Share to export it.${outputFormat == 'apk' ? ' Use Install APK to open Android’s package installer.' : ' An AAB cannot be installed directly on the phone.'}${_signRelease ? '\nCustom release signing was requested.' : outputFormat == 'aab' ? '\nNote: a personal release/upload keystore was not configured by this project unless you set the signing secrets in its repository.' : ''}';
                });
                _message('${outputFormat.toUpperCase()} downloaded and ready. Choose Save or Share below.');
              } catch (error) {
                String? automaticLogs;
                if (error is WorkflowRunException) {
                  _lastRunId = error.runId.isEmpty ? _lastRunId : error.runId;
                  _lastRunUrl = error.runUrl.isEmpty ? _lastRunUrl : error.runUrl;
                  _githubBuildSucceeded = false;
                  if (_lastRunId != null) {
                    _setStatus('GitHub build failed. Fetching the run logs…');
                    try {
                      automaticLogs = await (targetApi ?? widget.apiFactory()).downloadWorkflowLogs(_lastRunId!);
                      if (automaticLogs.length > 9000) automaticLogs = '…(earlier log output omitted)…\n${automaticLogs.substring(automaticLogs.length - 9000)}';
                    } catch (logError) {
                      automaticLogs = 'Automatic log retrieval also failed: $logError\nOpen the GitHub run to inspect it.';
                    }
                  }
                }
                if (mounted) {
                  if (!_githubBuildSucceeded) { _updateProgress(_progressPercent, null, 'Build setup or GitHub Actions failed'); }
                  else { _updateProgress(_progressPercent, null, 'GitHub succeeded; retrieving or saving the requested artifact failed'); }
                  final detail = error.toString().replaceFirst(RegExp(r'^Exception: ?'), '');
                  final text = error is WorkflowRunException
                      ? 'GitHub build failed: ${error.message}\nRun: ${error.runUrl}\n${automaticLogs == null ? 'Use “Load build logs” below for step-by-step output.' : 'Automatic log excerpt:\n$automaticLogs'}'
                      : _githubBuildSucceeded
                          ? 'GitHub build SUCCEEDED, but retrieving or saving ${outputFormat.toUpperCase()} failed: $detail\nThe build itself did not fail. Use “Load build logs” or open the successful run in GitHub.'
                          : 'Build could not complete: $detail${_lastRunUrl == null ? '' : '\nRun: $_lastRunUrl'}';
                  setState(() => _status = text);
                }
                _message(_githubBuildSucceeded ? 'GitHub build succeeded, but the requested artifact transfer failed.' : 'Build failed. Details and logs are available below when GitHub has a run ID.');
              } finally {
                if (targetApi != null && targetBranch != null && cleanupIconPath != null) {
                  try {
                    await targetApi!.deleteProjectIcon(targetBranch!, cleanupIconPath!);
                  } catch (cleanupError) {
                    if (mounted) _setStatus('$_status\nNote: temporary icon cleanup failed: $cleanupError');
                  }
                }
                if (mounted) setState(() {
                  _building = false;
                  if (_buildStartedAt != null) {
                    final elapsed = DateTime.now().difference(_buildStartedAt!);
                    final duration = elapsed.inMinutes > 0 ? '${elapsed.inMinutes}m ${elapsed.inSeconds % 60}s' : '${elapsed.inSeconds}s';
                    _status = '$_status\nElapsed time: $duration';
                  }
                });
              }
            }
          
            String get _outputExtension => _buildFormat == 'aab' ? 'aab' : 'apk';
            String get _outputLabel => _outputExtension.toUpperCase();
            String get _outputMime => _outputExtension == 'apk' ? 'application/vnd.android.package-archive' : 'application/octet-stream';
          
            Future<void> _saveApk() async {
              final path = _apkPath;
              if (path == null) return;
              try {
                final rawName = _name.text.trim().replaceAll(RegExp(r'[^A-Za-z0-9_-]+'), '-');
                final name = '${rawName.isEmpty ? 'generated_app' : rawName}.$_outputExtension';
                final output = await FilePicker.saveFile(
                  dialogTitle: 'Save $_outputLabel to device or selected location',
                  fileName: name,
                  mimeType: _outputMime,
                  type: FileType.custom,
                  allowedExtensions: [_outputExtension],
                  bytes: await File(path).readAsBytes(),
                );
                if (output == null) { _message('Save was canceled. The $_outputLabel is still kept in app storage.'); return; }
                _setStatus('$_outputLabel saved to: $output');
                _message('$_outputLabel saved successfully.');
              } catch (error) {
                _message('Could not save $_outputLabel: $error');
                _setStatus('$_outputLabel remains in app storage at ${_apkPath ?? '(unknown path)'}. Save error: $error');
              }
            }
          
            Future<void> _shareApk() async {
              final path = _apkPath;
              if (path == null) return;
              try {
                await SharePlus.instance.share(ShareParams(
                  files: [XFile(path, mimeType: _outputMime)],
                  subject: '${_name.text.trim()} $_outputLabel',
                  text: '${_outputLabel} for ${_name.text.trim()}.',
                ));
              } catch (error) {
                _message('Could not open the Android share sheet: $error');
              }
            }
          
            Future<void> _installApk() async {
              final path = _apkPath;
              if (path == null || _buildFormat != 'apk') return;
              try {
                final result = await OpenFilex.open(path);
                _setStatus('APK installer result: ${result.message}. If Android asks, allow this app to install unknown apps and confirm installation.');
                _message('Android’s installer should open. Confirm installation on the device.');
              } catch (error) {
                _message('Could not launch the Android installer: $error');
              }
            }
          
            Future<void> _showRunLogs() async {
              final runId = _lastRunId;
              if (runId == null || runId.isEmpty) {
                _message('No GitHub run ID is available yet. Open GitHub Actions to see whether GitHub accepted the build.');
                return;
              }
              setState(() => _building = true);
              try {
                _setStatus('Downloading build logs from GitHub…');
                final logs = await widget.apiFactory().downloadWorkflowLogs(runId);
                if (!mounted) return;
                await showDialog<void>(context: context, builder: (dialogContext) => AlertDialog(
                  title: const Text('GitHub Actions build logs'),
                  content: SizedBox(width: 760, height: MediaQuery.of(dialogContext).size.height * 0.7,
                    child: SingleChildScrollView(child: SelectableText(logs, style: const TextStyle(fontFamily: 'monospace', fontSize: 11)))),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(dialogContext), child: const Text('Close')),
                    if (_lastRunUrl != null && _lastRunUrl!.startsWith('https://')) TextButton(onPressed: () => launchUrl(Uri.parse(_lastRunUrl!), mode: LaunchMode.externalApplication), child: const Text('Open run in GitHub')),
                  ],
                ));
                _setStatus('Logs loaded for GitHub run $runId.');
              } catch (error) {
                _setStatus('Could not fetch logs from the app: $error${_lastRunUrl == null ? '' : '\nOpen the run directly in GitHub: $_lastRunUrl'}');
                _message('Could not fetch logs automatically. Open the workflow run in GitHub for logs.');
              } finally {
                if (mounted) setState(() => _building = false);
              }
            }
          
            Future<void> _openRunInGitHub() async {
              final url = _lastRunUrl;
              if (url == null || !url.startsWith('https://')) return;
              await launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
            }
          
            void _setStatus(String message) { if (mounted) setState(() => _status = message); }
          
            Widget _fileTile(String path, {required bool isMain}) => Card(
              margin: const EdgeInsets.only(bottom: 6),
              child: ListTile(
                leading: Icon(isMain ? Icons.play_circle_outline : path.startsWith('android/') ? (path.endsWith('.kt') || path.endsWith('.java') ? Icons.android : Icons.settings_applications_outlined) : Icons.code, color: Theme.of(context).colorScheme.primary),
                title: Text(path.split('/').last, maxLines: 1, overflow: TextOverflow.ellipsis),
                subtitle: Text(_labelForProjectFile(path)),
                onTap: () => _editFile(path),
                trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                  IconButton(tooltip: 'Edit ${path.split('/').last}', onPressed: () => _editFile(path), icon: const Icon(Icons.edit_outlined)),
                  PopupMenuButton<String>(
                    tooltip: 'File actions',
                    onSelected: (action) {
                      if (action == 'rename') _renameFile(path);
                      if (action == 'delete' && !isMain) _removeFile(path);
                    },
                    itemBuilder: (_) => <PopupMenuEntry<String>>[
                      const PopupMenuItem(value: 'rename', child: ListTile(dense: true, leading: Icon(Icons.drive_file_rename_outline), title: Text('Rename / move'))),
                      if (!isMain) const PopupMenuItem(value: 'delete', child: ListTile(dense: true, leading: Icon(Icons.delete_outline), title: Text('Delete file'))),
                    ],
                  ),
                ]),
              ),
            );
          
            @override
            Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: Text(widget.existing == null ? 'Create project' : 'Manage ${widget.existing!.name}')),
              body: Stepper(
                type: StepperType.vertical,
                currentStep: _step,
                onStepTapped: _building ? null : (step) => setState(() => _step = step),
                onStepContinue: _continue,
                onStepCancel: _building ? null : () { if (_step > 0) setState(() => _step--); else Navigator.pop(context); },
                controlsBuilder: (context, details) => Padding(
                  padding: const EdgeInsets.only(top: 16),
                  child: Wrap(spacing: 10, runSpacing: 8, crossAxisAlignment: WrapCrossAlignment.center, children: [
                    FilledButton.icon(
                      onPressed: _building ? null : details.onStepContinue,
                      icon: Icon(_step == 3 ? Icons.rocket_launch_outlined : Icons.arrow_forward),
                      label: Text(_step == 3 ? (_building ? 'Preparing…' : 'Build ${_buildFormat.toUpperCase()}') : 'Continue'),
                    ),
                    if (!_building) TextButton(onPressed: details.onStepCancel, child: Text(_step == 0 ? 'Cancel' : 'Back')),
                  ]),
                ),
                steps: [
                  Step(
                    title: const Text('Project details'),
                    subtitle: const Text('Name and Android package ID'),
                    isActive: _step >= 0,
                    state: _step > 0 ? StepState.complete : StepState.indexed,
                    content: Column(children: [
                      TextField(controller: _name, maxLength: 60, decoration: const InputDecoration(labelText: 'Project name', hintText: 'My Company App')),
                      const SizedBox(height: 12),
                      TextField(controller: _packageName, autocorrect: false, decoration: const InputDecoration(labelText: 'Package name', hintText: 'com.company.myapp', helperText: 'Use lowercase reverse-DNS format with at least three segments.')),
                      const SizedBox(height: 12),
                      TextField(
                        controller: _version,
                        autocorrect: false,
                        keyboardType: TextInputType.text,
                        decoration: const InputDecoration(
