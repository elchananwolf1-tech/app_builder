            Map<String, String> _allProjectFiles() => <String, String>{
              if (_mainFileExists) 'lib/main.dart': _dartCode,
              ..._additionalFiles,
            };
          
            bool _validDetails() {
              if (_name.text.trim().isEmpty || _name.text.trim().length > 60) {
                _message('Project name must be 1–60 characters.');
                return false;
              }
              if (!RegExp(r'^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}$').hasMatch(_packageName.text.trim())) {
                _message('Package name must be lowercase reverse-DNS format, e.g. com.example.myapp.');
                return false;
              }
              final version = _version.text.trim();
              final versionMatch = RegExp(r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\+([1-9]\d*)$').firstMatch(version);
              final buildNumber = versionMatch == null ? null : int.tryParse(versionMatch.group(4)!);
              if (versionMatch == null || buildNumber == null || buildNumber > 2100000000) {
                _message('Version must use major.minor.patch+buildNumber, e.g. 1.2.0+5. The build number must be 1–2100000000.');
                return false;
              }
              final savedRepository = _targetRepository;
              if (savedRepository.isEmpty && !RegExp(r'^[A-Za-z0-9_.-]{1,100}$').hasMatch(_repositoryName.text.trim())) {
                _message('Choose a valid new GitHub repository name: letters, digits, periods, underscores or hyphens.');
                return false;
              }
              return true;
            }
          
            bool _validateFileTree() {
              final files = _allProjectFiles();
              if (!_mainFileExists || _dartCode.trim().isEmpty) {
                _message('Create lib/main.dart and add your Flutter entry point before building. Empty custom projects can be saved first, but need a main.dart to compile.');
                return false;
              }
              if (files.length > 250) {
                _message('A project can contain up to 250 Dart and Android source/configuration files.');
                return false;
              }
              var sourceBytes = 0;
              var dartBytes = 0;
              var androidBytes = 0;
              for (final entry in files.entries) {
                if (!_isSafeProjectFilePath(entry.key)) {
                  _message('Unsupported or unsafe project path: ${entry.key}. Add Dart files under lib/, or native Android Kotlin/Java/XML files under android/app/src/main/.');
                  return false;
                }
                final length = utf8.encode(entry.value).length;
                if (length > 1024 * 1024) {
                  _message('${entry.key} exceeds 1 MB. Split the file or remove generated content.');
                  return false;
                }
                sourceBytes += length;
                if (entry.key.startsWith('lib/')) dartBytes += length; else androidBytes += length;
              }
              if (sourceBytes > 5 * 1024 * 1024 || dartBytes > 2 * 1024 * 1024 || androidBytes > 3 * 1024 * 1024) {
                _message('The source tree is too large (limit: 5 MB total, 2 MB Dart, 3 MB Android text sources). Remove generated or unnecessary files.');
                return false;
              }
              for (final dep in _dependencies.text.split(RegExp(r'[,;\s]+')).where((item) => item.isNotEmpty)) {
                if (!RegExp(r'^[a-z][a-z0-9_]*$').hasMatch(dep)) {
                  _message('Invalid pub.dev package name "$dep". Use names separated by commas, e.g. http,provider.');
                  return false;
                }
              }
              final androidCoordinates = _androidDependencies.text.split(RegExp(r'[,;\s]+')).where((item) => item.isNotEmpty);
              if (androidCoordinates.length > 20) {
                _message('Use at most 20 Android Maven dependencies per project.');
                return false;
              }
              for (final coordinate in androidCoordinates) {
                if (!RegExp(r'^[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.+-]+$').hasMatch(coordinate)) {
                  _message('Invalid Android dependency "$coordinate". Use Maven coordinates group:artifact:version, e.g. androidx.core:core-ktx:1.15.0.');
                  return false;
                }
              }
              return true;
            }
          
            void _message(String message) {
              if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message)));
