                    }
                    lastResponse = response;
                    final remaining = response.headers['x-ratelimit-remaining'];
                    final authOrRateLimit = response.statusCode == 401 ||
                        response.statusCode == 403 ||
                        response.statusCode == 429 ||
                        remaining == '0';
                    if (authOrRateLimit && autoFailover && index < candidates.length - 1) {
                      tryNextAccount = true;
                      break;
                    }
                    final transientStatus = response.statusCode == 429 || response.statusCode == 500 ||
                        response.statusCode == 502 || response.statusCode == 503 || response.statusCode == 504;
                    if (canSafelyRetry && transientStatus && attempt < attempts - 1) {
