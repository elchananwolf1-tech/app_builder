          bool _isSafeDartPath(String path) {
            if (!path.startsWith('lib/') || !path.endsWith('.dart') || path.contains('\\')) return false;
            if (!RegExp(r'^lib/[A-Za-z0-9_./-]+\.dart$').hasMatch(path)) return false;
            final segments = path.split('/');
            return !segments.any((part) => part.isEmpty || part == '.' || part == '..');
          }

          bool _isSafeFolderPath(String path) {
            if (!path.startsWith('lib/') || path.contains('\\') || path.endsWith('/')) return false;
            if (!RegExp(r'^lib/[A-Za-z0-9_./-]+$').hasMatch(path)) return false;
            final segments = path.split('/');
            return segments.length >= 2 && !segments.any((part) => part.isEmpty || part == '.' || part == '..');
          }

          Set<String> _folderAncestors(String path) {
            final pieces = path.split('/');
            if (pieces.length < 3) return <String>{};
            final result = <String>{};
            var current = pieces.first;
            for (final piece in pieces.skip(1).take(pieces.length - 2)) {
              current = '$current/$piece';
              result.add(current);
            }
            return result;
          }

          String _widgetClassNameForPath(String path) {
            final stem = path.split('/').last.replaceFirst(RegExp(r'\.dart$'), '');
            final parts = stem.split(RegExp(r'[^A-Za-z0-9]+')).where((part) => part.isNotEmpty);
            var result = parts.map((part) => part[0].toUpperCase() + part.substring(1)).join();
            if (result.isEmpty || RegExp(r'^[0-9]').hasMatch(result)) result = 'Generated$result';
            return result;
          }

          class WorkflowRunException implements Exception {
            const WorkflowRunException({required this.message, required this.runId, required this.runUrl});
            final String message;
            final String runId;
            final String runUrl;
            @override
            String toString() => message;
          }

          String normalizeRepository(String value) => value.trim().replaceAll(RegExp(r'\s*/\s*'), '/');

          bool isValidRepository(String value) => RegExp(r'^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$').hasMatch(normalizeRepository(value));

          class GitHubApi {
            GitHubApi({
              required this.repository,
              required this.accounts,
              required this.autoFailover,
              this.onPromote,
            });

            final String repository;
            final List<GitHubAccount> accounts;
            final bool autoFailover;
            final void Function(GitHubAccount account)? onPromote;

            String get _repoPath {
              final normalized = normalizeRepository(repository);
              final parts = normalized.split('/');
              if (parts.length != 2 || parts.any((part) => part.isEmpty || part.contains(' '))) {
                throw FormatException('Invalid GitHub repository "$repository". Use owner/repository without spaces.');
              }
              return '/repos/${Uri.encodeComponent(parts[0])}/${Uri.encodeComponent(parts[1])}';
            }

            GitHubApi forRepository(String value) => GitHubApi(
              repository: normalizeRepository(value),
              accounts: accounts,
              autoFailover: autoFailover,
              onPromote: onPromote,
            );

            Future<http.Response> request(
              String method,
              String path, {
              Object? body,
            }) async {
              if (accounts.isEmpty) throw Exception('Add a GitHub account in Settings first.');
              final candidates = autoFailover ? accounts : <GitHubAccount>[accounts.first];
              http.Response? lastResponse;
              Object? lastError;

              for (var index = 0; index < candidates.length; index++) {
                final account = candidates[index];
                try {
                  final headers = <String, String>{
                    'Accept': 'application/vnd.github+json',
                    'Authorization': 'Bearer ${account.token}',
                    'X-GitHub-Api-Version': '2022-11-28',
                    'User-Agent': 'Simple-App-Builder',
                  };
                  if (body != null) headers['Content-Type'] = 'application/json; charset=utf-8';
                  final uri = path.startsWith('https://')
                      ? Uri.parse(path)
                      : Uri.parse('https://api.github.com$path');
                  late final http.Response response;
                  switch (method.toUpperCase()) {
                    case 'GET':
                      response = await http.get(uri, headers: headers).timeout(const Duration(seconds: 45));
                      break;
                    case 'POST':
                      response = await http.post(uri, headers: headers, body: body == null ? null : jsonEncode(body)).timeout(const Duration(seconds: 45));
                      break;
                    case 'PUT':
                      response = await http.put(uri, headers: headers, body: body == null ? null : jsonEncode(body)).timeout(const Duration(seconds: 45));
                      break;
                    case 'DELETE':
                      response = await http.delete(uri, headers: headers, body: body == null ? null : jsonEncode(body)).timeout(const Duration(seconds: 45));
                      break;
                    default:
                      throw UnsupportedError('Unsupported HTTP method: $method');
                  }
                  lastResponse = response;
                  final remaining = response.headers['x-ratelimit-remaining'];
                  final retryable = response.statusCode == 401 ||
                      response.statusCode == 403 ||
                      response.statusCode == 429 ||
                      remaining == '0';
                  if (retryable && autoFailover && index < candidates.length - 1) {
                    continue;
                  }
                  if (response.statusCode < 400 && index > 0) onPromote?.call(account);
                  return response;
                } catch (error) {
                  lastError = error;
                  if (!autoFailover || index == candidates.length - 1) break;
                }
              }
              if (lastResponse != null) return lastResponse;
              throw Exception('GitHub API request failed: ${lastError ?? 'unknown network error'}');
            }

            Map<String, dynamic> checkedJson(http.Response response) {
              dynamic parsed;
              try {
                parsed = jsonDecode(response.body);
              } catch (_) {
                parsed = null;
              }
              if (response.statusCode < 200 || response.statusCode >= 300) {
                final message = (parsed is Map ? (parsed['message'] ?? response.body) : response.body).toString();
                final excerpt = message.length > 350 ? message.substring(0, 350) : message;
                if (response.statusCode == 404) {
                  throw Exception('GitHub API 404 for repository "${normalizeRepository(repository)}": $excerpt. Verify the exact owner/repository and confirm this token can access it. If this is the workflow template repository, verify it in Settings; if it is a project repository, confirm creation finished and the token has repo + workflow scopes. Spaces around / are normalized automatically.');
                }
                throw Exception('GitHub API ${response.statusCode}: $excerpt');
              }
              if (parsed is! Map<String, dynamic>) throw Exception('GitHub returned an unexpected response.');
              return parsed;
            }

            Future<String> defaultBranch() async {
              final json = checkedJson(await request('GET', _repoPath));
              return (json['default_branch'] ?? 'main').toString();
            }

            Future<Set<String>> actionSecretNames() async {
              final json = checkedJson(await request('GET', '$_repoPath/actions/secrets?per_page=100'));
              final secrets = (json['secrets'] as List<dynamic>? ?? const <dynamic>[])
                  .whereType<Map<String, dynamic>>();
              return secrets.map((item) => (item['name'] ?? '').toString()).where((name) => name.isNotEmpty).toSet();
            }

            Future<Map<String, dynamic>> createPrivateRepository(String name, {String? description}) async {
              final cleaned = name.trim();
              if (!RegExp(r'^[A-Za-z0-9_.-]{1,100}$').hasMatch(cleaned)) {
                throw Exception('Repository name must use only letters, digits, periods, underscores or hyphens (max 100 characters).');
              }
              final response = await request('POST', '/user/repos', body: {
                'name': cleaned,
                'description': description ?? 'Flutter app generated with Simple App Builder',
                'private': true,
                'auto_init': true,
                'has_issues': true,
                'has_wiki': false,
                'has_projects': false,
              });
              final created = checkedJson(response);
              final fullName = (created['full_name'] ?? '').toString();
              if (fullName.isEmpty) throw Exception('GitHub created the repository but did not return owner/repository.');
              return created;
            }

            Future<String> readWorkflow(String branch) async {
              final uriPath = '$_repoPath/contents/.github/workflows/$workflowFile?ref=${Uri.encodeQueryComponent(branch)}';
              final json = checkedJson(await request('GET', uriPath));
              final encoded = (json['content'] ?? '').toString().replaceAll(RegExp(r'\s'), '');
              return utf8.decode(base64.decode(encoded));
            }

            Future<void> saveWorkflow(String branch, String source) async {
              final filePath = '$_repoPath/contents/.github/workflows/$workflowFile';
              final current = await request('GET', '$filePath?ref=${Uri.encodeQueryComponent(branch)}');
              String? sha;
              if (current.statusCode == 200) {
                final json = jsonDecode(current.body) as Map<String, dynamic>;
                sha = json['sha']?.toString();
              } else if (current.statusCode != 404) {
                checkedJson(current);
              }
              final body = <String, dynamic>{
                'message': sha == null ? 'Install Simple App Builder workflow' : 'Update build workflow from Simple App Builder',
                'content': base64Encode(utf8.encode(source)),
                'branch': branch,
              };
              if (sha != null && sha.isNotEmpty) body['sha'] = sha;
              checkedJson(await request('PUT', filePath, body: body));
            }

            Future<Uint8List?> readRootLogo(String branch) async {
              final response = await request('GET', '$_repoPath/contents/logo.png?ref=${Uri.encodeQueryComponent(branch)}');
              if (response.statusCode == 404) return null;
              final json = checkedJson(response);
              final encoded = (json['content'] ?? '').toString().replaceAll(RegExp(r'\s'), '');
              if (encoded.isEmpty) {
                final reportedSize = (json['size'] as num?)?.toInt() ?? 0;
                if (reportedSize > 0) {
                  throw Exception('GitHub did not return the contents of logo.png (reported size: $reportedSize bytes). Keep logo.png under 1 MB or reduce its size, then retry.');
                }
                return null;
              }
              final bytes = Uint8List.fromList(base64.decode(encoded));
              if (bytes.length > 8 * 1024 * 1024) {
                throw Exception('The template logo.png exceeds 8 MB. Optimize the logo before building.');
              }
              return bytes;
            }

            Future<void> saveRootLogoIfMissing(String branch, Uint8List bytes) async {
              final filePath = '$_repoPath/contents/logo.png';
              final current = await request('GET', '$filePath?ref=${Uri.encodeQueryComponent(branch)}');
              if (current.statusCode == 200) {
                // Never overwrite an existing per-project logo; it may be intentional.
                return;
              }
              if (current.statusCode != 404) checkedJson(current);
              final body = <String, dynamic>{
                'message': 'Add default launcher logo from Simple App Builder template',
                'content': base64Encode(bytes),
                'branch': branch,
              };
              checkedJson(await request('PUT', filePath, body: body));
            }

            Future<void> saveProjectSourceArchive(String branch, Uint8List bytes) async {
              const filePath = '.simple-app-builder/source.zip';
              final path = '$_repoPath/contents/$filePath?ref=${Uri.encodeQueryComponent(branch)}';
              final existing = await request('GET', path);
              String? sha;
              if (existing.statusCode == 200) {
                sha = (jsonDecode(existing.body) as Map<String, dynamic>)['sha']?.toString();
              } else if (existing.statusCode != 404) {
                checkedJson(existing);
              }
              final body = <String, dynamic>{
                'message': 'Save current Dart source archive from Simple App Builder',
                'content': base64Encode(bytes),
                'branch': branch,
              };
              if (sha != null && sha.isNotEmpty) body['sha'] = sha;
              checkedJson(await request('PUT', '$_repoPath/contents/$filePath', body: body));
            }

            Future<void> uploadProjectIcon(String branch, String filePath, Uint8List bytes) async {
              if (!RegExp(r'^\.simple-app-builder/icons/[0-9]+-[0-9]+\.png$').hasMatch(filePath)) {
                throw Exception('Refusing to upload an icon to an unexpected repository path.');
              }
              final path = '$_repoPath/contents/$filePath?ref=${Uri.encodeQueryComponent(branch)}';
              final existing = await request('GET', path);
              String? sha;
              if (existing.statusCode == 200) {
                sha = (jsonDecode(existing.body) as Map<String, dynamic>)['sha']?.toString();
              } else if (existing.statusCode != 404) {
                checkedJson(existing);
              }
              final body = <String, dynamic>{
                'message': 'Upload per-build app icon from Simple App Builder',
                'content': base64Encode(bytes),
                'branch': branch,
              };
              if (sha != null) body['sha'] = sha;
              checkedJson(await request('PUT', '$_repoPath/contents/$filePath', body: body));
            }

            Future<void> deleteProjectIcon(String branch, String filePath) async {
              if (!RegExp(r'^\.simple-app-builder/icons/[0-9]+-[0-9]+\.png$').hasMatch(filePath)) return;
              final current = await request('GET', '$_repoPath/contents/$filePath?ref=${Uri.encodeQueryComponent(branch)}');
              if (current.statusCode == 404) return;
              final json = checkedJson(current);
              final sha = (json['sha'] ?? '').toString();
              if (sha.isEmpty) throw Exception('Could not read SHA for temporary icon cleanup.');
              checkedJson(await request('DELETE', '$_repoPath/contents/$filePath', body: {
                'message': 'Remove temporary Simple App Builder icon',
                'sha': sha,
                'branch': branch,
              }));
            }

            Future<void> dispatchBuild({
              required String projectName,
              required String packageName,
              required String dependencies,
              required bool hasCustomIcon,
              required String iconPath,
              required bool removeBackground,
              required String iconBackgroundColor,
              required bool dynamicThemedIcon,
              required String requestId,
              String buildFormat = 'apk',
              bool signRelease = false,
            }) async {
              // repository_dispatch keeps project fields out of GitHub's static
              // "Run workflow" form. The mobile app sends a different payload per build.
              final response = await request('POST', '$_repoPath/dispatches', body: {
                'event_type': 'build_flutter_app',
                'client_payload': {
                  'project_name': projectName,
                  'package_name': packageName,
                  'dependencies': dependencies,
                  'has_custom_icon': hasCustomIcon,
                  'icon_path': iconPath,
                  'remove_background': removeBackground,
                  'icon_background_color': iconBackgroundColor,
                  'dynamic_themed_icon': dynamicThemedIcon,
                  'build_format': buildFormat,
                  'sign_release': signRelease,
                  'request_id': requestId,
                },
              });
              if (response.statusCode != 204 && response.statusCode != 201) {
                checkedJson(response);
                throw Exception('GitHub did not accept the app-build request.');
              }
            }

            int _typicalStepSeconds(String name) {
              final value = name.toLowerCase();
              if (value.contains('checkout')) return 8;
              if (value.contains('validate')) return 3;
              if (value.contains('prepare artifact')) return 2;
              if (value.contains('java')) return 12;
              if (value.contains('flutter stable')) return 45;
              if (value.contains('patch helper')) return 2;
              if (value.contains('create the requested flutter project')) return 28;
              if (value.contains('apply selected image')) return 30;
              if (value.contains('build requested output')) return 150;
              if (value.contains('upload generated release apk')) return 10;
              if (value.contains('upload generated android app bundle')) return 10;
              if (value.contains('upload generated flutter web preview')) return 10;
              if (value.contains('generate the real simple app builder')) return 120;
              if (value.contains('upload simple app builder')) return 8;
              return 25;
            }

            int? _stepDurationSeconds(Map<String, dynamic> step) {
              final start = DateTime.tryParse((step['started_at'] ?? '').toString());
              final end = DateTime.tryParse((step['completed_at'] ?? '').toString());
              if (start == null || end == null) return null;
              final value = end.difference(start).inSeconds;
              return value < 1 ? 1 : value;
            }

            Future<Map<String, dynamic>?> readRunProgress(String runId) async {
              try {
                final json = checkedJson(await request('GET', '$_repoPath/actions/runs/$runId/jobs?per_page=100'));
                final jobs = (json['jobs'] as List<dynamic>? ?? const []).whereType<Map<String, dynamic>>();
                final steps = <Map<String, dynamic>>[];
                for (final job in jobs) {
                  final jobSteps = job['steps'];
                  if (jobSteps is List) steps.addAll(jobSteps.whereType<Map<String, dynamic>>());
                }
                if (steps.isEmpty) return null;
                final now = DateTime.now().toUtc();
                var completedSeconds = 0;
                var totalSeconds = 0;
                var remainingSeconds = 0;
                var activeName = 'Running GitHub Actions steps';
                for (final step in steps) {
                  final name = (step['name'] ?? 'Build step').toString();
                  final status = (step['status'] ?? 'queued').toString();
                  final conclusion = (step['conclusion'] ?? '').toString();
                  if (status == 'completed' && conclusion == 'skipped') continue;
                  final typical = _typicalStepSeconds(name);
                  if (status == 'completed') {
                    final actual = _stepDurationSeconds(step) ?? typical;
                    completedSeconds += actual;
                    totalSeconds += actual;
                  } else if (status == 'in_progress') {
                    activeName = name;
                    final started = DateTime.tryParse((step['started_at'] ?? '').toString());
                    final elapsed = started == null ? 0 : now.difference(started.toUtc()).inSeconds.clamp(0, 36000).toInt();
                    final expected = elapsed >= typical ? elapsed + (typical ~/ 4).clamp(8, 45).toInt() : typical;
                    completedSeconds += elapsed;
                    totalSeconds += expected;
                    remainingSeconds += (expected - elapsed).clamp(0, 36000).toInt();
                  } else {
                    totalSeconds += typical;
                    remainingSeconds += typical;
                  }
                }
                var percent = totalSeconds <= 0 ? 3 : (completedSeconds * 100 / totalSeconds).round();
                if (percent < 3) percent = 3;
                if (percent > 96) percent = 96;
                return {
                  'percent': percent,
                  'remainingSeconds': remainingSeconds,
                  'step': activeName,
                };
              } catch (_) {
                // Progress telemetry is best-effort. It must never fail a working build.
                return null;
              }
            }

            Future<Map<String, dynamic>> waitForBuild(
              String requestId,
              void Function(String message) onStatus,
              void Function(Map<String, dynamic> run, int percent, Duration? remaining, String step) onProgress,
            ) async {
              final pollingStarted = DateTime.now();
              for (var attempt = 0; attempt < 660; attempt++) {
                await Future<void>.delayed(const Duration(seconds: 5));
                final runsResponse = await request(
                  'GET',
                  '$_repoPath/actions/runs?event=repository_dispatch&per_page=50',
                );
                if (runsResponse.statusCode == 404) {
                  onStatus('GitHub accepted the request; waiting for the new repository Actions workflow to appear…');
                  final elapsed = DateTime.now().difference(pollingStarted).inSeconds;
                  final Duration? remaining = elapsed >= 210 ? null : Duration(seconds: 240 - elapsed);
                  onProgress({'id': '', 'html_url': '', 'run_number': 0}, 2, remaining, 'Waiting for GitHub to initialize Actions');
                  continue;
                }
                final result = checkedJson(runsResponse);
                final runs = (result['workflow_runs'] as List<dynamic>? ?? const [])
                    .whereType<Map<String, dynamic>>()
                    .where((run) => (run['display_title'] ?? '').toString() == requestId)
                    .toList()
                  ..sort((a, b) => (b['run_number'] as int? ?? 0).compareTo(a['run_number'] as int? ?? 0));
                if (runs.isEmpty) {
                  onStatus('Waiting for GitHub to register the build…');
                  final elapsed = DateTime.now().difference(pollingStarted).inSeconds;
                  final Duration? remaining = elapsed >= 210 ? null : Duration(seconds: 240 - elapsed);
                  onProgress({'id': '', 'html_url': '', 'run_number': 0}, 2, remaining, 'Waiting for GitHub to register the build');
                  continue;
                }
                final run = runs.first;
                final status = (run['status'] ?? 'queued').toString();
                final number = run['run_number']?.toString() ?? '';
                final runId = (run['id'] ?? '').toString();
                onStatus('Workflow #$number: $status');
                Map<String, dynamic>? snapshot;
                if (runId.isNotEmpty) snapshot = await readRunProgress(runId);
                if (status == 'queued' || snapshot == null) {
                  final created = DateTime.tryParse((run['created_at'] ?? '').toString());
                  final queuedElapsed = created == null ? 0 : DateTime.now().toUtc().difference(created.toUtc()).inSeconds;
                  final Duration? remaining = queuedElapsed >= 240
                    ? null
                    : Duration(seconds: (240 - queuedElapsed) < 25 ? 25 : 240 - queuedElapsed);
                  onProgress(run, status == 'queued' ? 3 : 8, remaining, status == 'queued' ? 'Waiting for a GitHub runner' : 'Starting build steps and estimating duration');
                } else {
                  onProgress(run, (snapshot['percent'] as int?) ?? 8, Duration(seconds: (snapshot['remainingSeconds'] as int?) ?? 120), (snapshot['step'] ?? 'Building').toString());
                }
                if (status == 'completed') {
                  if (run['conclusion'] != 'success') {
                    final url = (run['html_url'] ?? '').toString();
                    throw WorkflowRunException(message: 'GitHub Actions concluded the build as ${run['conclusion'] ?? 'failure'}. Open the run or load its logs below.', runId: runId, runUrl: url);
                  }
                  onProgress(run, 97, const Duration(seconds: 8), 'Build finished; downloading the requested artifact');
                  return run;
                }
              }
              throw TimeoutException('Build did not finish within 55 minutes. Check the Actions tab in GitHub.');
            }

            Future<Uint8List> _downloadZipEndpoint(String endpoint) async {
              if (accounts.isEmpty) throw Exception('No GitHub account is configured.');
              final candidates = autoFailover ? accounts : <GitHubAccount>[accounts.first];
              Object? lastError;
              for (var index = 0; index < candidates.length; index++) {
                final account = candidates[index];
                final client = http.Client();
                try {
                  final uri = endpoint.startsWith('https://') ? Uri.parse(endpoint) : Uri.parse('https://api.github.com$endpoint');
                  final apiRequest = http.Request('GET', uri)
                    ..followRedirects = false
                    ..headers.addAll({
                      'Accept': 'application/vnd.github+json',
                      'Authorization': 'Bearer ${account.token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'Simple-App-Builder',
                    });
                  final streamed = await client.send(apiRequest).timeout(const Duration(minutes: 3));
                  final initial = await http.Response.fromStream(streamed).timeout(const Duration(minutes: 3));
                  Uint8List bytes;
                  if (initial.statusCode == 302 || initial.statusCode == 303 || initial.statusCode == 307 || initial.statusCode == 308) {
                    final location = initial.headers['location'];
                    if (location == null || location.isEmpty) throw Exception('GitHub returned HTTP ${initial.statusCode} without a download Location header.');
                    // GitHub's signed artifact URL is on a separate storage host. Do not forward the PAT to it.
                    final downloadRequest = http.Request('GET', uri.resolve(location))..followRedirects = true;
                    final downloadStream = await client.send(downloadRequest).timeout(const Duration(minutes: 3));
                    final downloadResponse = await http.Response.fromStream(downloadStream).timeout(const Duration(minutes: 3));
                    if (downloadResponse.statusCode != 200) {
                      final excerpt = utf8.decode(downloadResponse.bodyBytes.take(300).toList(), allowMalformed: true);
                      throw Exception('Signed artifact URL returned HTTP ${downloadResponse.statusCode}: ${excerpt.trim()}');
                    }
                    bytes = Uint8List.fromList(downloadResponse.bodyBytes);
                  } else if (initial.statusCode == 200) {
                    bytes = Uint8List.fromList(initial.bodyBytes);
                  } else {
                    final retryable = initial.statusCode == 401 || initial.statusCode == 403 || initial.statusCode == 429;
                    final excerpt = initial.body.length > 300 ? initial.body.substring(0, 300) : initial.body;
                    final error = Exception('GitHub artifact download endpoint returned HTTP ${initial.statusCode}: ${excerpt.trim()}');
                    if (retryable && autoFailover && index < candidates.length - 1) { lastError = error; continue; }
                    throw error;
                  }
                  if (bytes.length < 4 || bytes[0] != 0x50 || bytes[1] != 0x4b) {
                    final excerpt = utf8.decode(bytes.take(200).toList(), allowMalformed: true);
                    throw Exception('GitHub download returned ${bytes.length} bytes, but it is not a ZIP archive. ${excerpt.trim()}');
                  }
                  if (index > 0) onPromote?.call(account);
                  return bytes;
                } catch (error) {
                  lastError = error;
                  if (!autoFailover || index == candidates.length - 1) break;
                } finally {
                  client.close();
                }
              }
              throw Exception('Could not download GitHub ZIP data: ${lastError ?? 'unknown download error'}');
            }

            Future<Uint8List> downloadGeneratedArtifact(String runId, String format) async {
              final prefix = switch (format) {
                'aab' => 'generated-aab-',
                'web_preview' => 'generated-web-',
                _ => 'generated-apk-',
              };
              final label = switch (format) {
                'aab' => 'Android App Bundle',
                'web_preview' => 'Flutter Web preview',
                _ => 'APK',
              };
              final json = checkedJson(await request('GET', '$_repoPath/actions/runs/$runId/artifacts?per_page=100'));
              final artifacts = (json['artifacts'] as List<dynamic>? ?? const []).whereType<Map<String, dynamic>>();
              final matching = artifacts.where((a) =>
                (a['name'] ?? '').toString().startsWith(prefix) && a['expired'] != true).toList();
              if (matching.isEmpty) {
                final names = artifacts.map((a) => (a['name'] ?? '(unnamed)').toString()).join(', ');
                throw Exception('GitHub run succeeded but no $label artifact was attached. Artifacts reported by GitHub: ${names.isEmpty ? '(none)' : names}');
              }
              matching.sort((a, b) => ((b['created_at'] ?? '').toString()).compareTo((a['created_at'] ?? '').toString()));
              final artifactId = matching.first['id']?.toString();
              if (artifactId == null || artifactId.isEmpty) throw Exception('GitHub listed the $label artifact without an artifact ID.');
              return _downloadZipEndpoint('$_repoPath/actions/artifacts/$artifactId/zip');
            }

            Future<String> downloadWorkflowLogs(String runId) async {
              final zipBytes = await _downloadZipEndpoint('$_repoPath/actions/runs/$runId/logs');
              final archive = ZipDecoder().decodeBytes(zipBytes);
              final sections = <String>[];
              for (final file in archive.files.where((item) => item.isFile)) {
                final content = utf8.decode(file.content as List<int>, allowMalformed: true);
                final trimmed = content.length > 16000 ? '…(earlier log lines omitted)…\n${content.substring(content.length - 16000)}' : content;
                sections.add('===== ${file.name} =====\n$trimmed');
              }
              if (sections.isEmpty) throw Exception('The workflow log archive was empty. Open the run in GitHub to inspect it.');
              return sections.join('\n\n');
            }
          }

          Future<String?> verifyAccount(String username, String token) async {
            try {
              final response = await http.get(
                Uri.https('api.github.com', '/user'),
                headers: {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer $token',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Simple-App-Builder',
                },
              ).timeout(const Duration(seconds: 30));
              if (response.statusCode != 200) {
                return 'GitHub rejected this token (HTTP ${response.statusCode}). Check the token and its scopes.';
              }
              final actual = (jsonDecode(response.body) as Map<String, dynamic>)['login'].toString();
              if (actual.toLowerCase() != username.trim().toLowerCase()) {
                return 'This token belongs to "$actual", not "${username.trim()}".';
              }
              final scopeHeader = (response.headers['x-oauth-scopes'] ?? '').trim();
              if (scopeHeader.isNotEmpty) {
                final scopes = scopeHeader.split(',').map((scope) => scope.trim()).where((scope) => scope.isNotEmpty).toSet();
                final missing = <String>[];
                if (!scopes.contains('repo')) missing.add('repo');
                if (!scopes.contains('workflow')) missing.add('workflow');
                if (missing.isNotEmpty) {
                  return 'The token is valid but is missing required classic-token scopes: ${missing.join(', ')}. Create a classic token with BOTH repo and workflow scopes so the builder can create private repositories and install the workflow.';
                }
              }
              return null;
            } catch (error) {
              return 'Could not verify the account: $error';
            }
          }

          class SimpleAppBuilder extends StatefulWidget {
            const SimpleAppBuilder({super.key});

            @override
            State<SimpleAppBuilder> createState() => _SimpleAppBuilderState();
          }

          class _SimpleAppBuilderState extends State<SimpleAppBuilder> {
            bool _ready = false;
            List<GitHubAccount> _accounts = [];
            List<AppProject> _projects = [];
            bool _autoFailover = true;
            String _repository = compiledRepository;

            @override
            void initState() {
              super.initState();
              _loadState();
            }

            Future<void> _loadState() async {
              final prefs = await SharedPreferences.getInstance();
              try {
                final rawAccounts = await secureStorage.read(key: 'github_accounts_v1');
                if (rawAccounts != null) {
                  _accounts = (jsonDecode(rawAccounts) as List<dynamic>)
                      .whereType<Map<String, dynamic>>()
                      .map(GitHubAccount.fromJson)
                      .where((a) => a.username.isNotEmpty && a.token.isNotEmpty)
                      .toList();
                }
              } catch (_) {
                _accounts = [];
              }
              try {
                final rawProjects = prefs.getString('projects_v1');
                if (rawProjects != null) {
                  _projects = (jsonDecode(rawProjects) as List<dynamic>)
                      .whereType<Map<String, dynamic>>()
                      .map(AppProject.fromJson)
                      .toList();
                }
              } catch (_) {
                _projects = [];
              }
              _autoFailover = prefs.getBool('auto_failover') ?? true;
              _repository = normalizeRepository(prefs.getString('repository') ?? compiledRepository);
              if (mounted) setState(() => _ready = true);
            }

            Future<void> _saveAccounts(List<GitHubAccount> accounts) async {
              _accounts = List<GitHubAccount>.from(accounts);
              await secureStorage.write(
                key: 'github_accounts_v1',
                value: jsonEncode(_accounts.map((a) => a.toJson()).toList()),
              );
              if (mounted) setState(() {});
            }

            Future<void> _saveProjects(List<AppProject> projects) async {
              _projects = List<AppProject>.from(projects);
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('projects_v1', jsonEncode(_projects.map((p) => p.toJson()).toList()));
              if (mounted) setState(() {});
            }

            Future<void> _saveFailover(bool enabled) async {
              _autoFailover = enabled;
              final prefs = await SharedPreferences.getInstance();
              await prefs.setBool('auto_failover', enabled);
              if (mounted) setState(() {});
            }

            Future<void> _saveRepository(String repository) async {
              _repository = normalizeRepository(repository);
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('repository', _repository);
              if (mounted) setState(() {});
            }

            void _promoteAccount(GitHubAccount account) {
              final next = <GitHubAccount>[
                account,
                ..._accounts.where((a) => a.username.toLowerCase() != account.username.toLowerCase()),
              ];
              unawaited(_saveAccounts(next));
            }

            GitHubApi _api() => GitHubApi(
                  repository: _repository,
                  accounts: List<GitHubAccount>.from(_accounts),
                  autoFailover: _autoFailover,
                  onPromote: _promoteAccount,
                );

            ThemeData _theme(ColorScheme scheme) => ThemeData(
                  colorScheme: scheme,
                  useMaterial3: true,
                  scaffoldBackgroundColor: scheme.surface,
                  appBarTheme: const AppBarThemeData(centerTitle: false),
                  inputDecorationTheme: const InputDecorationThemeData(
                    border: OutlineInputBorder(),
                    filled: true,
                  ),
                  cardTheme: const CardThemeData(clipBehavior: Clip.antiAlias),
                );

            @override
            Widget build(BuildContext context) => DynamicColorBuilder(
                  builder: (ColorScheme? lightDynamic, ColorScheme? darkDynamic) {
                    // Explicit types prevent inference from widening the values to Diagnosticable.
                    final ColorScheme light = lightDynamic ??
                        ColorScheme.fromSeed(seedColor: const Color(0xFF6750A4));
                    final ColorScheme dark = darkDynamic ??
                        ColorScheme.fromSeed(
                          seedColor: const Color(0xFFD0BCFF),
                          brightness: Brightness.dark,
                        );
                    return MaterialApp(
                      title: 'Simple App Builder',
                      debugShowCheckedModeBanner: false,
                      theme: _theme(light),
                      darkTheme: _theme(dark),
                      themeMode: ThemeMode.system,
                      home: !_ready
                          ? const _LoadingScreen()
                          : _accounts.isEmpty
                              ? SetupScreen(onSetup: (account) async {
                                  await _saveAccounts([account]);
                                })
                              : DashboardScreen(
                                  accounts: _accounts,
                                  projects: _projects,
                                  autoFailover: _autoFailover,
                                  repository: _repository,
                                  apiFactory: _api,
                                  onAccountsChanged: _saveAccounts,
                                  onProjectsChanged: _saveProjects,
                                  onFailoverChanged: _saveFailover,
                                  onRepositoryChanged: _saveRepository,
                                ),
                    );
                  },
                );
          }

          class _LoadingScreen extends StatelessWidget {
            const _LoadingScreen();
            @override
            Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator()));
          }

          class SetupScreen extends StatefulWidget {
            const SetupScreen({super.key, required this.onSetup});
            final Future<void> Function(GitHubAccount account) onSetup;

            @override
            State<SetupScreen> createState() => _SetupScreenState();
          }

          class _SetupScreenState extends State<SetupScreen> {
            final _username = TextEditingController();
            final _token = TextEditingController();
            bool _busy = false;
            bool _obscure = true;
            String? _error;

            @override
            void dispose() {
              _username.dispose();
              _token.dispose();
              super.dispose();
            }

            Future<void> _connect() async {
              if (_username.text.trim().isEmpty || _token.text.trim().isEmpty) {
                setState(() => _error = 'Enter both your GitHub username and personal access token.');
                return;
              }
              setState(() { _busy = true; _error = null; });
              final username = _username.text.trim();
              final token = _token.text.trim();
              final error = await verifyAccount(username, token);
              if (error != null) {
                if (mounted) setState(() { _busy = false; _error = error; });
                return;
              }
              await widget.onSetup(GitHubAccount(username: username, token: token));
              if (mounted) setState(() => _busy = false);
            }

            @override
            Widget build(BuildContext context) => Scaffold(
                  appBar: AppBar(title: const Text('Set up GitHub')),
                  body: Center(
                    child: ConstrainedBox(
                      constraints: const BoxConstraints(maxWidth: 680),
                      child: ListView(
                        padding: const EdgeInsets.all(20),
                        children: [
                          const Icon(Icons.rocket_launch_rounded, size: 58),
                          const SizedBox(height: 12),
                          Text('Connect your GitHub account', style: Theme.of(context).textTheme.headlineSmall),
                          const SizedBox(height: 8),
                          const Text('Your account is used to trigger the workflow in the repository this builder was compiled for. Tokens are stored using Android secure storage and are not written to build logs.'),
                          const SizedBox(height: 20),
                          TextField(controller: _username, textInputAction: TextInputAction.next, autocorrect: false, decoration: const InputDecoration(labelText: 'GitHub username', prefixIcon: Icon(Icons.person_outline))),
                          const SizedBox(height: 12),
                          TextField(controller: _token, obscureText: _obscure, autocorrect: false, enableSuggestions: false, decoration: InputDecoration(labelText: 'Personal access token (classic)', prefixIcon: const Icon(Icons.key_outlined), suffixIcon: IconButton(onPressed: () => setState(() => _obscure = !_obscure), icon: Icon(_obscure ? Icons.visibility : Icons.visibility_off)))),
                          if (_error != null) ...[
                            const SizedBox(height: 12),
                            Text(_error!, style: TextStyle(color: Theme.of(context).colorScheme.error)),
                          ],
                          const SizedBox(height: 14),
                          FilledButton.icon(onPressed: _busy ? null : _connect, icon: _busy ? const SizedBox(width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2)) : const Icon(Icons.link), label: Text(_busy ? 'Verifying account…' : 'Verify and continue')),
                          const SizedBox(height: 24),
                          Text('Create a classic GitHub token', style: Theme.of(context).textTheme.titleLarge),
                          const SizedBox(height: 8),
