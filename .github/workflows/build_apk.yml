            String _normaliseNewPath(String raw, {required bool folder, String kind = 'dart'}) {
              var path = raw.trim().replaceAll('\\', '/').replaceAll(RegExp(r'^/+|/+$'), '');
              if (path.isEmpty) return '';
              path = path.replaceAll(RegExp(r'/+'), '/');
              if (folder && !path.startsWith('lib/') && !path.startsWith('android/')) {
                return _currentFolder.isEmpty ? path : '$_currentFolder/$path';
              }
              if (path.startsWith('lib/') || path.startsWith('android/')) {
                // Explicit project-relative paths are honored.
              } else if (!folder && kind == 'proguard') {
                path = 'android/app/proguard-rules.pro';
              } else if (_currentFolder.isNotEmpty && (folder || (kind == 'dart' ? (_currentFolder == 'lib' || _currentFolder.startsWith('lib/')) : _currentFolder.startsWith('android/')))) {
                path = '$_currentFolder/$path';
              } else if (kind == 'dart') {
                path = 'lib/$path';
              } else if (kind == 'kotlin' || kind == 'java') {
                final languageRoot = kind == 'kotlin' ? 'kotlin' : 'java';
                final packagePath = _packageName.text.trim().replaceAll('.', '/');
                path = 'android/app/src/main/$languageRoot/$packagePath/$path';
              } else if (kind == 'proguard') {
                path = 'android/app/proguard-rules.pro';
              } else if (kind == 'xml') {
                if (path.split('/').last == 'AndroidManifest.xml') {
                  path = 'android/app/src/main/AndroidManifest.xml';
                } else {
                  path = 'android/app/src/main/res/values/$path';
                }
              } else {
                path = 'lib/$path';
              }
              if (folder) return path;
              if (kind == 'dart' && !path.toLowerCase().endsWith('.dart')) path = '$path.dart';
              if (kind == 'kotlin' && !path.toLowerCase().endsWith('.kt')) path = '$path.kt';
              if (kind == 'java' && !path.toLowerCase().endsWith('.java')) path = '$path.java';
              if (kind == 'xml' && !path.toLowerCase().endsWith('.xml')) path = '$path.xml';
              return path;
            }
          
            @override
