            Future<void> _editFile(String path) async {
              final initial = path == 'lib/main.dart' ? _dartCode : (_additionalFiles[path] ?? '');
              final edited = await Navigator.of(context).push<String>(MaterialPageRoute(
                builder: (_) => CodeEditorScreen(title: path.split('/').last, initialText: initial, kind: _languageKindForPath(path)),
              ));
              if (edited == null) return;
              setState(() {
                if (path == 'lib/main.dart') {
                  _dartCode = edited;
                  _mainFileExists = true;
                  _folders.addAll(_folderAncestors('lib/main.dart'));
                } else {
                  _additionalFiles[path] = edited;
                  _folders.addAll(_folderAncestors(path));
                }
                _selectedTemplate = 'Custom project';
              });
              _scheduleDraftSave();
            }
          
          
          
            void _removeManifestEntriesForNativeSources(Iterable<MapEntry<String, String>> removedSources) {
              const manifestPath = 'android/app/src/main/AndroidManifest.xml';
              final original = _additionalFiles[manifestPath];
              if (original == null || removedSources.isEmpty) return;
              var manifest = original;
              for (final entry in removedSources) {
                final path = entry.key;
                if (!path.endsWith('.kt') && !path.endsWith('.java')) continue;
                final className = path.split('/').last.replaceFirst(RegExp(r'\.(?:kt|java)$'), '');
                if (!RegExp(r'\b(?:class|object)\s+' + RegExp.escape(className) + r'\b').hasMatch(entry.value)) continue;
                final packageName = RegExp(r'(?m)^\s*package\s+([A-Za-z_][A-Za-z0-9_.]*)\s*;?\s*$')
                    .firstMatch(entry.value)?.group(1);
                if (packageName == null) continue;
                final names = '(?:${RegExp.escape('$packageName.$className')}|\\.${RegExp.escape(className)}|${RegExp.escape(className)})';
                // Remove generated/self-closing activity declarations for the deleted source.
                // Other application manifest content remains unchanged.
                final expression = "<activity\\b(?=[^>]*\\bandroid:name\\s*=\\s*[\"']$names[\"'])[^>]*/\\s*>";
                manifest = manifest.replaceAll(RegExp(expression, caseSensitive: false, dotAll: true), '');
              }
              if (manifest != original) _additionalFiles[manifestPath] = manifest;
            }
          
            Future<void> _renameFile(String oldPath) async {
              if (oldPath.endsWith('.kt') || oldPath.endsWith('.java')) {
                _message('Native Kotlin/Java files are not renamed automatically because their class name, package declaration and manifest may depend on the path. Create the new file, update those references, then delete the old file.');
                return;
              }
              if (oldPath == 'lib/main.dart') {
                _message('Keep the Flutter entry point named lib/main.dart. You can move other files from the three-dot menu.');
                return;
              }
              final controller = TextEditingController(text: oldPath.split('/').last);
              final input = await showDialog<String>(context: context, builder: (dialogContext) => AlertDialog(
                title: const Text('Rename or move file'),
                content: TextField(controller: controller, autofocus: true, autocorrect: false, decoration: const InputDecoration(labelText: 'New file name or path', hintText: 'home_screen.dart or lib/screens/home_screen.dart', helperText: 'Use a file name to stay in the current folder, or enter a project-relative path to move it.')),
                actions: [TextButton(onPressed: () => Navigator.pop(dialogContext), child: const Text('Cancel')), FilledButton(onPressed: () => Navigator.pop(dialogContext, controller.text.trim()), child: const Text('Save'))],
              ));
              controller.dispose();
              if (input == null || input.trim().isEmpty) return;
              var nextPath = input.replaceAll('\\', '/').replaceAll(RegExp(r'/+'), '/').replaceAll(RegExp(r'^/+|/+$'), '');
              if (!nextPath.contains('/')) {
                final slash = oldPath.lastIndexOf('/');
                nextPath = slash < 0 ? nextPath : '${oldPath.substring(0, slash)}/$nextPath';
              }
              if (!_isSafeProjectFilePath(nextPath) || nextPath == 'lib/main.dart') {
                _message('Invalid destination. Dart files must be under lib/, and Android files must use supported android/app paths.');
                return;
              }
              if (nextPath == oldPath) return;
              if (_allProjectFiles().containsKey(nextPath) || _folders.contains(nextPath)) {
                _message('A file or folder already exists at $nextPath. Nothing was changed.');
                return;
              }
              setState(() {
                final content = _additionalFiles.remove(oldPath);
                if (content != null) _additionalFiles[nextPath] = content;
                _folders.addAll(_folderAncestors(nextPath));
                // Keep empty folders explicitly created by the user.
                _currentFolder = nextPath.substring(0, nextPath.lastIndexOf('/'));
                _selectedTemplate = 'Custom project';
              });
              _scheduleDraftSave();
              _message('Moved file to $nextPath. Check package declarations if this is Kotlin/Java source.');
            }

            Future<void> _removeFile(String path) async {
              // lib/main.dart is the required Flutter entry point and cannot be removed.
              if (path == 'lib/main.dart') {
                _message('lib/main.dart is the required app entry point. You can edit it, but it cannot be deleted.');
                return;
              }
              if (!_additionalFiles.containsKey(path)) {
                _message('That file is no longer in the project. Refresh the file list and try again.');
                return;
              }
              final confirmed = await showDialog<bool>(
                context: context,
                builder: (dialogContext) => AlertDialog(
                  title: const Text('Delete file?'),
                  content: Text('Delete ${path.split('/').last}? This removes the file from the project and its next build.'),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(dialogContext, false), child: const Text('Cancel')),
                    FilledButton(onPressed: () => Navigator.pop(dialogContext, true), child: const Text('Delete file')),
                  ],
                ),
              );
              if (confirmed != true || !mounted) return;
              setState(() {
                final removedSource = _additionalFiles[path];
                if (removedSource != null) {
                  _removeManifestEntriesForNativeSources([MapEntry<String, String>(path, removedSource)]);
                }
                _additionalFiles.remove(path);
                _selectedTemplate = 'Custom project';
              });
              _scheduleDraftSave();
              _message('Deleted ${path.split('/').last}.');
            }
          
