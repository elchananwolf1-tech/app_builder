                if (response.statusCode == 404) {
                  throw Exception('GitHub API 404 for repository "${normalizeRepository(repository)}": $excerpt. Verify the exact owner/repository and confirm this token can access it. If this is the workflow template repository, verify it in Settings; if it is a project repository, confirm creation finished and the token has repo + workflow scopes. Spaces around / are normalized automatically.');
                }
                throw Exception('GitHub API ${response.statusCode}: $excerpt');
              }
              if (parsed is! Map<String, dynamic>) throw Exception('GitHub returned an unexpected response.');
