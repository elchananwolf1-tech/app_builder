          String _normaliseLauncherHex(String value) {
            var raw = value.trim().replaceAll('#', '').toUpperCase();
            if (RegExp(r'^[0-9A-F]{3}$').hasMatch(raw)) raw = raw.split('').map((c) => '$c$c').join();
            return RegExp(r'^[0-9A-F]{6}$').hasMatch(raw) ? '#$raw' : '#FFFFFF';
          }

          void _removeLauncherBackground(img.Image image, String hex, {int tolerance = 32}) {
            final clean = _normaliseLauncherHex(hex).substring(1);
            final tr = int.parse(clean.substring(0, 2), radix: 16);
            final tg = int.parse(clean.substring(2, 4), radix: 16);
            final tb = int.parse(clean.substring(4, 6), radix: 16);
            for (final pixel in image) {
              if (pixel.a <= 0) continue;
              final dr = pixel.r.toDouble() - tr, dg = pixel.g.toDouble() - tg, db = pixel.b.toDouble() - tb;
              final distance = math.sqrt(dr * dr + dg * dg + db * db);
              if (distance <= tolerance) {
                pixel.a = 0;
              } else if (distance <= tolerance + 42) {
                pixel.a = (pixel.a * ((distance - tolerance) / 42.0)).round().clamp(0, 255);
              }
            }
          }

          Uint8List _buildLauncherIconPreview(Map<String, Object?> args) {
            final sourceBytes = args['bytes'] as Uint8List;
            final decoded = img.decodeImage(sourceBytes);
            if (decoded == null || decoded.width < 1 || decoded.height < 1 || decoded.width * decoded.height > 40000000) {
              throw Exception('Unsupported or oversized image.');
            }
            final scale = 256.0 / math.max(decoded.width, decoded.height);
            final width = math.max(1, (decoded.width * scale).round()).toInt();
            final height = math.max(1, (decoded.height * scale).round()).toInt();
            final preview = scale < 1 ? img.copyResize(decoded, width: width, height: height) : decoded.clone();
            if (args['removeBackground'] == true) {
              _removeLauncherBackground(preview, (args['backgroundColor'] ?? '#FFFFFF').toString());
            }
            return Uint8List.fromList(img.encodePng(preview));
          }

          String _detectLauncherBackgroundColor(Uint8List bytes) {
            final decoded = img.decodeImage(bytes);
            if (decoded == null || decoded.width < 1 || decoded.height < 1 || decoded.width * decoded.height > 40000000) {
              throw Exception('The image is unsupported or too large to analyze.');
            }
            final buckets = <int, List<int>>{};
            void sample(int x, int y) {
              final pixel = decoded.getPixel(x, y);
              if (pixel.a < 200) return;
              final r = pixel.r.toInt().clamp(0, 255).toInt();
              final g = pixel.g.toInt().clamp(0, 255).toInt();
              final b = pixel.b.toInt().clamp(0, 255).toInt();
              final key = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
              final stats = buckets.putIfAbsent(key, () => [0, 0, 0, 0]);
              stats[0] += r; stats[1] += g; stats[2] += b; stats[3]++;
            }
            final sx = math.max(1, decoded.width ~/ 128).toInt();
            final sy = math.max(1, decoded.height ~/ 128).toInt();
            for (var x = 0; x < decoded.width; x += sx) { sample(x, 0); sample(x, decoded.height - 1); }
            for (var y = 0; y < decoded.height; y += sy) { sample(0, y); sample(decoded.width - 1, y); }
            if (buckets.isEmpty) throw Exception('No opaque background pixels were found along the image edges. The image may already have a transparent background.');
            final best = buckets.values.reduce((a, b) => a[3] >= b[3] ? a : b);
            final r = (best[0] / best[3]).round().clamp(0, 255).toInt();
            final g = (best[1] / best[3]).round().clamp(0, 255).toInt();
            final b = (best[2] / best[3]).round().clamp(0, 255).toInt();
            return '#${r.toRadixString(16).padLeft(2, '0')}${g.toRadixString(16).padLeft(2, '0')}${b.toRadixString(16).padLeft(2, '0')}'.toUpperCase();
          }

