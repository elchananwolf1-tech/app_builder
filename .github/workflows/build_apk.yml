          class SetupScreen extends StatefulWidget {
            const SetupScreen({super.key, required this.onSetup});
            final Future<void> Function(GitHubAccount account) onSetup;
          
            @override
            State<SetupScreen> createState() => _SetupScreenState();
          }
          
          class _SetupScreenState extends State<SetupScreen> {
            final _username = TextEditingController();
            final _token = TextEditingController();
            bool _busy = false;
            bool _obscure = true;
            String? _error;
          
            @override
            void dispose() {
              _username.dispose();
              _token.dispose();
              super.dispose();
            }
          
            Future<void> _connect() async {
              if (_username.text.trim().isEmpty || _token.text.trim().isEmpty) {
                setState(() => _error = 'Enter both your GitHub username and personal access token.');
                return;
              }
              setState(() { _busy = true; _error = null; });
              final username = _username.text.trim();
              final token = _token.text.trim();
              final error = await verifyAccount(username, token);
              if (error != null) {
                if (mounted) setState(() { _busy = false; _error = error; });
                return;
              }
              await widget.onSetup(GitHubAccount(username: username, token: token));
              if (mounted) setState(() => _busy = false);
            }
          
            @override
            Widget build(BuildContext context) => Scaffold(
                  appBar: AppBar(title: const Text('Set up GitHub')),
                  body: Center(
                    child: ConstrainedBox(
                      constraints: const BoxConstraints(maxWidth: 680),
                      child: ListView(
                        padding: const EdgeInsets.all(20),
                        children: [
                          const Icon(Icons.rocket_launch_rounded, size: 58),
                          const SizedBox(height: 12),
                          Text('Connect your GitHub account', style: Theme.of(context).textTheme.headlineSmall),
                          const SizedBox(height: 8),
                          const Text('Your account is used to trigger the workflow in the repository this builder was compiled for. Tokens are stored using Android secure storage and are not written to build logs.'),
                          const SizedBox(height: 20),
                          TextField(controller: _username, textInputAction: TextInputAction.next, autocorrect: false, decoration: const InputDecoration(labelText: 'GitHub username', prefixIcon: Icon(Icons.person_outline))),
                          const SizedBox(height: 12),
                          TextField(controller: _token, obscureText: _obscure, autocorrect: false, enableSuggestions: false, decoration: InputDecoration(labelText: 'Personal access token (classic)', prefixIcon: const Icon(Icons.key_outlined), suffixIcon: IconButton(onPressed: () => setState(() => _obscure = !_obscure), icon: Icon(_obscure ? Icons.visibility : Icons.visibility_off)))),
                          if (_error != null) ...[
                            const SizedBox(height: 12),
                            Text(_error!, style: TextStyle(color: Theme.of(context).colorScheme.error)),
                          ],
                          const SizedBox(height: 14),
                          FilledButton.icon(onPressed: _busy ? null : _connect, icon: _busy ? const SizedBox(width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2)) : const Icon(Icons.link), label: Text(_busy ? 'Verifying account…' : 'Verify and continue')),
                          const SizedBox(height: 24),
                          Text('Create a classic GitHub token', style: Theme.of(context).textTheme.titleLarge),
                          const SizedBox(height: 8),
                          const SelectableText('1. Sign in to GitHub and open Settings.\n2. Go to Developer settings → Personal access tokens → Tokens (classic).\n3. Select Generate new token (classic), give it a clear name and expiry.\n4. Explicitly check BOTH scopes: repo and workflow. repo allows the app to create a private repository and upload project files; workflow allows it to install/update the build workflow.\n5. Generate the token and copy it immediately. GitHub only shows the full value once.\n6. Return here and paste the token. On first connection, Simple App Builder searches your account for a private repository whose name starts with backup_456; it reuses that repository if found, otherwise it creates one. Never commit the token to a repository or share it in Dart code. Organization policies may restrict repository creation.'),
                          const SizedBox(height: 10),
                          OutlinedButton.icon(onPressed: () => launchUrl(Uri.parse('https://github.com/settings/tokens/new?scopes=repo,workflow&description=Simple%20App%20Builder'), mode: LaunchMode.externalApplication), icon: const Icon(Icons.open_in_new), label: const Text('Open classic token creation page')),
                          const SizedBox(height: 8),
                          const Text('This connected repository is the workflow template source. For each app, the Builder creates a new private repository under the account represented by the working token, installs build_apk.yml there, and builds the app in isolation. Use a classic personal access token with BOTH repo and workflow scopes. GitHub Actions and repository creation must be allowed by the account or organization policy.'),
                        ],
                      ),
                    ),
                  ),
                );
