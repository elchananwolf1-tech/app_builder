              required this.autoFailover,
              required this.repository,
              required this.apiFactory,
              required this.onAccountsChanged,
              required this.onFailoverChanged,
              required this.onRepositoryChanged,
            });

            final List<GitHubAccount> accounts;
            final bool autoFailover;
            final String repository;
            final GitHubApi Function() apiFactory;
            final Future<void> Function(List<GitHubAccount>) onAccountsChanged;
            final Future<void> Function(bool) onFailoverChanged;
            final Future<void> Function(String) onRepositoryChanged;

            @override
            State<SettingsScreen> createState() => _SettingsScreenState();
          }

          class _SettingsScreenState extends State<SettingsScreen> {
            late List<GitHubAccount> _accounts;
            late bool _failover;
            late final TextEditingController _repoController;
            bool _busy = false;

            @override
            void initState() {
              super.initState();
              _accounts = List<GitHubAccount>.from(widget.accounts);
              _failover = widget.autoFailover;
              _repoController = TextEditingController(text: widget.repository);
            }

            @override
            void dispose() { _repoController.dispose(); super.dispose(); }

            Future<void> _saveAccounts() async {
              await widget.onAccountsChanged(_accounts);
              if (mounted) setState(() {});
            }

            Future<void> _editAccount({GitHubAccount? existing}) async {
              final username = TextEditingController(text: existing?.username ?? '');
              final token = TextEditingController();
              final result = await showDialog<Map<String, String>>(context: context, builder: (context) => AlertDialog(
                title: Text(existing == null ? 'Add GitHub account' : 'Edit ${existing.username}'),
                content: SizedBox(width: 440, child: Column(mainAxisSize: MainAxisSize.min, children: [
                  TextField(controller: username, autocorrect: false, decoration: const InputDecoration(labelText: 'GitHub username')),
                  const SizedBox(height: 12),
                  TextField(controller: token, obscureText: true, autocorrect: false, enableSuggestions: false, decoration: InputDecoration(labelText: 'Personal access token', hintText: existing == null ? 'Required' : 'Leave blank to keep current token')),
                ])),
                actions: [TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')), FilledButton(onPressed: () => Navigator.pop(context, {'username': username.text.trim(), 'token': token.text.trim()}), child: const Text('Verify and save'))],
              ));
              username.dispose(); token.dispose();
              if (result == null) return;
              final newName = result['username'] ?? '';
              final newToken = (result['token'] ?? '').isNotEmpty ? result['token']! : (existing?.token ?? '');
              if (newName.isEmpty || newToken.isEmpty) { _snack('Username and token are required.'); return; }
              setState(() => _busy = true);
              final error = await verifyAccount(newName, newToken);
              if (!mounted) return;
              if (error != null) { setState(() => _busy = false); _snack(error); return; }
              final replacement = GitHubAccount(username: newName, token: newToken);
              final index = existing == null ? -1 : _accounts.indexWhere((a) => a.username.toLowerCase() == existing.username.toLowerCase());
              final duplicate = _accounts.asMap().entries.any((entry) => entry.key != index && entry.value.username.toLowerCase() == newName.toLowerCase());
              if (duplicate) { setState(() => _busy = false); _snack('That username is already configured.'); return; }
              if (index >= 0) {
                _accounts[index] = replacement;
              } else {
                _accounts.add(replacement);
              }
              await _saveAccounts();
              if (mounted) setState(() => _busy = false);
              _snack('GitHub account verified and saved securely.');
            }

            Future<void> _makePrimary(GitHubAccount account) async {
              setState(() {
                _accounts = [account, ..._accounts.where((a) => a.username.toLowerCase() != account.username.toLowerCase())];
              });
              await _saveAccounts();
              _snack('${account.username} is now the primary account.');
            }

            Future<void> _remove(GitHubAccount account) async {
              if (_accounts.length == 1) { _snack('Keep at least one GitHub account connected.'); return; }
              final yes = await showDialog<bool>(context: context, builder: (context) => AlertDialog(
                title: const Text('Remove account?'),
                content: Text('Remove ${account.username} and its locally stored token from this device?'),
                actions: [TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('Cancel')), FilledButton(onPressed: () => Navigator.pop(context, true), child: const Text('Remove'))],
              ));
              if (yes == true) {
                _accounts.removeWhere((a) => a.username.toLowerCase() == account.username.toLowerCase());
                await _saveAccounts();
              }
            }

            Future<void> _editWorkflow() async {
              if (_busy) return;
              setState(() => _busy = true);
              try {
                final api = widget.apiFactory();
                final branch = await api.defaultBranch();
                final current = await api.readWorkflow(branch);
                if (!mounted) return;
                final edited = await Navigator.of(context).push<String>(MaterialPageRoute(builder: (_) => CodeEditorScreen(title: 'Edit build_apk.yml', initialText: current, kind: 'yaml')));
                if (edited != null && edited != current) {
                  await api.saveWorkflow(branch, edited);
                  _snack('Workflow saved to the repository.');
                }
              } catch (error) {
                _snack('Could not load/save workflow: $error');
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }

            void _snack(String message) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message)));
            }

            @override
            Widget build(BuildContext context) => Scaffold(
                  appBar: AppBar(title: const Text('Settings')),
                  body: ListView(padding: const EdgeInsets.all(16), children: [
                    Text('GitHub repository', style: Theme.of(context).textTheme.titleLarge),
                    const SizedBox(height: 8),
                    TextField(controller: _repoController, autocorrect: false, decoration: const InputDecoration(labelText: 'owner/repository', helperText: 'Usually set automatically when this APK is built by the workflow.')),
                    const SizedBox(height: 8),
                    Align(alignment: Alignment.centerLeft, child: FilledButton.tonal(onPressed: _busy ? null : () async {
                      final value = _repoController.text.trim();
                      if (!RegExp(r'^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$').hasMatch(value)) { _snack('Enter repository as owner/repository.'); return; }
                      await widget.onRepositoryChanged(value);
                      _snack('Repository saved.');
                    }, child: const Text('Save repository'))),
                    const Divider(height: 32),
                    Text('Accounts and security', style: Theme.of(context).textTheme.titleLarge),
                    SwitchListTile(contentPadding: EdgeInsets.zero, title: const Text('Auto failover / rate-limit switching'), subtitle: const Text('Retry authentication, rate-limit, and access failures using another saved account.'), value: _failover, onChanged: (value) async { setState(() => _failover = value); await widget.onFailoverChanged(value); }),
                    ..._accounts.asMap().entries.map((entry) {
                      final index = entry.key; final account = entry.value;
                      return Card(child: ListTile(
                        leading: Icon(index == 0 ? Icons.verified_user : Icons.person_outline),
                        title: Text(account.username),
                        subtitle: Text(index == 0 ? 'Primary account · token stored securely' : 'Secondary account · token stored securely'),
                        onTap: () => _makePrimary(account),
                        trailing: PopupMenuButton<String>(onSelected: (value) { if (value == 'primary') _makePrimary(account); if (value == 'edit') _editAccount(existing: account); if (value == 'remove') _remove(account); }, itemBuilder: (_) => const [
                          PopupMenuItem(value: 'primary', child: Text('Set as primary')),
                          PopupMenuItem(value: 'edit', child: Text('Edit account / token')),
                          PopupMenuItem(value: 'remove', child: Text('Remove account')),
                        ]),
                      ));
                    }),
                    OutlinedButton.icon(onPressed: _busy ? null : () => _editAccount(), icon: const Icon(Icons.person_add_alt_1), label: const Text('Add another account')),
                    const Divider(height: 32),
                    Text('Build pipeline', style: Theme.of(context).textTheme.titleLarge),
                    const SizedBox(height: 8),
                    const Text('The workflow editor opens the live file in your GitHub repository. Saving commits the YAML change to the default branch. The PAT needs repo and workflow scopes.'),
                    const SizedBox(height: 10),
                    FilledButton.tonalIcon(onPressed: _busy ? null : _editWorkflow, icon: const Icon(Icons.edit_note), label: Text(_busy ? 'Working…' : 'Edit .github/workflows/build_apk.yml')),
                    const SizedBox(height: 18),
                    const SelectableText('Security notes\n• Personal access tokens are stored using flutter_secure_storage; they are not stored in SharedPreferences.\n• Use an expiry date and revoke tokens you no longer need.\n• The APK source sent to GitHub is compiled by GitHub Actions. Never paste tokens or other secrets into Dart source code.'),
                  ]),
                );
          }

          class ProjectWizard extends StatefulWidget {
            const ProjectWizard({
              super.key,
              required this.repository,
              required this.apiFactory,
              required this.onSaveProject,
              this.existing,
            });

            final String repository;
            final GitHubApi Function() apiFactory;
            final Future<void> Function(AppProject project) onSaveProject;
            final AppProject? existing;

            @override
            State<ProjectWizard> createState() => _ProjectWizardState();
          }

          class _ProjectWizardState extends State<ProjectWizard> {
            late final TextEditingController _name;
            late final TextEditingController _packageName;
            late final String _projectId;
            late String _dartCode;
            Uint8List? _iconBytes;
            int _step = 0;
            bool _building = false;
            String _status = '';
            bool _saved = false;

            @override
            void initState() {
              super.initState();
              _projectId = widget.existing?.id ?? DateTime.now().microsecondsSinceEpoch.toString();
              _name = TextEditingController(text: widget.existing?.name ?? 'My Flutter App');
              _packageName = TextEditingController(text: widget.existing?.packageName ?? 'com.example.myapp');
              _dartCode = widget.existing?.dartCode ?? '';
              if (widget.existing?.iconBase64 != null) {
                try { _iconBytes = base64Decode(widget.existing!.iconBase64!); } catch (_) {}
              }
              if (widget.existing != null) _step = 0;
            }



            @override
            void dispose() { _name.dispose(); _packageName.dispose(); super.dispose(); }

            AppProject _project() => AppProject(
              id: _projectId,
              name: _name.text.trim(),
              packageName: _packageName.text.trim(),
              dartCode: _dartCode,
              iconBase64: _iconBytes == null ? null : base64Encode(_iconBytes!),
            );

            bool _validDetails() {
              if (_name.text.trim().isEmpty || _name.text.trim().length > 60) { _message('Project name must be 1–60 characters.'); return false; }
              if (!RegExp(r'^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}$').hasMatch(_packageName.text.trim())) {
                _message('Package name must be lowercase reverse-DNS format, e.g. com.example.myapp.'); return false;
              }
              return true;
            }

            void _message(String message) { if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message))); }

            Future<void> _pickIcon() async {
              final picked = await FilePicker.platform.pickFiles(type: FileType.image, allowMultiple: false, withData: true);
              if (picked == null || picked.files.isEmpty) return;
              final file = picked.files.single;
              if (file.bytes == null) { _message('Could not read this image file. Try a PNG image.'); return; }
              if (file.bytes!.length > 8 * 1024 * 1024) { _message('Choose an image smaller than 8 MB.'); return; }
              setState(() => _iconBytes = file.bytes);
            }

            Future<void> _pickDartFile() async {
              final picked = await FilePicker.platform.pickFiles(type: FileType.custom, allowedExtensions: const ['dart'], allowMultiple: false, withData: true);
              if (picked == null || picked.files.isEmpty) return;
              final bytes = picked.files.single.bytes;
              if (bytes == null) { _message('Could not read that file.'); return; }
              setState(() => _dartCode = utf8.decode(bytes, allowMalformed: true));
            }

            Future<void> _editCode() async {
              final edited = await Navigator.of(context).push<String>(MaterialPageRoute(builder: (_) => CodeEditorScreen(title: 'Edit main.dart', initialText: _dartCode, kind: 'dart')));
              if (edited != null) setState(() => _dartCode = edited);
            }

            Future<void> _continue() async {
              if (_building) return;
              if (_step == 0 && !_validDetails()) return;
              if (_step == 2) {
                if (_dartCode.trim().isEmpty) { _message('Choose a Dart file or enter Dart source code.'); return; }
                if (utf8.encode(_dartCode).length > 50000) { _message('Dart source is too large for a workflow_dispatch input (maximum 50 KB).'); return; }
              }
              if (_step < 3) {
                setState(() => _step++);
                return;
              }
              await _buildAndDownload();
            }

            Future<void> _buildAndDownload() async {
              if (!_validDetails()) return;
              if (widget.repository.isEmpty) { _message('Repository is not configured. Open Settings.'); return; }
              if (!RegExp(r'^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$').hasMatch(widget.repository)) { _message('Repository should be owner/repository.'); return; }
              if (_dartCode.trim().isEmpty || utf8.encode(_dartCode).length > 50000) { _message('Enter valid Dart source smaller than 50 KB.'); return; }
              setState(() { _building = true; _status = 'Saving project…'; });
              try {
                await widget.onSaveProject(_project());
                _saved = true;
                final api = widget.apiFactory();
                _setStatus('Checking repository and default branch…');
                final branch = await api.defaultBranch();
                final payloadSize = utf8.encode(jsonEncode({
                  'ref': branch,
                  'inputs': {'project_name': _name.text.trim(), 'package_name': _packageName.text.trim(), 'dart_code': _dartCode},
                })).length;
                if (payloadSize > 60000) throw Exception('The workflow input payload is too large after JSON encoding. Shorten the Dart source and retry.');
                if (_iconBytes != null) {
                  _setStatus('Uploading icon.png to the repository…');
                  await api.uploadRootIcon(branch, _iconBytes!);
                }
                final previousRunNumber = await api.latestWorkflowRunNumber();
                _setStatus('Triggering GitHub Actions…');
                await api.dispatchBuild(branch: branch, projectName: _name.text.trim(), packageName: _packageName.text.trim(), dartCode: _dartCode);
                final run = await api.waitForBuild(previousRunNumber, _setStatus);
                _setStatus('Build passed. Downloading APK artifact…');
                final zip = await api.downloadGeneratedApk((run['id'] ?? '').toString());
                final archive = ZipDecoder().decodeBytes(zip);
                ArchiveFile? apk;
                for (final file in archive.files) {
                  if (file.isFile && file.name.toLowerCase().endsWith('.apk')) { apk = file; break; }
                }
                if (apk == null) throw Exception('The artifact ZIP did not contain an APK file.');
                final apkBytes = Uint8List.fromList(apk.content as List<int>);
                final safeName = _name.text.trim().replaceAll(RegExp(r'[^A-Za-z0-9_-]+'), '-').replaceAll(RegExp(r'-+'), '-').replaceAll(RegExp(r'^-|-$'), '');
                final output = await FilePicker.platform.saveFile(
                  dialogTitle: 'Save your release APK',
                  fileName: '${safeName.isEmpty ? 'generated_app' : safeName}.apk',
                  type: FileType.custom,
                  allowedExtensions: const ['apk'],
                  bytes: apkBytes,
                );
                if (!mounted) return;
                if (output == null) {
                  setState(() => _status = 'Build succeeded. APK download was canceled in the save dialog.');
                } else {
                  setState(() => _status = 'Build succeeded. APK saved to:\n$output');
                }
                _message(output == null ? 'Build succeeded; save dialog was canceled.' : 'Release APK downloaded successfully.');
              } catch (error) {
                if (mounted) setState(() => _status = 'Build failed:\n$error');
                _message('Build failed. See the status below for details.');
              } finally {
                if (mounted) setState(() => _building = false);
              }
            }

            void _setStatus(String message) { if (mounted) setState(() => _status = message); }

            @override
            Widget build(BuildContext context) => Scaffold(
                  appBar: AppBar(title: Text(widget.existing == null ? 'Create project' : 'Build ${widget.existing!.name}')),
                  body: Stepper(
                    type: StepperType.vertical,
                    currentStep: _step,
                    onStepTapped: _building ? null : (step) => setState(() => _step = step),
                    onStepContinue: _continue,
                    onStepCancel: _building ? null : () { if (_step > 0) setState(() => _step--); else Navigator.pop(context); },
                    controlsBuilder: (context, details) => Padding(
                      padding: const EdgeInsets.only(top: 16),
                      child: Row(children: [
                        FilledButton(onPressed: _building ? null : details.onStepContinue, child: Text(_step == 3 ? (_building ? 'Building…' : 'Build and download APK') : 'Continue')),
                        const SizedBox(width: 10),
                        if (!_building) TextButton(onPressed: details.onStepCancel, child: Text(_step == 0 ? 'Cancel' : 'Back')),
                      ]),
                    ),
                    steps: [
                      Step(title: const Text('Project details'), subtitle: const Text('Name and Android package ID'), isActive: _step >= 0, state: _step > 0 ? StepState.complete : StepState.indexed, content: Column(children: [
                        TextField(controller: _name, maxLength: 60, decoration: const InputDecoration(labelText: 'Project name', hintText: 'My Company App')),
                        const SizedBox(height: 12),
                        TextField(controller: _packageName, autocorrect: false, decoration: const InputDecoration(labelText: 'Package name', hintText: 'com.company.myapp', helperText: 'Use lowercase reverse-DNS format with at least three segments.')),
                      ])),
                      Step(title: const Text('App logo'), subtitle: const Text('Optional icon.png'), isActive: _step >= 1, state: _step > 1 ? StepState.complete : StepState.indexed, content: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                        const Text('Select a square PNG or other supported image. It will be uploaded as the repository root icon.png and generated into Android launcher icon sizes.'),
                        const SizedBox(height: 14),
                        if (_iconBytes != null) Center(child: ClipRRect(borderRadius: BorderRadius.circular(18), child: Image.memory(_iconBytes!, width: 112, height: 112, fit: BoxFit.cover))) else const Center(child: Icon(Icons.image_outlined, size: 80)),
                        const SizedBox(height: 10),
                        Row(children: [Expanded(child: OutlinedButton.icon(onPressed: _pickIcon, icon: const Icon(Icons.upload_file), label: const Text('Choose image'))), if (_iconBytes != null) IconButton(tooltip: 'Remove selected logo', onPressed: () => setState(() => _iconBytes = null), icon: const Icon(Icons.delete_outline))]),
                      ])),
                      Step(title: const Text('Dart source'), subtitle: const Text('Import a .dart file or edit code'), isActive: _step >= 2, state: _step > 2 ? StepState.complete : StepState.indexed, content: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                        Text('${_dartCode.split('\n').length} lines · ${utf8.encode(_dartCode).length} bytes'),
                        const SizedBox(height: 10),
                        OutlinedButton.icon(onPressed: _pickDartFile, icon: const Icon(Icons.file_open), label: const Text('Choose .dart file (renamed to main.dart)')),
                        const SizedBox(height: 8),
                        FilledButton.tonalIcon(onPressed: _editCode, icon: const Icon(Icons.code), label: const Text('Open syntax-highlighting editor')),
                        const SizedBox(height: 10),
                        Container(width: double.infinity, constraints: const BoxConstraints(maxHeight: 180), padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: Theme.of(context).colorScheme.surfaceContainerHighest, borderRadius: BorderRadius.circular(12)), child: SingleChildScrollView(child: SelectableText(_dartCode, maxLines: 14, style: const TextStyle(fontFamily: 'monospace', fontSize: 12)))),
                      ])),
                      Step(title: const Text('Build and download'), subtitle: const Text('GitHub Actions release build'), isActive: _step >= 3, state: _status.startsWith('Build succeeded') ? StepState.complete : StepState.indexed, content: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                        Text('Target repository: ${widget.repository.isEmpty ? '(not configured)' : widget.repository}'),
                        const SizedBox(height: 8),
                        const Text('The workflow creates a fresh Flutter project, installs dependencies referenced by package: imports, applies the launcher icon, and runs flutter build apk --release. The builder APK is uploaded as a separate artifact too.'),
                        if (_status.isNotEmpty) ...[
                          const SizedBox(height: 16),
                          if (_building) const LinearProgressIndicator(),
                          const SizedBox(height: 8),
                          SelectableText(_status),
                        ],
                      ])),
                    ],
                  ),
                );
          }

          class CodeEditorScreen extends StatefulWidget {
            const CodeEditorScreen({super.key, required this.title, required this.initialText, required this.kind});
            final String title;
            final String initialText;
            final String kind;

            @override
            State<CodeEditorScreen> createState() => _CodeEditorScreenState();
          }

          class _CodeEditorScreenState extends State<CodeEditorScreen> {
            late final CodeController _controller;

            @override
            void initState() {
              super.initState();
              _controller = CodeController(
                text: widget.initialText,
                language: widget.kind == 'yaml' ? yaml_language.yaml : dart_language.dart,
              );
            }

            @override
            void dispose() { _controller.dispose(); super.dispose(); }

            @override
            Widget build(BuildContext context) {
              final dark = Theme.of(context).brightness == Brightness.dark;
              return Scaffold(
                appBar: AppBar(title: Text(widget.title), actions: [IconButton(tooltip: 'Save changes', onPressed: () => Navigator.pop(context, _controller.text), icon: const Icon(Icons.check))]),
                body: CodeTheme(
                  data: CodeThemeData(styles: dark ? monokaiSublimeTheme : githubTheme),
                  child: CodeField(
                    controller: _controller,
                    expands: true,
                    wrap: false,
                    padding: const EdgeInsets.all(16),
                    textStyle: const TextStyle(fontFamily: 'monospace', fontSize: 13, height: 1.45),
                    gutterStyle: GutterStyle(showLineNumbers: true, showErrors: false, showFoldingHandles: true, width: 54, margin: 12),
                  ),
                ),
              );
            }
          }
          DART
          flutter pub get
          flutter build apk --release --dart-define=BUILDER_REPOSITORY="$GITHUB_REPOSITORY"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/simple-app-builder.apk"

      # Upload the builder first so it remains available even when a user's app has a
      # Dart compile error later in the same run.
      - name: Upload Simple App Builder APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-app-builder-${{ github.run_number }}
          path: dist/simple-app-builder.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create the requested Flutter project and install source dependencies
        shell: bash
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          DART_CODE: ${{ inputs.dart_code }}
        run: |
          set -euo pipefail
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          ORG="${PACKAGE_NAME%.*}"
          APP_SLUG="${PACKAGE_NAME##*.}"
          flutter create --org "$ORG" --project-name "$APP_SLUG" "$TARGET_DIR"
          printf '%s' "$DART_CODE" > "$TARGET_DIR/lib/main.dart"
          python3 "$RUNNER_TEMP/patch_android_project.py" "$TARGET_DIR" "$PROJECT_NAME" "$PACKAGE_NAME"

          # The workflow input contains main.dart rather than a second pubspec. Detect
          # package: imports and add the corresponding pub.dev dependencies automatically.
          python3 - "$TARGET_DIR/lib/main.dart" > "$RUNNER_TEMP/target_dependencies.txt" <<'PY'
          import re, sys
          source = open(sys.argv[1], encoding='utf-8').read()
          packages = sorted(set(re.findall(r"package:([A-Za-z][A-Za-z0-9_]*)/", source)))
          ignored = {'flutter', 'flutter_test', 'integration_test'}
          for package in packages:
              if package not in ignored and re.fullmatch(r'[a-z][a-z0-9_]*', package):
                  print(package)
          PY
          mapfile -t EXTRA_DEPENDENCIES < "$RUNNER_TEMP/target_dependencies.txt"
          cd "$TARGET_DIR"
          if ((${#EXTRA_DEPENDENCIES[@]})); then
            echo "Installing detected Dart package dependencies: ${EXTRA_DEPENDENCIES[*]}"
            flutter pub add "${EXTRA_DEPENDENCIES[@]}"
          fi
          flutter pub get

      - name: Apply root icon.png as Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          if [[ -f "$GITHUB_WORKSPACE/icon.png" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
            identify "$GITHUB_WORKSPACE/icon.png" >/dev/null
            RES="$TARGET_DIR/android/app/src/main/res"
            while IFS=: read -r density size; do
              mkdir -p "$RES/mipmap-$density"
              # Standard bitmap launcher icons for each density.
              convert "$GITHUB_WORKSPACE/icon.png" -auto-orient -strip -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "$RES/mipmap-$density/ic_launcher.png"
              cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
              # Android adaptive icons reference this foreground resource on API 26+.
              foreground_size=$((size * 68 / 100))
              convert "$GITHUB_WORKSPACE/icon.png" -auto-orient -strip -resize "${foreground_size}x${foreground_size}" -gravity center -background none -extent "${size}x${size}" "$RES/mipmap-$density/ic_launcher_foreground.png"
            done <<'SIZES'
          mdpi:48
          hdpi:72
          xhdpi:96
          xxhdpi:144
          xxxhdpi:192
          SIZES
            echo 'Applied repository icon.png to Android launcher icon resources.'
          else
            echo 'No root icon.png found; keeping Flutter default launcher icons.'
          fi

      - name: Build generated release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/generated_flutter_app"
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/${{ steps.metadata.outputs.slug }}-release.apk"

      - name: Upload generated release APK
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk-${{ steps.metadata.outputs.slug }}
          path: dist/${{ steps.metadata.outputs.slug }}-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
