          class SettingsScreen extends StatefulWidget {
            const SettingsScreen({
              super.key,
              required this.accounts,
              required this.autoFailover,
              required this.repository,
              required this.apiFactory,
              required this.onAccountsChanged,
              required this.onFailoverChanged,
              required this.onRepositoryChanged,
            });

            final List<GitHubAccount> accounts;
            final bool autoFailover;
            final String repository;
            final GitHubApi Function() apiFactory;
            final Future<void> Function(List<GitHubAccount>) onAccountsChanged;
            final Future<void> Function(bool) onFailoverChanged;
            final Future<void> Function(String) onRepositoryChanged;

            @override
            State<SettingsScreen> createState() => _SettingsScreenState();
          }

          class _SettingsScreenState extends State<SettingsScreen> {
            late List<GitHubAccount> _accounts;
            late bool _failover;
            late final TextEditingController _repoController;
            bool _busy = false;

            @override
            void initState() {
              super.initState();
              _accounts = List<GitHubAccount>.from(widget.accounts);
              _failover = widget.autoFailover;
              _repoController = TextEditingController(text: widget.repository);
            }

            @override
            void dispose() { _repoController.dispose(); super.dispose(); }

            Future<void> _saveAccounts() async {
              await widget.onAccountsChanged(_accounts);
              if (mounted) setState(() {});
            }

            Future<void> _editAccount({GitHubAccount? existing}) async {
              final username = TextEditingController(text: existing?.username ?? '');
              final token = TextEditingController();
              final result = await showDialog<Map<String, String>>(context: context, builder: (context) => AlertDialog(
                title: Text(existing == null ? 'Add GitHub account' : 'Edit ${existing.username}'),
                content: SizedBox(width: 440, child: Column(mainAxisSize: MainAxisSize.min, children: [
                  TextField(controller: username, autocorrect: false, decoration: const InputDecoration(labelText: 'GitHub username')),
                  const SizedBox(height: 12),
                  TextField(controller: token, obscureText: true, autocorrect: false, enableSuggestions: false, decoration: InputDecoration(labelText: 'Personal access token', hintText: existing == null ? 'Required' : 'Leave blank to keep current token')),
                ])),
                actions: [TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')), FilledButton(onPressed: () => Navigator.pop(context, {'username': username.text.trim(), 'token': token.text.trim()}), child: const Text('Verify and save'))],
              ));
              username.dispose(); token.dispose();
              if (result == null) return;
              final newName = result['username'] ?? '';
              final newToken = (result['token'] ?? '').isNotEmpty ? result['token']! : (existing?.token ?? '');
              if (newName.isEmpty || newToken.isEmpty) { _snack('Username and token are required.'); return; }
              setState(() => _busy = true);
              final error = await verifyAccount(newName, newToken);
              if (!mounted) return;
              if (error != null) { setState(() => _busy = false); _snack(error); return; }
              final replacement = GitHubAccount(username: newName, token: newToken);
              final index = existing == null ? -1 : _accounts.indexWhere((a) => a.username.toLowerCase() == existing.username.toLowerCase());
              final duplicate = _accounts.asMap().entries.any((entry) => entry.key != index && entry.value.username.toLowerCase() == newName.toLowerCase());
              if (duplicate) { setState(() => _busy = false); _snack('That username is already configured.'); return; }
              if (index >= 0) {
                _accounts[index] = replacement;
              } else {
                _accounts.add(replacement);
              }
              await _saveAccounts();
              if (mounted) setState(() => _busy = false);
              _snack('GitHub account verified and saved securely.');
            }

            Future<void> _makePrimary(GitHubAccount account) async {
              setState(() {
                _accounts = [account, ..._accounts.where((a) => a.username.toLowerCase() != account.username.toLowerCase())];
              });
              await _saveAccounts();
              _snack('${account.username} is now the primary account.');
            }

            Future<void> _remove(GitHubAccount account) async {
              if (_accounts.length == 1) { _snack('Keep at least one GitHub account connected.'); return; }
              final yes = await showDialog<bool>(context: context, builder: (context) => AlertDialog(
                title: const Text('Remove account?'),
                content: Text('Remove ${account.username} and its locally stored token from this device?'),
                actions: [TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('Cancel')), FilledButton(onPressed: () => Navigator.pop(context, true), child: const Text('Remove'))],
              ));
              if (yes == true) {
                _accounts.removeWhere((a) => a.username.toLowerCase() == account.username.toLowerCase());
                await _saveAccounts();
              }
            }

            Future<void> _editWorkflow() async {
              if (_busy) return;
              setState(() => _busy = true);
              try {
                final api = widget.apiFactory();
                final branch = await api.defaultBranch();
                final current = await api.readWorkflow(branch);
                if (!mounted) return;
                final edited = await Navigator.of(context).push<String>(MaterialPageRoute(builder: (_) => CodeEditorScreen(title: 'Edit build_apk.yml', initialText: current, kind: 'yaml')));
                if (edited != null && edited != current) {
                  await api.saveWorkflow(branch, edited);
                  _snack('Workflow saved to the repository.');
                }
              } catch (error) {
                _snack('Could not load/save workflow: $error');
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }

            void _snack(String message) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message)));
            }

            @override
            Widget build(BuildContext context) => Scaffold(
                  appBar: AppBar(title: const Text('Settings')),
                  body: ListView(padding: const EdgeInsets.all(16), children: [
                    Text('GitHub repository', style: Theme.of(context).textTheme.titleLarge),
                    const SizedBox(height: 8),
                    TextField(controller: _repoController, autocorrect: false, decoration: const InputDecoration(labelText: 'owner/repository', helperText: 'Usually set automatically when this APK is built by the workflow.')),
                    const SizedBox(height: 8),
                    Align(alignment: Alignment.centerLeft, child: FilledButton.tonal(onPressed: _busy ? null : () async {
                      final value = _repoController.text.trim();
                      if (!RegExp(r'^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$').hasMatch(value)) { _snack('Enter repository as owner/repository.'); return; }
                      await widget.onRepositoryChanged(value);
                      _snack('Repository saved.');
                    }, child: const Text('Save repository'))),
                    const Divider(height: 32),
                    Text('Accounts and security', style: Theme.of(context).textTheme.titleLarge),
                    SwitchListTile(contentPadding: EdgeInsets.zero, title: const Text('Auto failover / rate-limit switching'), subtitle: const Text('Retry authentication, rate-limit, and access failures using another saved account.'), value: _failover, onChanged: (value) async { setState(() => _failover = value); await widget.onFailoverChanged(value); }),
                    ..._accounts.asMap().entries.map((entry) {
                      final index = entry.key; final account = entry.value;
                      return Card(child: ListTile(
                        leading: Icon(index == 0 ? Icons.verified_user : Icons.person_outline),
                        title: Text(account.username),
                        subtitle: Text(index == 0 ? 'Primary account · token stored securely' : 'Secondary account · token stored securely'),
                        onTap: () => _makePrimary(account),
                        trailing: PopupMenuButton<String>(onSelected: (value) { if (value == 'primary') _makePrimary(account); if (value == 'edit') _editAccount(existing: account); if (value == 'remove') _remove(account); }, itemBuilder: (_) => const [
                          PopupMenuItem(value: 'primary', child: Text('Set as primary')),
                          PopupMenuItem(value: 'edit', child: Text('Edit account / token')),
                          PopupMenuItem(value: 'remove', child: Text('Remove account')),
                        ]),
                      ));
                    }),
                    OutlinedButton.icon(onPressed: _busy ? null : () => _editAccount(), icon: const Icon(Icons.person_add_alt_1), label: const Text('Add another account')),
                    const Divider(height: 32),
                    Text('Build pipeline', style: Theme.of(context).textTheme.titleLarge),
                    const SizedBox(height: 8),
                    const Text('The workflow editor opens the live file in your GitHub repository. Saving commits the YAML change to the default branch. The PAT needs repo and workflow scopes.'),
                    const SizedBox(height: 10),
                    FilledButton.tonalIcon(onPressed: _busy ? null : _editWorkflow, icon: const Icon(Icons.edit_note), label: Text(_busy ? 'Working…' : 'Edit .github/workflows/build_apk.yml')),
                    const SizedBox(height: 18),
                    const SelectableText('Security notes\n• Personal access tokens are stored using flutter_secure_storage; they are not stored in SharedPreferences.\n• Use an expiry date and revoke tokens you no longer need.\n• The APK source sent to GitHub is compiled by GitHub Actions. Never paste tokens or other secrets into Dart source code.'),
                  ]),
                );
          }

          class ProjectWizard extends StatefulWidget {
            const ProjectWizard({
              super.key,
              required this.repository,
              required this.apiFactory,
              required this.onSaveProject,
              this.existing,
            });

            final String repository;
            final GitHubApi Function() apiFactory;
            final Future<void> Function(AppProject project) onSaveProject;
            final AppProject? existing;

            @override
            State<ProjectWizard> createState() => _ProjectWizardState();
          }

          class _ProjectWizardState extends State<ProjectWizard> {
            late final TextEditingController _name;
            late final TextEditingController _packageName;
            late final TextEditingController _dependencies;
            late final String _projectId;
            late String _dartCode;
            late Map<String, String> _additionalFiles;
            String _selectedTemplate = 'Material 3 starter';
            Uint8List? _iconBytes;
            int _step = 0;
            bool _building = false;
            String _status = '';

            List<String> get _sortedAdditionalPaths => _additionalFiles.keys.toList()..sort();

            @override
            void initState() {
              super.initState();
              _projectId = widget.existing?.id ?? DateTime.now().microsecondsSinceEpoch.toString();
              _name = TextEditingController(text: widget.existing?.name ?? 'My Flutter App');
              _packageName = TextEditingController(text: widget.existing?.packageName ?? 'com.example.myapp');
              _dependencies = TextEditingController(text: widget.existing?.dependencies ?? '');
              if (widget.existing == null) {
                final starter = _templateFiles(_selectedTemplate);
                _dartCode = starter['lib/main.dart']!;
                _additionalFiles = Map<String, String>.from(starter)..remove('lib/main.dart');
              } else {
                _dartCode = widget.existing!.dartCode;
                _additionalFiles = Map<String, String>.from(widget.existing!.additionalFiles);
                _selectedTemplate = 'Custom project';
              }
              if (widget.existing?.iconBase64 != null) {
                try { _iconBytes = base64Decode(widget.existing!.iconBase64!); } catch (_) {}
              }
            }

            @override
            void dispose() {
              _name.dispose();
              _packageName.dispose();
              _dependencies.dispose();
              super.dispose();
            }

            AppProject _project() => AppProject(
              id: _projectId,
              name: _name.text.trim(),
              packageName: _packageName.text.trim(),
              dartCode: _dartCode,
              additionalFiles: Map<String, String>.from(_additionalFiles),
              dependencies: _dependencies.text.trim(),
              iconBase64: _iconBytes == null ? null : base64Encode(_iconBytes!),
            );

            Map<String, String> _allDartFiles() => <String, String>{
              'lib/main.dart': _dartCode,
              ..._additionalFiles,
            };

            bool _validDetails() {
              if (_name.text.trim().isEmpty || _name.text.trim().length > 60) {
                _message('Project name must be 1–60 characters.');
                return false;
              }
              if (!RegExp(r'^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}$').hasMatch(_packageName.text.trim())) {
                _message('Package name must be lowercase reverse-DNS format, e.g. com.example.myapp.');
                return false;
              }
              return true;
            }

            bool _validateFileTree() {
              final files = _allDartFiles();
              if (_dartCode.trim().isEmpty) {
                _message('lib/main.dart is empty. Add your app entry point before building.');
                return false;
              }
              if (files.length > 200) {
                _message('A project may contain up to 200 Dart source files in this builder.');
                return false;
              }
              var sourceBytes = 0;
              for (final entry in files.entries) {
                if (!_isSafeDartPath(entry.key)) {
                  _message('Invalid source path: ${entry.key}. Use safe paths under lib/ ending in .dart.');
                  return false;
                }
                sourceBytes += utf8.encode(entry.value).length;
              }
              if (sourceBytes > 2 * 1024 * 1024) {
                _message('Dart source is larger than 2 MB. Remove generated or unnecessary source files.');
                return false;
              }
              for (final dep in _dependencies.text.split(RegExp(r'[,;\s]+')).where((item) => item.isNotEmpty)) {
                if (!RegExp(r'^[a-z][a-z0-9_]*$').hasMatch(dep)) {
                  _message('Invalid pub.dev package name "$dep". Use names separated by commas, e.g. http,provider.');
                  return false;
                }
              }
              return true;
            }

            void _message(String message) {
              if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message)));
            }

            Future<void> _pickIcon() async {
              final picked = await FilePicker.pickFile(type: FileType.image);
              if (picked == null) return;
              final bytes = await picked.readAsBytes();
              if (bytes.isEmpty) { _message('Could not read this image file. Try a PNG image.'); return; }
              if (bytes.length > 8 * 1024 * 1024) { _message('Choose an image smaller than 8 MB.'); return; }
              setState(() => _iconBytes = bytes);
            }

            Future<void> _importMainDart() async {
              final picked = await FilePicker.pickFile(type: FileType.custom, allowedExtensions: const ['dart']);
              if (picked == null) return;
              final bytes = await picked.readAsBytes();
              if (bytes.isEmpty) { _message('Could not read that file.'); return; }
              setState(() {
                _dartCode = utf8.decode(bytes, allowMalformed: true);
                _selectedTemplate = 'Custom project';
              });
            }

            Future<void> _editFile(String path) async {
              final initial = path == 'lib/main.dart' ? _dartCode : (_additionalFiles[path] ?? '');
              final edited = await Navigator.of(context).push<String>(MaterialPageRoute(
                builder: (_) => CodeEditorScreen(title: path, initialText: initial, kind: 'dart'),
              ));
              if (edited == null) return;
              setState(() {
                if (path == 'lib/main.dart') {
                  _dartCode = edited;
                } else {
                  _additionalFiles[path] = edited;
                }
                _selectedTemplate = 'Custom project';
              });
            }

            Future<void> _addDartFile() async {
              final controller = TextEditingController(text: 'lib/screens/new_screen.dart');
              final path = await showDialog<String>(context: context, builder: (context) => AlertDialog(
                title: const Text('Add Dart file'),
                content: SizedBox(width: 440, child: TextField(
                  controller: controller,
                  autofocus: true,
                  autocorrect: false,
                  decoration: const InputDecoration(
                    labelText: 'File path',
                    hintText: 'lib/screens/home_screen.dart',
                    helperText: 'Use a path under lib/, including folders and the .dart extension.',
                  ),
                )),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')),
                  FilledButton(onPressed: () => Navigator.pop(context, controller.text.trim()), child: const Text('Create file')),
                ],
              ));
              controller.dispose();
              if (path == null) return;
              if (!_isSafeDartPath(path) || path == 'lib/main.dart') {
                _message('Use a path such as lib/screens/home_screen.dart. lib/main.dart is the required entry point.');
                return;
              }
              if (_additionalFiles.containsKey(path)) {
                _message('That file already exists. Open it from the file list instead.');
                return;
              }
              final className = _widgetClassNameForPath(path);
              setState(() {
                _additionalFiles[path] = '''import 'package:flutter/material.dart';

          class $className extends StatelessWidget {
          const $className({super.key});

          @override
          Widget build(BuildContext context) => const SizedBox.shrink();
          }
          ''';
                _selectedTemplate = 'Custom project';
              });
              await _editFile(path);
            }

            Future<void> _removeFile(String path) async {
              if (path == 'lib/main.dart') return;
              final confirmed = await showDialog<bool>(context: context, builder: (context) => AlertDialog(
                title: const Text('Delete Dart file?'),
                content: Text('Delete $path from this project?'),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('Cancel')),
                  FilledButton(onPressed: () => Navigator.pop(context, true), child: const Text('Delete')),
                ],
              ));
              if (confirmed == true) setState(() => _additionalFiles.remove(path));
            }

            Future<void> _applyTemplate() async {
              if (_selectedTemplate == 'Custom project') {
                _message('Choose a starter template first.');
                return;
              }
              final confirmed = await showDialog<bool>(context: context, builder: (context) => AlertDialog(
                title: const Text('Replace project source?'),
                content: const Text('Applying a template replaces lib/main.dart and removes the other Dart files from this project. This does not affect other saved projects.'),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('Cancel')),
                  FilledButton(onPressed: () => Navigator.pop(context, true), child: const Text('Apply template')),
                ],
              ));
              if (confirmed != true) return;
              final starter = _templateFiles(_selectedTemplate);
              setState(() {
                _dartCode = starter['lib/main.dart']!;
                _additionalFiles = Map<String, String>.from(starter)..remove('lib/main.dart');
              });
            }

            Uint8List _createSourceArchive() {
              final sourceArchive = Archive();
              for (final entry in _allDartFiles().entries) {
                final bytes = Uint8List.fromList(utf8.encode(entry.value));
                sourceArchive.addFile(ArchiveFile(entry.key, bytes.length, bytes));
              }
              final encoded = ZipEncoder().encode(sourceArchive);
              return Uint8List.fromList(encoded);
            }

            Future<void> _continue() async {
              if (_building) return;
              if (_step == 0 && !_validDetails()) return;
              if (_step == 2 && !_validateFileTree()) return;
              if (_step < 3) {
                setState(() => _step++);
                return;
              }
              await _buildAndDownload();
            }

            Future<void> _buildAndDownload() async {
              if (!_validDetails() || !_validateFileTree()) return;
              if (widget.repository.isEmpty) { _message('Repository is not configured. Open Settings.'); return; }
              if (!RegExp(r'^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$').hasMatch(widget.repository)) {
                _message('Repository should be owner/repository.');
                return;
              }
              setState(() { _building = true; _status = 'Saving project and packing its Dart file tree…'; });
              try {
                await widget.onSaveProject(_project());
                final archiveBytes = _createSourceArchive();
                final sourceArchiveBase64 = base64Encode(archiveBytes);
                if (sourceArchiveBase64.length > 55000) {
                  throw Exception('The compressed Dart project is too large for a workflow_dispatch input (maximum 55,000 Base64 characters). Remove large/generated files and retry.');
                }
                final api = widget.apiFactory();
                _setStatus('Checking repository and default branch…');
                final branch = await api.defaultBranch();
                final payloadSize = utf8.encode(jsonEncode({
                  'ref': branch,
                  'inputs': {
                    'project_name': _name.text.trim(),
                    'package_name': _packageName.text.trim(),
                    'source_archive_base64': sourceArchiveBase64,
                    'dependencies': _dependencies.text.trim(),
                  },
                })).length;
                if (payloadSize > 60000) throw Exception('The workflow input payload is too large after JSON encoding. Reduce the project source or dependency list.');
                if (_iconBytes != null) {
                  _setStatus('Uploading icon.png to the repository…');
                  await api.uploadRootIcon(branch, _iconBytes!);
                }
                final previousRunNumber = await api.latestWorkflowRunNumber();
                _setStatus('Triggering GitHub Actions with ${_allDartFiles().length} Dart files…');
                await api.dispatchBuild(
                  branch: branch,
                  projectName: _name.text.trim(),
                  packageName: _packageName.text.trim(),
                  sourceArchiveBase64: sourceArchiveBase64,
                  dependencies: _dependencies.text.trim(),
                );
                final run = await api.waitForBuild(previousRunNumber, _setStatus);
                _setStatus('Build passed. Downloading APK artifact…');
                final zip = await api.downloadGeneratedApk((run['id'] ?? '').toString());
                final archive = ZipDecoder().decodeBytes(zip);
                ArchiveFile? apk;
                for (final file in archive.files) {
                  if (file.isFile && file.name.toLowerCase().endsWith('.apk')) { apk = file; break; }
                }
                if (apk == null) throw Exception('The artifact ZIP did not contain an APK file.');
                final apkBytes = Uint8List.fromList(apk.content as List<int>);
                final safeName = _name.text.trim().replaceAll(RegExp(r'[^A-Za-z0-9_-]+'), '-').replaceAll(RegExp(r'-+'), '-').replaceAll(RegExp(r'^-|-$'), '');
                final output = await FilePicker.saveFile(
                  dialogTitle: 'Save your release APK',
                  fileName: '${safeName.isEmpty ? 'generated_app' : safeName}.apk',
                  mimeType: 'application/vnd.android.package-archive',
                  type: FileType.custom,
                  allowedExtensions: const ['apk'],
                  bytes: apkBytes,
                );
                if (!mounted) return;
                if (output == null) {
                  setState(() => _status = 'Build succeeded. APK download was canceled in the save dialog.');
                } else {
                  setState(() => _status = 'Build succeeded. APK saved to:\n$output');
                }
                _message(output == null ? 'Build succeeded; save dialog was canceled.' : 'Release APK downloaded successfully.');
              } catch (error) {
                if (mounted) setState(() => _status = 'Build failed:\n$error');
                _message('Build failed. See the status below for details.');
              } finally {
                if (mounted) setState(() => _building = false);
              }
            }

            void _setStatus(String message) { if (mounted) setState(() => _status = message); }

            Widget _fileTile(String path, {required bool isMain}) => Card(
              margin: const EdgeInsets.only(bottom: 6),
              child: ListTile(
                leading: Icon(isMain ? Icons.play_circle_outline : Icons.code, color: Theme.of(context).colorScheme.primary),
                title: Text(path, maxLines: 1, overflow: TextOverflow.ellipsis),
                subtitle: Text(isMain ? 'App entry point' : 'Folder: ${path.substring(0, path.lastIndexOf('/'))}'),
                onTap: () => _editFile(path),
                trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                  IconButton(tooltip: 'Edit $path', onPressed: () => _editFile(path), icon: const Icon(Icons.edit_outlined)),
                  if (!isMain) IconButton(tooltip: 'Delete $path', onPressed: () => _removeFile(path), icon: const Icon(Icons.delete_outline)),
                ]),
              ),
            );

            @override
            Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: Text(widget.existing == null ? 'Create project' : 'Manage ${widget.existing!.name}')),
              body: Stepper(
                type: StepperType.vertical,
                currentStep: _step,
                onStepTapped: _building ? null : (step) => setState(() => _step = step),
                onStepContinue: _continue,
                onStepCancel: _building ? null : () { if (_step > 0) setState(() => _step--); else Navigator.pop(context); },
                controlsBuilder: (context, details) => Padding(
                  padding: const EdgeInsets.only(top: 16),
                  child: Row(children: [
                    FilledButton(onPressed: _building ? null : details.onStepContinue, child: Text(_step == 3 ? (_building ? 'Building…' : 'Build and download APK') : 'Continue')),
                    const SizedBox(width: 10),
                    if (!_building) TextButton(onPressed: details.onStepCancel, child: Text(_step == 0 ? 'Cancel' : 'Back')),
                  ]),
                ),
                steps: [
                  Step(
                    title: const Text('Project details'),
                    subtitle: const Text('Name and Android package ID'),
                    isActive: _step >= 0,
                    state: _step > 0 ? StepState.complete : StepState.indexed,
                    content: Column(children: [
                      TextField(controller: _name, maxLength: 60, decoration: const InputDecoration(labelText: 'Project name', hintText: 'My Company App')),
                      const SizedBox(height: 12),
                      TextField(controller: _packageName, autocorrect: false, decoration: const InputDecoration(labelText: 'Package name', hintText: 'com.company.myapp', helperText: 'Use lowercase reverse-DNS format with at least three segments.')),
                    ]),
                  ),
                  Step(
                    title: const Text('App logo'),
                    subtitle: const Text('Optional launcher icon'),
                    isActive: _step >= 1,
                    state: _step > 1 ? StepState.complete : StepState.indexed,
                    content: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      const Text('Select a square PNG or another supported image. The workflow generates Android launcher-icon sizes from the uploaded image.'),
                      const SizedBox(height: 14),
                      if (_iconBytes != null) Center(child: ClipRRect(borderRadius: BorderRadius.circular(18), child: Image.memory(_iconBytes!, width: 112, height: 112, fit: BoxFit.cover))) else const Center(child: Icon(Icons.image_outlined, size: 80)),
                      const SizedBox(height: 10),
                      Row(children: [Expanded(child: OutlinedButton.icon(onPressed: _pickIcon, icon: const Icon(Icons.upload_file), label: const Text('Choose image'))), if (_iconBytes != null) IconButton(tooltip: 'Remove selected logo', onPressed: () => setState(() => _iconBytes = null), icon: const Icon(Icons.delete_outline))]),
                    ]),
                  ),
                  Step(
                    title: const Text('Dart project files'),
                    subtitle: const Text('Choose a starter template, edit code, and build your own file tree'),
                    isActive: _step >= 2,
                    state: _step > 2 ? StepState.complete : StepState.indexed,
                    content: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      const Text('This is a real multi-file Flutter project. Start from a template, then add folders and Dart files under lib/, edit each file, and list additional pub.dev packages if needed. Package imports are also detected automatically during the build.'),
                      const SizedBox(height: 12),
                      DropdownButtonFormField<String>(
                        value: _selectedTemplate,
                        decoration: const InputDecoration(labelText: 'Starting template'),
                        items: const [
                          DropdownMenuItem(value: 'Material 3 starter', child: Text('Material 3 starter (two files)')),
                          DropdownMenuItem(value: 'Counter example', child: Text('Counter example')),
                          DropdownMenuItem(value: 'Blank screen', child: Text('Blank screen')),
                          DropdownMenuItem(value: 'Custom project', child: Text('Custom project (keep my files)')),
                        ],
                        onChanged: (value) { if (value != null) setState(() => _selectedTemplate = value); },
                      ),
                      const SizedBox(height: 8),
                      Align(alignment: Alignment.centerLeft, child: FilledButton.tonalIcon(
                        onPressed: _building || _selectedTemplate == 'Custom project' ? null : _applyTemplate,
                        icon: const Icon(Icons.auto_awesome),
                        label: const Text('Apply selected template'),
                      )),
                      const SizedBox(height: 14),
                      Row(children: [
                        Expanded(child: Text('Project file tree · ${_additionalFiles.length + 1} files', style: Theme.of(context).textTheme.titleMedium)),
                        FilledButton.icon(onPressed: _building ? null : _addDartFile, icon: const Icon(Icons.create_new_folder_outlined), label: const Text('Add Dart file')),
                      ]),
                      const SizedBox(height: 8),
                      _fileTile('lib/main.dart', isMain: true),
                      ..._sortedAdditionalPaths.map((path) => _fileTile(path, isMain: false)),
                      const SizedBox(height: 4),
                      OutlinedButton.icon(onPressed: _building ? null : _importMainDart, icon: const Icon(Icons.file_open), label: const Text('Import a .dart file into lib/main.dart')),
                      const SizedBox(height: 14),
                      TextField(
                        controller: _dependencies,
                        autocorrect: false,
                        decoration: const InputDecoration(
                          labelText: 'Additional pub.dev packages (optional)',
                          hintText: 'http,provider,shared_preferences',
                          helperText: 'Separate package names with commas. Packages referenced by package: imports are detected automatically.',
                        ),
                      ),
                      const SizedBox(height: 12),
                      Text('Main entry point: ${_dartCode.split('\n').length} lines · ${utf8.encode(_dartCode).length} bytes', style: Theme.of(context).textTheme.bodySmall),
                      Container(width: double.infinity, constraints: const BoxConstraints(maxHeight: 150), padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: Theme.of(context).colorScheme.surfaceContainerHighest, borderRadius: BorderRadius.circular(12)), child: SingleChildScrollView(child: SelectableText(_dartCode, maxLines: 12, style: const TextStyle(fontFamily: 'monospace', fontSize: 12)))),
                    ]),
                  ),
                  Step(
                    title: const Text('Build and download'),
                    subtitle: const Text('GitHub Actions release build'),
                    isActive: _step >= 3,
                    state: _status.startsWith('Build succeeded') ? StepState.complete : StepState.indexed,
                    content: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text('Target repository: ${widget.repository.isEmpty ? '(not configured)' : widget.repository}'),
                      const SizedBox(height: 8),
                      Text('The workflow creates a fresh Flutter project and restores ${_additionalFiles.length + 1} Dart source files with their folder structure. It resolves dependencies detected in imports plus the packages listed above, applies the app icon, and builds a release APK. The builder APK is uploaded separately.'),
                      if (_status.isNotEmpty) ...[
                        const SizedBox(height: 16),
                        if (_building) const LinearProgressIndicator(),
                        const SizedBox(height: 8),
                        SelectableText(_status),
                      ],
                    ]),
                  ),
                ],
              ),
            );
          }

          class CodeEditorScreen extends StatefulWidget {
            const CodeEditorScreen({super.key, required this.title, required this.initialText, required this.kind});
            final String title;
            final String initialText;
            final String kind;

            @override
            State<CodeEditorScreen> createState() => _CodeEditorScreenState();
          }

          class _CodeEditorScreenState extends State<CodeEditorScreen> {
            late final CodeController _controller;

            @override
            void initState() {
              super.initState();
              _controller = CodeController(
                text: widget.initialText,
                language: widget.kind == 'yaml' ? yaml_language.yaml : dart_language.dart,
              );
            }

            @override
            void dispose() { _controller.dispose(); super.dispose(); }

            @override
            Widget build(BuildContext context) {
              final dark = Theme.of(context).brightness == Brightness.dark;
              return Scaffold(
                appBar: AppBar(title: Text(widget.title), actions: [IconButton(tooltip: 'Save changes', onPressed: () => Navigator.pop(context, _controller.text), icon: const Icon(Icons.check))]),
                body: CodeTheme(
                  data: CodeThemeData(styles: dark ? monokaiSublimeTheme : githubTheme),
                  child: CodeField(
                    controller: _controller,
                    expands: true,
                    wrap: false,
                    padding: const EdgeInsets.all(16),
                    textStyle: const TextStyle(fontFamily: 'monospace', fontSize: 13, height: 1.45),
                    gutterStyle: GutterStyle(showLineNumbers: true, showErrors: false, showFoldingHandles: true, width: 54, margin: 12),
                  ),
                ),
              );
            }
          }
          DART
          flutter pub get
          flutter build apk --release --dart-define=BUILDER_REPOSITORY="$GITHUB_REPOSITORY"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/simple-app-builder.apk"

      # Upload the builder first so it remains available even when a user's app has a
      # Dart compile error later in the same run.
      - name: Upload Simple App Builder APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-app-builder-${{ github.run_number }}
          path: dist/simple-app-builder.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Build the target project from the multi-file source archive after the builder artifact is safe.
      - name: Create the requested Flutter project and restore its Dart file tree
        if: ${{ inputs.source_archive_base64 != '' || inputs.dart_code != '' }}
        shell: bash
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          DART_CODE: ${{ inputs.dart_code }}
          SOURCE_ARCHIVE_B64: ${{ inputs.source_archive_base64 }}
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: |
          set -euo pipefail
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          ORG="${PACKAGE_NAME%.*}"
          APP_SLUG="${PACKAGE_NAME##*.}"
          flutter create --org "$ORG" --project-name "$APP_SLUG" "$TARGET_DIR"

          # An archive lets the mobile app send many separate Dart files/folders in one
          # workflow input. Only safe .dart files under lib/ are restored; zip-slip and
          # unexpectedly large archives are rejected before any file is written.
          python3 - "$TARGET_DIR" <<'PYFILES'
          import base64, io, os, re, shutil, sys, zipfile
          from pathlib import Path, PurePosixPath

          target = Path(sys.argv[1]).resolve()
          bundle = os.environ.get('SOURCE_ARCHIVE_B64', '').strip()
          legacy_source = os.environ.get('DART_CODE', '')
          lib_dir = target / 'lib'
          shutil.rmtree(lib_dir, ignore_errors=True)
          lib_dir.mkdir(parents=True, exist_ok=True)

          if bundle:
              try:
                  zipped = base64.b64decode(bundle, validate=True)
                  if len(zipped) > 5 * 1024 * 1024:
                      raise ValueError('compressed archive exceeds 5 MB')
                  with zipfile.ZipFile(io.BytesIO(zipped)) as archive:
                      entries = [info for info in archive.infolist() if not info.is_dir()]
                      if not entries:
                          raise ValueError('source archive is empty')
                      if len(entries) > 200:
                          raise ValueError('source archive contains more than 200 files')
                      total_unpacked = 0
                      for info in entries:
                          rel = PurePosixPath(info.filename)
                          if rel.is_absolute() or '..' in rel.parts or '\\' in info.filename:
                              raise ValueError(f'unsafe file path: {info.filename!r}')
                          if len(rel.parts) < 2 or rel.parts[0] != 'lib' or rel.suffix != '.dart':
                              raise ValueError(f'only Dart files under lib/ are allowed: {info.filename!r}')
                          if any(part in ('', '.') for part in rel.parts):
                              raise ValueError(f'invalid file path: {info.filename!r}')
                          if info.file_size > 1024 * 1024:
                              raise ValueError(f'file is larger than 1 MB: {info.filename!r}')
                          total_unpacked += info.file_size
                          if total_unpacked > 2 * 1024 * 1024:
                              raise ValueError('total Dart source exceeds 2 MB')
                          destination = (target / Path(*rel.parts)).resolve()
                          if lib_dir.resolve() not in destination.parents:
                              raise ValueError(f'path escapes lib/: {info.filename!r}')
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          destination.write_bytes(archive.read(info))
              except (ValueError, zipfile.BadZipFile, OSError) as exc:
                  raise SystemExit(f'Could not restore source_archive_base64: {exc}')
          else:
              if not legacy_source.strip():
                  raise SystemExit('No source archive or legacy dart_code was provided.')
              (lib_dir / 'main.dart').write_text(legacy_source, encoding='utf-8')

          main_file = lib_dir / 'main.dart'
          if not main_file.is_file() or not main_file.read_text(encoding='utf-8').strip():
              raise SystemExit('Project source must contain a non-empty lib/main.dart entry point.')
          print('Restored source tree:')
          for source_file in sorted(lib_dir.rglob('*.dart')):
              print(f'  {source_file.relative_to(target)}')
          PYFILES

          python3 "$RUNNER_TEMP/patch_android_project.py" "$TARGET_DIR" "$PROJECT_NAME" "$PACKAGE_NAME"

          # Detect packages across every Dart source file, then merge with explicitly
          # requested packages. This supports imports in lib/screens/, lib/widgets/, etc.
          python3 - "$TARGET_DIR" > "$RUNNER_TEMP/target_dependencies.txt" <<'PYDEPS'
          import os, re, sys
          from pathlib import Path
          target = Path(sys.argv[1])
          packages = set()
          for source_file in (target / 'lib').rglob('*.dart'):
              source = source_file.read_text(encoding='utf-8')
              packages.update(re.findall(r"package:([A-Za-z][A-Za-z0-9_]*)/", source))
          for dep in re.split(r'[,;\s]+', os.environ.get('DEPENDENCIES', '').strip()):
              if dep:
                  if not re.fullmatch(r'[a-z][a-z0-9_]*', dep):
                      raise SystemExit(f'Invalid dependency package name: {dep!r}')
                  packages.add(dep)
          own_package = os.environ.get('PACKAGE_NAME', '').split('.')[-1]
          ignored = {'flutter', 'flutter_test', 'integration_test', own_package}
          for package in sorted(packages - ignored):
              if re.fullmatch(r'[a-z][a-z0-9_]*', package):
                  print(package)
          PYDEPS
          mapfile -t EXTRA_DEPENDENCIES < "$RUNNER_TEMP/target_dependencies.txt"
          cd "$TARGET_DIR"
          if ((${#EXTRA_DEPENDENCIES[@]})); then
            echo "Installing detected/requested package dependencies: ${EXTRA_DEPENDENCIES[*]}"
            flutter pub add "${EXTRA_DEPENDENCIES[@]}"
          fi
          flutter pub get

      - name: Apply root icon.png as Android launcher icons
        if: ${{ inputs.source_archive_base64 != '' || inputs.dart_code != '' }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          if [[ -f "$GITHUB_WORKSPACE/icon.png" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
            identify "$GITHUB_WORKSPACE/icon.png" >/dev/null
            RES="$TARGET_DIR/android/app/src/main/res"
            while IFS=: read -r density size; do
              mkdir -p "$RES/mipmap-$density"
              # Standard bitmap launcher icons for each density.
              convert "$GITHUB_WORKSPACE/icon.png" -auto-orient -strip -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "$RES/mipmap-$density/ic_launcher.png"
              cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
              # Android adaptive icons reference this foreground resource on API 26+.
              foreground_size=$((size * 68 / 100))
              convert "$GITHUB_WORKSPACE/icon.png" -auto-orient -strip -resize "${foreground_size}x${foreground_size}" -gravity center -background none -extent "${size}x${size}" "$RES/mipmap-$density/ic_launcher_foreground.png"
            done <<'SIZES'
          mdpi:48
          hdpi:72
          xhdpi:96
          xxhdpi:144
          xxxhdpi:192
          SIZES
            echo 'Applied repository icon.png to Android launcher icon resources.'
          else
            echo 'No root icon.png found; keeping Flutter default launcher icons.'
          fi

      - name: Build generated release APK
        if: ${{ inputs.source_archive_base64 != '' || inputs.dart_code != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/generated_flutter_app"
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/${{ steps.metadata.outputs.slug }}-release.apk"

      - name: Upload generated release APK
        if: ${{ inputs.source_archive_base64 != '' || inputs.dart_code != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk-${{ steps.metadata.outputs.slug }}
          path: dist/${{ steps.metadata.outputs.slug }}-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
