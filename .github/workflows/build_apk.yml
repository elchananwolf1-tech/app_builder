              ));
              controller.dispose();
              if (name == null || name.isEmpty) return;
              final next = widget.projects.map((p) => p.id == project.id ? p.copyWith(name: name) : p).toList();
              await widget.onProjectsChanged(next);
            }
          
            Future<void> _editCode(AppProject project) async {
              final source = await Navigator.of(context).push<String>(MaterialPageRoute(builder: (_) => CodeEditorScreen(title: 'Edit ${project.name}', initialText: project.dartCode, kind: 'dart')));
