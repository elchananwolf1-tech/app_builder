                throw FormatException('The GitHub API URL still contains a space: $uri. Check the repository name in Settings.');
              }
          
              final candidates = autoFailover ? accounts : <GitHubAccount>[accounts.first];
              http.Response? lastResponse;
              Object? lastError;
              final canSafelyRetry = normalizedMethod == 'GET';
          
              for (var index = 0; index < candidates.length; index++) {
                final account = candidates[index];
                var tryNextAccount = false;
                final attempts = canSafelyRetry ? 4 : 1;
                for (var attempt = 0; attempt < attempts; attempt++) {
                  try {
                    final headers = <String, String>{
                      'Accept': 'application/vnd.github+json',
                      'Authorization': 'Bearer ${account.token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'Simple-App-Builder',
                    };
                    if (body != null) headers['Content-Type'] = 'application/json; charset=utf-8';
                    late final http.Response response;
                    switch (normalizedMethod) {
                      case 'GET':
                        response = await http.get(uri, headers: headers).timeout(const Duration(seconds: 45));
                        break;
                      case 'POST':
                        response = await http.post(uri, headers: headers, body: body == null ? null : jsonEncode(body)).timeout(const Duration(seconds: 45));
                        break;
                      case 'PUT':
                        response = await http.put(uri, headers: headers, body: body == null ? null : jsonEncode(body)).timeout(const Duration(seconds: 45));
                        break;
                      case 'DELETE':
                        response = await http.delete(uri, headers: headers, body: body == null ? null : jsonEncode(body)).timeout(const Duration(seconds: 45));
                        break;
                      default:
