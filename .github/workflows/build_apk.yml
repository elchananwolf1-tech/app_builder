            }
          
            Future<String> defaultBranch() async {
              final json = checkedJson(await request('GET', _repoPath));
              return (json['default_branch'] ?? 'main').toString();
            }
          
            Future<Set<String>> actionSecretNames() async {
              final json = checkedJson(await request('GET', '$_repoPath/actions/secrets?per_page=100'));
              final secrets = (json['secrets'] as List<dynamic>? ?? const <dynamic>[])
                  .whereType<Map<String, dynamic>>();
              return secrets.map((item) => (item['name'] ?? '').toString()).where((name) => name.isNotEmpty).toSet();
            }
          
            Future<String?> findBackupRepository(String username) async {
              String? publicMatch;
              for (var page = 1; page <= 100; page++) {
                final response = await request('GET', '/user/repos?per_page=100&sort=updated&affiliation=owner&page=$page');
                if (response.statusCode < 200 || response.statusCode >= 300) checkedJson(response);
                dynamic parsed;
                try { parsed = jsonDecode(response.body); } catch (_) { throw Exception('GitHub returned invalid JSON while searching for the backup repository.'); }
                if (parsed is! List) throw Exception('GitHub returned an unexpected repository list while looking for backups.');
                for (final item in parsed.whereType<Map<String, dynamic>>()) {
                  final name = (item['name'] ?? '').toString();
                  final owner = ((item['owner'] as Map?)?['login'] ?? '').toString();
                  if (owner.toLowerCase() == username.toLowerCase() &&
                      name.toLowerCase().startsWith(_backupRepositoryPrefix.toLowerCase())) {
                    final fullName = (item['full_name'] ?? '').toString();
                    if (fullName.isEmpty) continue;
                    if (item['private'] == true) return normalizeRepository(fullName);
                    publicMatch ??= fullName;
                  }
                }
                if (parsed.length < 100 || !(response.headers['link'] ?? '').contains('rel="next"')) break;
              }
              if (publicMatch != null) {
                throw Exception('Found $publicMatch, but it is public. For safety, Simple App Builder will not upload source code or backups to a public repository. Make that repository private, or rename it if it is not your backup library.');
              }
              return null;
            }
          
            Future<String> findOrCreateBackupRepository(String username) async {
              // Deterministic per GitHub username: two devices connecting simultaneously will
              // race to create the same long backup_456... name, not create separate libraries.
              final suffix = crypto.sha256
                  .convert(utf8.encode('simple-app-builder-backup:${username.trim().toLowerCase()}'))
                  .toString()
                  .substring(0, 28);
              final candidate = 'backup_456$suffix';
              for (var attempt = 0; attempt < 4; attempt++) {
                final existing = await findBackupRepository(username);
                if (existing != null) return existing;
                final response = await request('POST', '/user/repos', body: {
                  'name': candidate,
                  'description': 'Private automatic backup library for Simple App Builder projects. Managed automatically by Simple App Builder.',
                  'private': true,
                  'auto_init': true,
                  'has_issues': false,
                  'has_wiki': false,
                  'has_projects': false,
                });
                if (response.statusCode == 201 || response.statusCode == 200) {
                  final data = checkedJson(response);
                  final fullName = (data['full_name'] ?? '').toString();
                  if (fullName.isEmpty) throw Exception('GitHub created the backup repository but did not return its full name.');
                  return normalizeRepository(fullName);
                }
                if (response.statusCode == 422) {
                  await Future<void>.delayed(Duration(seconds: 1 + attempt));
                  final raced = await findBackupRepository(username);
                  if (raced != null) return raced;
                  continue;
                }
                checkedJson(response);
              }
              throw Exception('Could not create the private backup repository after four attempts. Check repository-creation permissions and try again.');
            }
          
            String _contentsPath(String filePath) => '$_repoPath/contents/${filePath.split('/').map(Uri.encodeComponent).join('/')}';
          
            Future<List<String>> listBackupFiles(String branch) async {
              final response = await request('GET', '$_repoPath/contents/$_backupFolder?ref=${Uri.encodeQueryComponent(branch)}');
              if (response.statusCode == 404) return <String>[];
              if (response.statusCode < 200 || response.statusCode >= 300) checkedJson(response);
              dynamic parsed;
              try { parsed = jsonDecode(response.body); } catch (_) { throw Exception('Backup repository returned invalid directory data.'); }
              if (parsed is! List) return <String>[];
              return parsed.whereType<Map<String, dynamic>>()
                  .where((item) => (item['type'] ?? '').toString() == 'file' && (item['name'] ?? '').toString().endsWith('.zip'))
                  .map((item) => (item['path'] ?? '').toString())
                  .where((path) => path.startsWith('$_backupFolder/') && !path.contains('..'))
                  .toList();
            }
          
            Future<Uint8List?> readBinaryFile(String branch, String path) async {
              final response = await request('GET', '${_contentsPath(path)}?ref=${Uri.encodeQueryComponent(branch)}');
              if (response.statusCode == 404) return null;
              final json = checkedJson(response);
              final content = (json['content'] ?? '').toString().replaceAll(RegExp(r'\s'), '');
              if (content.isNotEmpty && (json['encoding'] ?? 'base64').toString() == 'base64') {
                return Uint8List.fromList(base64Decode(content));
              }
              final sha = (json['sha'] ?? '').toString();
              if (sha.isEmpty) throw Exception('GitHub did not return contents or a blob SHA for $path.');
              final blob = checkedJson(await request('GET', '$_repoPath/git/blobs/${Uri.encodeComponent(sha)}'));
              final blobContent = (blob['content'] ?? '').toString().replaceAll(RegExp(r'\s'), '');
              if (blobContent.isEmpty) throw Exception('GitHub returned an empty blob for backup file $path.');
              return Uint8List.fromList(base64Decode(blobContent));
            }
          
            Future<void> writeBinaryFile(String branch, String path, Uint8List bytes, {required String message}) async {
              if (bytes.length > 30 * 1024 * 1024) throw Exception('Backup file $path is larger than 30 MB. Reduce the project size before syncing it.');
              final endpoint = _contentsPath(path);
              String? sha;
              final current = await request('GET', '$endpoint?ref=${Uri.encodeQueryComponent(branch)}');
              if (current.statusCode == 200) {
                final metadata = jsonDecode(current.body) as Map<String, dynamic>;
                sha = metadata['sha']?.toString();
                // Git blob SHA-1 is deterministic. Skip commits for unchanged backup files.
                final header = utf8.encode('blob ${bytes.length}\u0000');
                final blobSha = crypto.sha1.convert(<int>[...header, ...bytes]).toString();
                if (sha == blobSha) return;
              } else if (current.statusCode != 404) {
                checkedJson(current);
              }
              final body = <String, dynamic>{
                'message': message,
                'content': base64Encode(bytes),
                'branch': branch,
              };
              if (sha != null && sha.isNotEmpty) body['sha'] = sha;
              checkedJson(await request('PUT', endpoint, body: body));
            }
          
            Future<List<AppProject>> loadBackupProjects() async {
              final branch = await defaultBranch();
              final paths = await listBackupFiles(branch);
              final projects = <AppProject>[];
              for (final path in paths) {
                try {
                  final bytes = await readBinaryFile(branch, path);
                  if (bytes == null) continue;
                  final project = _decodeProjectBackup(bytes);
                  if (project != null) projects.add(project);
                } catch (_) {
                  // One damaged/old backup must not prevent recovery of other projects.
                  continue;
                }
              }
              return projects;
            }
          
            Future<void> saveBackupProjects(List<AppProject> projects) async {
              final branch = await defaultBranch();
              for (final project in projects) {
                final bytes = _encodeProjectBackup(project);
                final name = _backupFileNameForProject(project);
                await writeBinaryFile(branch, '$_backupFolder/$name', bytes,
                  message: 'Back up project ${project.name} from Simple App Builder');
              }
            }
          
            Future<Map<String, dynamic>> createPrivateRepository(String name, {String? description}) async {
              final cleaned = name.trim();
              if (!RegExp(r'^[A-Za-z0-9_.-]{1,100}$').hasMatch(cleaned)) {
                throw Exception('Repository name must use only letters, digits, periods, underscores or hyphens (max 100 characters).');
              }
              final response = await request('POST', '/user/repos', body: {
                'name': cleaned,
                'description': description ?? 'Flutter app generated with Simple App Builder',
                'private': true,
                'auto_init': true,
                'has_issues': true,
                'has_wiki': false,
                'has_projects': false,
              });
              final created = checkedJson(response);
              final fullName = (created['full_name'] ?? '').toString();
              if (fullName.isEmpty) throw Exception('GitHub created the repository but did not return owner/repository.');
              return created;
            }
          
