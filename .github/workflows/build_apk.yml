            Future<Uint8List?> readRootLogo(String branch) async {
              final response = await request('GET', '$_repoPath/contents/logo.png?ref=${Uri.encodeQueryComponent(branch)}');
              if (response.statusCode == 404) return null;
              final json = checkedJson(response);
              final encoded = (json['content'] ?? '').toString().replaceAll(RegExp(r'\s'), '');
              if (encoded.isEmpty) {
                final reportedSize = (json['size'] as num?)?.toInt() ?? 0;
                if (reportedSize > 0) {
                  throw Exception('GitHub did not return the contents of logo.png (reported size: $reportedSize bytes). Keep logo.png under 1 MB or reduce its size, then retry.');
                }
                return null;
              }
              final bytes = Uint8List.fromList(base64.decode(encoded));
              if (bytes.length > 8 * 1024 * 1024) {
                throw Exception('The template logo.png exceeds 8 MB. Optimize the logo before building.');
              }
              return bytes;
            }
          
