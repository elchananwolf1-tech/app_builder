name: Build Simple App Builder and Generated APK

# The builder app itself is generated from the embedded Dart source below.
# Each run also compiles a user-created multi-file Dart project into a separate release APK.
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Human-readable Android app name (1–60 characters)'
        required: true
        type: string
      package_name:
        description: 'Android application ID, e.g. com.example.myapp'
        required: true
        type: string
      dart_code:
        description: 'Optional legacy single-file lib/main.dart source; use source_archive_base64 for folders and multiple files'
        required: false
        default: ''
        type: string
      source_archive_base64:
        description: 'Compressed ZIP (base64) containing lib/main.dart and other lib/**/*.dart files; normally supplied by the mobile builder'
        required: false
        default: ''
        type: string
      dependencies:
        description: 'Optional comma-separated pub.dev package names, e.g. http,provider'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Do not expose PATs as workflow secrets. The mobile app stores them locally and
# sends authenticated REST API requests directly to GitHub to dispatch this job.
jobs:
  build:
    name: Generate app builder and requested Flutter APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate workflow inputs
        shell: bash
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          DART_CODE: ${{ inputs.dart_code }}
          SOURCE_ARCHIVE_B64: ${{ inputs.source_archive_base64 }}
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          name = os.environ.get('PROJECT_NAME', '').strip()
          package = os.environ.get('PACKAGE_NAME', '').strip()
          source = os.environ.get('DART_CODE', '')
          bundle = os.environ.get('SOURCE_ARCHIVE_B64', '').strip()
          deps = os.environ.get('DEPENDENCIES', '')
          if not name or len(name) > 60 or any(ord(c) < 32 for c in name):
              sys.exit('project_name must be 1–60 characters and contain no control characters.')
          if not re.fullmatch(r'[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}', package):
              sys.exit('package_name must be lowercase reverse-DNS format with at least three segments, e.g. com.example.myapp.')
          # Empty source means this run is only provisioning the Simple App Builder APK.
          # The mobile app dispatches a second run with a Dart source archive after the
          # user creates a project, chooses its icon, and supplies code in the app.
          if bundle and source.strip():
              sys.exit('Provide either source_archive_base64 or dart_code, not both.')
          if bundle and (len(bundle) > 55000 or not re.fullmatch(r'[A-Za-z0-9+/=]+', bundle)):
              sys.exit('source_archive_base64 is invalid or too large. Repack a smaller project; the compressed payload must be at most 55,000 characters.')
          if len(source.encode('utf-8')) > 50000:
              sys.exit('dart_code exceeds 50 KB. Use the mobile builder multi-file archive mode instead.')
          if not bundle and not source.strip():
              print('No app source supplied: this is a builder-only installation run; generated-app build steps will be skipped.')
          for dep in re.split(r'[,;\s]+', deps.strip()):
              if dep and not re.fullmatch(r'[a-z][a-z0-9_]*', dep):
                  sys.exit(f'Invalid dependency package name: {dep!r}. Use comma-separated pub.dev package names only.')
          print('Workflow inputs passed validation.')
          PY

      - name: Prepare artifact name
        id: metadata
        shell: bash
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)"
          if [[ -z "$slug" ]]; then slug="flutter-app"; fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Set up Zulu Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          # Do not enable setup-java's Gradle cache here: this repository may only
          # contain the workflow, while Flutter/Gradle projects are generated later
          # under RUNNER_TEMP. setup-java cache discovery would fail before that.

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      # Helper applies consistent Android metadata and internet permission. New Flutter
      # templates use build.gradle.kts; the fallback handles older Groovy templates.
      - name: Create Android project patch helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/patch_android_project.py" <<'PY'
          import re, sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          project = Path(sys.argv[1])
          app_label = sys.argv[2]
          application_id = sys.argv[3]
          manifest = project / 'android/app/src/main/AndroidManifest.xml'
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find('application')
          if app is None:
              raise SystemExit(f'No <application> element in {manifest}')
          app.set(f'{{{android_ns}}}label', app_label)
          internet = f'{{{android_ns}}}name'
          if not any(node.tag == 'uses-permission' and node.get(internet) == 'android.permission.INTERNET' for node in root):
              permission = ET.Element('uses-permission')
              permission.set(internet, 'android.permission.INTERNET')
              root.insert(0, permission)
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          gradle_files = [project / 'android/app/build.gradle.kts', project / 'android/app/build.gradle']
          gradle = next((p for p in gradle_files if p.exists()), None)
          if gradle is None:
              raise SystemExit('Could not locate android/app/build.gradle(.kts)')
          data = gradle.read_text(encoding='utf-8')
          data = re.sub(r'namespace\s*=\s*["\'][^"\']+["\']', f'namespace = "{application_id}"', data, count=1)
          data = re.sub(r'applicationId\s*=\s*["\'][^"\']+["\']', f'applicationId = "{application_id}"', data, count=1)
          data = data.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          data = data.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
          gradle.write_text(data, encoding='utf-8')
          PY

      - name: Generate the real Simple App Builder application
        shell: bash
        run: |
          set -euo pipefail
          BUILDER_DIR="$RUNNER_TEMP/simple_app_builder"
          OWNER_SLUG="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_]+/_/g')"
          BUILDER_ORG="com.builder_${OWNER_SLUG}"
          BUILDER_PACKAGE="${BUILDER_ORG}.simple_app_builder"
          flutter create --org "$BUILDER_ORG" --project-name simple_app_builder "$BUILDER_DIR"
          cd "$BUILDER_DIR"
          # Pin APIs that match this embedded source. dynamic_color 1.8.1 uses Flutter's
          # Material ColorScheme types. file_picker 12.3.0 uses static FilePicker.pickFile/
          # saveFile methods and win32 6.x, compatible with flutter_secure_storage 11.x.
          flutter pub add flutter_secure_storage shared_preferences http flutter_code_editor flutter_highlight highlight archive url_launcher
          flutter pub add dynamic_color:1.8.1 file_picker:12.3.0
          python3 - <<'PYDEPS'
          from pathlib import Path
          import re
          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          replacements = {
              'dynamic_color': '1.8.1',
              'file_picker': '12.3.0',
          }
          for package, version in replacements.items():
              pattern = rf'(?m)^  {re.escape(package)}:\s*.*$'
              text, count = re.subn(pattern, f'  {package}: {version}', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not pin {package} in pubspec.yaml')
          pubspec.write_text(text, encoding='utf-8')
          PYDEPS
          python3 "$RUNNER_TEMP/patch_android_project.py" "$BUILDER_DIR" 'Simple App Builder' "$BUILDER_PACKAGE"
          cat > lib/main.dart <<'DART'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:typed_data';

          import 'package:archive/archive.dart';
          import 'package:dynamic_color/dynamic_color.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_code_editor/flutter_code_editor.dart';
          import 'package:flutter_highlight/themes/github.dart';
          import 'package:flutter_highlight/themes/monokai-sublime.dart';
          import 'package:flutter_secure_storage/flutter_secure_storage.dart';
          import 'package:highlight/languages/dart.dart' as dart_language;
          import 'package:highlight/languages/yaml.dart' as yaml_language;
          import 'package:http/http.dart' as http;
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';

          const String compiledRepository = String.fromEnvironment(
            'BUILDER_REPOSITORY',
            defaultValue: '',
          );
          const String workflowFile = 'build_apk.yml';
          const FlutterSecureStorage secureStorage = FlutterSecureStorage();

          void main() => runApp(const SimpleAppBuilder());

          class GitHubAccount {
            const GitHubAccount({required this.username, required this.token});

            final String username;
            final String token;

            Map<String, dynamic> toJson() => {'username': username, 'token': token};

            factory GitHubAccount.fromJson(Map<String, dynamic> json) => GitHubAccount(
                  username: (json['username'] ?? '').toString(),
                  token: (json['token'] ?? '').toString(),
                );
          }

          class AppProject {
            const AppProject({
              required this.id,
              required this.name,
              required this.packageName,
              required this.dartCode,
              this.additionalFiles = const {},
              this.dependencies = '',
              this.iconBase64,
            });

            final String id;
            final String name;
            final String packageName;
            // Keep dartCode as the main entry point for migration compatibility.
            final String dartCode;
            // Keys are full relative paths, such as lib/screens/home_screen.dart.
            final Map<String, String> additionalFiles;
            // Explicit packages supplement packages discovered from Dart imports.
            final String dependencies;
            final String? iconBase64;

            AppProject copyWith({
              String? name,
              String? packageName,
              String? dartCode,
              Map<String, String>? additionalFiles,
              String? dependencies,
              String? iconBase64,
              bool clearIcon = false,
            }) => AppProject(
                  id: id,
                  name: name ?? this.name,
                  packageName: packageName ?? this.packageName,
                  dartCode: dartCode ?? this.dartCode,
                  additionalFiles: additionalFiles ?? this.additionalFiles,
                  dependencies: dependencies ?? this.dependencies,
                  iconBase64: clearIcon ? null : (iconBase64 ?? this.iconBase64),
                );

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'name': name,
                  'packageName': packageName,
                  'dartCode': dartCode,
                  'additionalFiles': additionalFiles,
                  'dependencies': dependencies,
                  'iconBase64': iconBase64,
                };

            factory AppProject.fromJson(Map<String, dynamic> json) {
              final files = <String, String>{};
              final rawFiles = json['additionalFiles'];
              if (rawFiles is Map) {
                for (final entry in rawFiles.entries) {
                  files[entry.key.toString()] = entry.value.toString();
                }
              }
              return AppProject(
                id: (json['id'] ?? DateTime.now().microsecondsSinceEpoch).toString(),
                name: (json['name'] ?? 'Untitled app').toString(),
                packageName: (json['packageName'] ?? 'com.example.myapp').toString(),
                dartCode: (json['dartCode'] ?? '').toString(),
                additionalFiles: files,
                dependencies: (json['dependencies'] ?? '').toString(),
                iconBase64: json['iconBase64']?.toString(),
              );
            }
          }

          // Templates are starting points, not fixed generated apps. Users can change
          // every source file and add any number of folders/files below lib/ before building.
          Map<String, String> _templateFiles(String template) {
            switch (template) {
              case 'Blank screen':
                return {
                  'lib/main.dart': '''import 'package:flutter/material.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
          const MyApp({super.key});

          @override
          Widget build(BuildContext context) => MaterialApp(
          title: 'My App',
          theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.indigo),
          darkTheme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.indigo, brightness: Brightness.dark),
          themeMode: ThemeMode.system,
          home: const Scaffold(body: SizedBox.shrink()),
          );
          }
          ''',
                };
              case 'Counter example':
                return {
                  'lib/main.dart': '''import 'package:flutter/material.dart';

          void main() => runApp(const CounterApp());

          class CounterApp extends StatelessWidget {
          const CounterApp({super.key});
          @override
          Widget build(BuildContext context) => MaterialApp(
          title: 'Counter',
          theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.teal),
          darkTheme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.teal, brightness: Brightness.dark),
          themeMode: ThemeMode.system,
          home: const CounterScreen(),
          );
          }

          class CounterScreen extends StatefulWidget {
          const CounterScreen({super.key});
          @override
          State<CounterScreen> createState() => _CounterScreenState();
          }

          class _CounterScreenState extends State<CounterScreen> {
          int count = 0;
          @override
          Widget build(BuildContext context) => Scaffold(
          appBar: AppBar(title: const Text('Counter')),
          body: Center(child: Column(mainAxisSize: MainAxisSize.min, children: [
          const Text('You have pressed the button this many times:'),
          Text('\$count', style: Theme.of(context).textTheme.displayMedium),
          ])),
          floatingActionButton: FloatingActionButton(
          onPressed: () => setState(() => count++),
          child: const Icon(Icons.add),
          ),
          );
          }
          ''',
                };
              default: // Material 3 starter uses a real multi-file lib/ structure.
                return {
                  'lib/main.dart': '''import 'package:flutter/material.dart';
          import 'screens/home_screen.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
          const MyApp({super.key});

          @override
          Widget build(BuildContext context) => MaterialApp(
          title: 'My App',
          theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.indigo),
          darkTheme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.indigo, brightness: Brightness.dark),
          themeMode: ThemeMode.system,
          home: const HomeScreen(),
          );
          }
          ''',
                  'lib/screens/home_screen.dart': '''import 'package:flutter/material.dart';

          class HomeScreen extends StatelessWidget {
          const HomeScreen({super.key});

          @override
          Widget build(BuildContext context) => Scaffold(
          appBar: AppBar(title: const Text('My App')),
          body: const Center(
          child: Padding(
            padding: EdgeInsets.all(24),
            child: Text('Your project is ready. Edit this screen or add new Dart files in the project file tree.'),
          ),
          ),
          );
          }
          ''',
                };
            }
          }

          bool _isSafeDartPath(String path) {
            if (!path.startsWith('lib/') || !path.endsWith('.dart') || path.contains('\\')) return false;
            if (!RegExp(r'^lib/[A-Za-z0-9_./-]+\.dart$').hasMatch(path)) return false;
            final segments = path.split('/');
            return !segments.any((part) => part.isEmpty || part == '.' || part == '..');
          }

          String _widgetClassNameForPath(String path) {
            final stem = path.split('/').last.replaceFirst(RegExp(r'\.dart$'), '');
            final parts = stem.split(RegExp(r'[^A-Za-z0-9]+')).where((part) => part.isNotEmpty);
            var result = parts.map((part) => part[0].toUpperCase() + part.substring(1)).join();
            if (result.isEmpty || RegExp(r'^[0-9]').hasMatch(result)) result = 'Generated$result';
            return result;
          }

          class GitHubApi {
            GitHubApi({
              required this.repository,
              required this.accounts,
              required this.autoFailover,
              this.onPromote,
            });

            final String repository;
            final List<GitHubAccount> accounts;
            final bool autoFailover;
            final void Function(GitHubAccount account)? onPromote;

            String get _repoPath => '/repos/$repository';

            Future<http.Response> request(
              String method,
              String path, {
              Object? body,
            }) async {
              if (accounts.isEmpty) throw Exception('Add a GitHub account in Settings first.');
              final candidates = autoFailover ? accounts : <GitHubAccount>[accounts.first];
              http.Response? lastResponse;
              Object? lastError;

              for (var index = 0; index < candidates.length; index++) {
                final account = candidates[index];
                try {
                  final headers = <String, String>{
                    'Accept': 'application/vnd.github+json',
                    'Authorization': 'Bearer ${account.token}',
                    'X-GitHub-Api-Version': '2022-11-28',
                    'User-Agent': 'Simple-App-Builder',
                  };
                  if (body != null) headers['Content-Type'] = 'application/json; charset=utf-8';
                  final uri = path.startsWith('https://')
                      ? Uri.parse(path)
                      : Uri.parse('https://api.github.com$path');
                  late final http.Response response;
                  switch (method.toUpperCase()) {
                    case 'GET':
                      response = await http.get(uri, headers: headers).timeout(const Duration(seconds: 45));
                      break;
                    case 'POST':
                      response = await http.post(uri, headers: headers, body: body == null ? null : jsonEncode(body)).timeout(const Duration(seconds: 45));
                      break;
                    case 'PUT':
                      response = await http.put(uri, headers: headers, body: body == null ? null : jsonEncode(body)).timeout(const Duration(seconds: 45));
                      break;
                    case 'DELETE':
                      response = await http.delete(uri, headers: headers, body: body == null ? null : jsonEncode(body)).timeout(const Duration(seconds: 45));
                      break;
                    default:
                      throw UnsupportedError('Unsupported HTTP method: $method');
                  }
                  lastResponse = response;
                  final remaining = response.headers['x-ratelimit-remaining'];
                  final retryable = response.statusCode == 401 ||
                      response.statusCode == 403 ||
                      response.statusCode == 429 ||
                      remaining == '0';
                  if (retryable && autoFailover && index < candidates.length - 1) {
                    continue;
                  }
                  if (response.statusCode < 400 && index > 0) onPromote?.call(account);
                  return response;
                } catch (error) {
                  lastError = error;
                  if (!autoFailover || index == candidates.length - 1) break;
                }
              }
              if (lastResponse != null) return lastResponse;
              throw Exception('GitHub API request failed: ${lastError ?? 'unknown network error'}');
            }

            Map<String, dynamic> checkedJson(http.Response response) {
              dynamic parsed;
              try {
                parsed = jsonDecode(response.body);
              } catch (_) {
                parsed = null;
              }
              if (response.statusCode < 200 || response.statusCode >= 300) {
                final message = (parsed is Map ? (parsed['message'] ?? response.body) : response.body).toString();
                final excerpt = message.length > 350 ? message.substring(0, 350) : message;
                throw Exception('GitHub API ${response.statusCode}: $excerpt');
              }
              if (parsed is! Map<String, dynamic>) throw Exception('GitHub returned an unexpected response.');
              return parsed;
            }

            Future<String> defaultBranch() async {
              final json = checkedJson(await request('GET', _repoPath));
              return (json['default_branch'] ?? 'main').toString();
            }

            Future<String> readWorkflow(String branch) async {
              final uriPath = '$_repoPath/contents/.github/workflows/$workflowFile?ref=${Uri.encodeQueryComponent(branch)}';
              final json = checkedJson(await request('GET', uriPath));
              final encoded = (json['content'] ?? '').toString().replaceAll(RegExp(r'\s'), '');
              return utf8.decode(base64.decode(encoded));
            }

            Future<void> saveWorkflow(String branch, String source) async {
              final uriPath = '$_repoPath/contents/.github/workflows/$workflowFile?ref=${Uri.encodeQueryComponent(branch)}';
              final current = checkedJson(await request('GET', uriPath));
              checkedJson(await request('PUT', '$_repoPath/contents/.github/workflows/$workflowFile', body: {
                'message': 'Update build workflow from Simple App Builder',
                'content': base64Encode(utf8.encode(source)),
                'branch': branch,
                'sha': current['sha'],
              }));
            }

            Future<void> uploadRootIcon(String branch, Uint8List bytes) async {
              final path = '$_repoPath/contents/icon.png?ref=${Uri.encodeQueryComponent(branch)}';
              final existing = await request('GET', path);
              String? sha;
              if (existing.statusCode == 200) {
                sha = (jsonDecode(existing.body) as Map<String, dynamic>)['sha']?.toString();
              } else if (existing.statusCode != 404) {
                checkedJson(existing);
              }
              final body = <String, dynamic>{
                'message': 'Update app icon from Simple App Builder',
                'content': base64Encode(bytes),
                'branch': branch,
              };
              if (sha != null) body['sha'] = sha;
              checkedJson(await request('PUT', '$_repoPath/contents/icon.png', body: body));
            }

            Future<void> dispatchBuild({
              required String branch,
              required String projectName,
              required String packageName,
              required String sourceArchiveBase64,
              required String dependencies,
            }) async {
              final response = await request('POST', '$_repoPath/actions/workflows/$workflowFile/dispatches', body: {
                'ref': branch,
                'inputs': {
                  'project_name': projectName,
                  'package_name': packageName,
                  'source_archive_base64': sourceArchiveBase64,
                  'dependencies': dependencies,
                },
              });
              if (response.statusCode != 204 && response.statusCode != 201) {
                checkedJson(response);
                throw Exception('GitHub did not accept the workflow dispatch.');
              }
            }

            Future<int> latestWorkflowRunNumber() async {
              final result = checkedJson(await request(
                'GET',
                '$_repoPath/actions/workflows/$workflowFile/runs?event=workflow_dispatch&per_page=1',
              ));
              final runs = (result['workflow_runs'] as List<dynamic>? ?? const [])
                  .whereType<Map<String, dynamic>>()
                  .toList();
              if (runs.isEmpty) return 0;
              return (runs.first['run_number'] as int?) ?? 0;
            }

            Future<Map<String, dynamic>> waitForBuild(
              int previousRunNumber,
              void Function(String message) onStatus,
            ) async {
              for (var attempt = 0; attempt < 360; attempt++) {
                await Future<void>.delayed(const Duration(seconds: 5));
                final result = checkedJson(await request(
                  'GET',
                  '$_repoPath/actions/workflows/$workflowFile/runs?event=workflow_dispatch&per_page=20',
                ));
                final runs = (result['workflow_runs'] as List<dynamic>? ?? const [])
                    .whereType<Map<String, dynamic>>()
                    .where((run) => ((run['run_number'] as int?) ?? 0) > previousRunNumber)
                    .toList()
                  ..sort((a, b) => (b['run_number'] as int? ?? 0).compareTo(a['run_number'] as int? ?? 0));
                if (runs.isEmpty) {
                  onStatus('Waiting for GitHub to register the build…');
                  continue;
                }
                final run = runs.first;
                final status = (run['status'] ?? 'queued').toString();
                final number = run['run_number']?.toString() ?? '';
                onStatus('Workflow #$number: $status');
                if (status == 'completed') {
                  if (run['conclusion'] != 'success') {
                    final url = (run['html_url'] ?? '').toString();
                    throw Exception('The build failed. Open the workflow run for the compiler log: $url');
                  }
                  return run;
                }
              }
              throw TimeoutException('Build did not finish within 30 minutes. Check the Actions tab in GitHub.');
            }

            Future<Uint8List> downloadGeneratedApk(String runId) async {
              final json = checkedJson(await request('GET', '$_repoPath/actions/runs/$runId/artifacts?per_page=100'));
              final artifacts = (json['artifacts'] as List<dynamic>? ?? const []).whereType<Map<String, dynamic>>();
              final artifact = artifacts.where((a) =>
                (a['name'] ?? '').toString().startsWith('generated-apk-') && a['expired'] != true).toList();
              if (artifact.isEmpty) throw Exception('The workflow succeeded but the generated APK artifact was not found.');
              final id = artifact.first['id'].toString();
              final response = await request('GET', '$_repoPath/actions/artifacts/$id/zip');
              if (response.statusCode != 200) throw Exception('Could not download the APK artifact (${response.statusCode}).');
              return response.bodyBytes;
            }
          }

          Future<String?> verifyAccount(String username, String token) async {
            try {
              final response = await http.get(
                Uri.https('api.github.com', '/user'),
                headers: {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer $token',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Simple-App-Builder',
                },
              ).timeout(const Duration(seconds: 30));
              if (response.statusCode != 200) {
                return 'GitHub rejected this token (HTTP ${response.statusCode}). Check the token and its scopes.';
              }
              final actual = (jsonDecode(response.body) as Map<String, dynamic>)['login'].toString();
              if (actual.toLowerCase() != username.trim().toLowerCase()) {
                return 'This token belongs to "$actual", not "${username.trim()}".';
              }
              return null;
            } catch (error) {
              return 'Could not verify the account: $error';
            }
          }

          class SimpleAppBuilder extends StatefulWidget {
            const SimpleAppBuilder({super.key});

            @override
            State<SimpleAppBuilder> createState() => _SimpleAppBuilderState();
          }

          class _SimpleAppBuilderState extends State<SimpleAppBuilder> {
            bool _ready = false;
            List<GitHubAccount> _accounts = [];
            List<AppProject> _projects = [];
            bool _autoFailover = true;
            String _repository = compiledRepository;

            @override
            void initState() {
              super.initState();
              _loadState();
            }

            Future<void> _loadState() async {
              final prefs = await SharedPreferences.getInstance();
              try {
                final rawAccounts = await secureStorage.read(key: 'github_accounts_v1');
                if (rawAccounts != null) {
                  _accounts = (jsonDecode(rawAccounts) as List<dynamic>)
                      .whereType<Map<String, dynamic>>()
                      .map(GitHubAccount.fromJson)
                      .where((a) => a.username.isNotEmpty && a.token.isNotEmpty)
                      .toList();
                }
              } catch (_) {
                _accounts = [];
              }
              try {
                final rawProjects = prefs.getString('projects_v1');
                if (rawProjects != null) {
                  _projects = (jsonDecode(rawProjects) as List<dynamic>)
                      .whereType<Map<String, dynamic>>()
                      .map(AppProject.fromJson)
                      .toList();
                }
              } catch (_) {
                _projects = [];
              }
              _autoFailover = prefs.getBool('auto_failover') ?? true;
              _repository = prefs.getString('repository') ?? compiledRepository;
              if (mounted) setState(() => _ready = true);
            }

            Future<void> _saveAccounts(List<GitHubAccount> accounts) async {
              _accounts = List<GitHubAccount>.from(accounts);
              await secureStorage.write(
                key: 'github_accounts_v1',
                value: jsonEncode(_accounts.map((a) => a.toJson()).toList()),
              );
              if (mounted) setState(() {});
            }

            Future<void> _saveProjects(List<AppProject> projects) async {
              _projects = List<AppProject>.from(projects);
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('projects_v1', jsonEncode(_projects.map((p) => p.toJson()).toList()));
              if (mounted) setState(() {});
            }

            Future<void> _saveFailover(bool enabled) async {
              _autoFailover = enabled;
              final prefs = await SharedPreferences.getInstance();
              await prefs.setBool('auto_failover', enabled);
              if (mounted) setState(() {});
            }

            Future<void> _saveRepository(String repository) async {
              _repository = repository.trim();
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('repository', _repository);
              if (mounted) setState(() {});
            }

            void _promoteAccount(GitHubAccount account) {
              final next = <GitHubAccount>[
                account,
                ..._accounts.where((a) => a.username.toLowerCase() != account.username.toLowerCase()),
              ];
              unawaited(_saveAccounts(next));
            }

            GitHubApi _api() => GitHubApi(
                  repository: _repository,
                  accounts: List<GitHubAccount>.from(_accounts),
                  autoFailover: _autoFailover,
                  onPromote: _promoteAccount,
                );

            ThemeData _theme(ColorScheme scheme) => ThemeData(
                  colorScheme: scheme,
                  useMaterial3: true,
                  scaffoldBackgroundColor: scheme.surface,
                  appBarTheme: const AppBarThemeData(centerTitle: false),
                  inputDecorationTheme: const InputDecorationThemeData(
                    border: OutlineInputBorder(),
                    filled: true,
                  ),
                  cardTheme: const CardThemeData(clipBehavior: Clip.antiAlias),
                );

            @override
            Widget build(BuildContext context) => DynamicColorBuilder(
                  builder: (ColorScheme? lightDynamic, ColorScheme? darkDynamic) {
                    // Explicit types prevent inference from widening the values to Diagnosticable.
                    final ColorScheme light = lightDynamic ??
                        ColorScheme.fromSeed(seedColor: const Color(0xFF6750A4));
                    final ColorScheme dark = darkDynamic ??
                        ColorScheme.fromSeed(
                          seedColor: const Color(0xFFD0BCFF),
                          brightness: Brightness.dark,
                        );
                    return MaterialApp(
                      title: 'Simple App Builder',
                      debugShowCheckedModeBanner: false,
                      theme: _theme(light),
                      darkTheme: _theme(dark),
                      themeMode: ThemeMode.system,
                      home: !_ready
                          ? const _LoadingScreen()
                          : _accounts.isEmpty
                              ? SetupScreen(onSetup: (account) async {
                                  await _saveAccounts([account]);
                                })
                              : DashboardScreen(
                                  accounts: _accounts,
                                  projects: _projects,
                                  autoFailover: _autoFailover,
                                  repository: _repository,
                                  apiFactory: _api,
                                  onAccountsChanged: _saveAccounts,
                                  onProjectsChanged: _saveProjects,
                                  onFailoverChanged: _saveFailover,
                                  onRepositoryChanged: _saveRepository,
                                ),
                    );
                  },
                );
          }

