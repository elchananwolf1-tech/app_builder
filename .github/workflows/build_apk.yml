          class CodeEditorScreen extends StatefulWidget {
            const CodeEditorScreen({super.key, required this.title, required this.initialText, required this.kind, this.readOnly = false});
            final String title;
            final String initialText;
            final String kind;
            final bool readOnly;
          
            @override
            State<CodeEditorScreen> createState() => _CodeEditorScreenState();
          }
          
          class _CodeEditorScreenState extends State<CodeEditorScreen> {
            static const int _syntaxHighlightLimit = 60000;
            late final bool _largeDocumentMode;
            CodeController? _codeController;
            TextEditingController? _plainController;
            bool get _usesPlainEditor => _largeDocumentMode || widget.readOnly;
            String get _text => _codeController?.text ?? _plainController?.text ?? widget.initialText;
          
            @override
            void initState() {
              super.initState();
              // Parsing and highlighting a 300 KB workflow on the UI thread caused long
              // stalls. Keep the syntax editor for normal files and use a lightweight editor
              // for very large files; the YAML can still be viewed and edited in full.
              _largeDocumentMode = widget.initialText.length > _syntaxHighlightLimit;
              if (_largeDocumentMode || widget.readOnly) {
                _plainController = TextEditingController(text: widget.initialText);
              } else {
                _codeController = CodeController(
                  text: widget.initialText,
                  language: widget.kind == 'yaml'
                      ? yaml_language.yaml
                      : widget.kind == 'kotlin'
                          ? kotlin_language.kotlin
                          : widget.kind == 'java' || widget.kind == 'proguard'
                              ? java_language.java
                              : widget.kind == 'xml'
                                  ? xml_language.xml
                                  : dart_language.dart,
                );
              }
            }
          
            @override
            void dispose() {
              _codeController?.dispose();
              _plainController?.dispose();
              super.dispose();
            }
          
            @override
            Widget build(BuildContext context) {
              final dark = Theme.of(context).brightness == Brightness.dark;
              final codeStyle = TextStyle(fontFamily: 'monospace', fontSize: 13, height: 1.45, color: dark ? const Color(0xFFE6E6E6) : const Color(0xFF202124));
              return Scaffold(
                appBar: AppBar(title: Text(widget.title), actions: [
                  if (!widget.readOnly) IconButton(tooltip: 'Save changes', onPressed: () => Navigator.pop(context, _text), icon: const Icon(Icons.check)),
                ]),
                body: Directionality(
                  textDirection: TextDirection.ltr,
                  child: Column(children: [
                    if (_largeDocumentMode) Container(
                      width: double.infinity,
                      color: Theme.of(context).colorScheme.tertiaryContainer,
                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                      child: const Text('Large-file mode: syntax highlighting is paused to open this file quickly. All content is preserved.', style: TextStyle(fontSize: 12)),
                    ),
                    Expanded(child: _usesPlainEditor
                      ? TextField(
                          controller: _plainController,
                          readOnly: widget.readOnly,
                          expands: true,
                          minLines: null,
                          maxLines: null,
                          keyboardType: TextInputType.multiline,
                          autocorrect: false,
                          enableSuggestions: false,
                          textAlign: TextAlign.left,
                          style: codeStyle,
                          decoration: const InputDecoration(border: InputBorder.none, contentPadding: EdgeInsets.all(16)),
                        )
                      : CodeTheme(
                          data: CodeThemeData(styles: dark ? monokaiSublimeTheme : githubTheme),
                          child: CodeField(
                            controller: _codeController!,
                            expands: true,
                            wrap: false,
                            padding: const EdgeInsets.all(16),
                            textStyle: codeStyle,
                            gutterStyle: GutterStyle(showLineNumbers: true, showErrors: false, showFoldingHandles: false, textAlign: TextAlign.end, textStyle: const TextStyle(fontFamily: 'monospace', fontSize: 13, height: 1.45), width: 72, margin: 8),
                            lineNumberBuilder: (lineNumber, style) => TextSpan(text: '${lineNumber + 1}', style: style),
                          ),
                        )),
                  ]),
                ),
              );
            }
          }
          DART
          # Builder launcher assets come from the template repository's root logo.png.
          # The monochrome alpha mask enables Android 13+ themed icons; the system chooses tint.
          if [[ -f "$GITHUB_WORKSPACE/logo.png" ]]; then
            if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y python3-pil
            fi
            python3 "$RUNNER_TEMP/prepare_launcher_icons.py" "$GITHUB_WORKSPACE/logo.png" "$BUILDER_DIR/assets" true
            flutter pub add --dev flutter_launcher_icons:^0.14.4
            cat >> pubspec.yaml <<'ICONCONFIG'
          flutter_launcher_icons:
            android: true
            image_path: "assets/app_icon.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/app_icon_foreground.png"
          ICONCONFIG
            if [[ -f assets/app_icon_monochrome.png ]]; then
              printf '  adaptive_icon_monochrome: "assets/app_icon_monochrome.png"\n' >> pubspec.yaml
            else
              echo '::warning::logo.png is not a transparent logo; themed monochrome icons were skipped to avoid tinting a white rectangle.'
            fi
            dart run flutter_launcher_icons
          else
            echo "::warning::logo.png was not found at the repository root; using Flutter's default launcher icon."
          fi
          flutter pub get
          python3 "$RUNNER_TEMP/patch_flutter_plugin_gradle.py" "$BUILDER_DIR"
          flutter build apk --release --no-pub --dart-define=BUILDER_REPOSITORY="$GITHUB_REPOSITORY"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/simple-app-builder.apk"

      # Upload the builder first so it remains available even when a user's app has a
      # Dart compile error later in the same run.
      - name: Upload Simple App Builder APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: simple-app-builder-${{ github.run_number }}
          path: dist/simple-app-builder.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Build the target project from the multi-file source archive after the builder artifact is safe.
      - name: Create the requested Flutter project and restore Dart plus supported Android source
        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        env:
          PROJECT_NAME: ${{ steps.app_payload.outputs.project_name }}
          PACKAGE_NAME: ${{ steps.app_payload.outputs.package_name }}
          DART_CODE: ${{ steps.app_payload.outputs.dart_code }}
          SOURCE_ARCHIVE_B64: ${{ steps.app_payload.outputs.source_archive_base64 }}
          SOURCE_ARCHIVE_PATH: ${{ github.workspace }}/.simple-app-builder/source.zip
          DEPENDENCIES: ${{ steps.app_payload.outputs.dependencies }}
          ANDROID_DEPENDENCIES: ${{ steps.app_payload.outputs.android_dependencies }}
          APP_VERSION: ${{ steps.app_payload.outputs.app_version }}
        run: |
          set -euo pipefail
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          ORG="${PACKAGE_NAME%.*}"
          APP_SLUG="${PACKAGE_NAME##*.}"
          flutter create --org "$ORG" --project-name "$APP_SLUG" "$TARGET_DIR"

          # The builder commits its source ZIP to this repository before dispatching the
          # event. Reading it from checkout avoids duplicating large source in GitHub's
          # 64 KB repository_dispatch payload. Legacy inline archive payloads remain supported.
          # Safe Dart files and selected native Android source/configuration files are restored; unsafe paths and oversized archives fail clearly.
          python3 - "$TARGET_DIR" <<'PYFILES'
          import base64, copy, io, os, re, shutil, sys, zipfile
          from pathlib import Path, PurePosixPath
          import xml.etree.ElementTree as ET

          target = Path(sys.argv[1]).resolve()
          bundle = os.environ.get('SOURCE_ARCHIVE_B64', '').strip()
          archive_path = Path(os.environ.get('SOURCE_ARCHIVE_PATH', '.simple-app-builder/source.zip'))
          legacy_source = os.environ.get('DART_CODE', '')
          lib_dir = target / 'lib'
          shutil.rmtree(lib_dir, ignore_errors=True)
          lib_dir.mkdir(parents=True, exist_ok=True)
          custom_manifest = None
          restored = []
          total_unpacked = 0
          dart_bytes = 0
          android_bytes = 0

          def is_safe_android(path):
              if path == 'android/app/src/main/AndroidManifest.xml' or path == 'android/app/proguard-rules.pro':
                  return True
              if re.fullmatch(r'android/app/src/main/kotlin/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_]+\.kt', path):
                  return True
              if re.fullmatch(r'android/app/src/main/java/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_]+\.java', path):
                  return True
              if re.fullmatch(r'android/app/src/main/res/[a-z][a-z0-9_-]*/[a-z][a-z0-9_]*\.xml', path):
                  return True
              return False

          def is_safe_dart(path):
              return bool(re.fullmatch(r'lib/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\.dart', path))

          def merge_manifest(custom_bytes, generated_path):
              android_uri = 'http://schemas.android.com/apk/res/android'
              ET.register_namespace('android', android_uri)
              ET.register_namespace('tools', 'http://schemas.android.com/tools')
              try:
                  custom_root = ET.fromstring(custom_bytes)
              except ET.ParseError as exc:
                  raise SystemExit(f'Custom AndroidManifest.xml is not valid XML: {exc}')
              if custom_root.tag != 'manifest':
                  raise SystemExit('Custom AndroidManifest.xml must have a <manifest> root element.')
              try:
                  tree = ET.parse(generated_path)
              except ET.ParseError as exc:
                  raise SystemExit(f'Generated Flutter AndroidManifest.xml is invalid: {exc}')
              generated_root = tree.getroot()
              android_name = f'{{{android_uri}}}name'
              android_authorities = f'{{{android_uri}}}authorities'
              app_attrs_to_preserve = {f'{{{android_uri}}}label', f'{{{android_uri}}}icon', f'{{{android_uri}}}roundIcon'}
              for key, value in custom_root.attrib.items():
                  if key not in ('package', f'{{{android_uri}}}versionCode', f'{{{android_uri}}}versionName'):
                      generated_root.set(key, value)
              generated_app = generated_root.find('application')
              if generated_app is None:
                  generated_app = ET.SubElement(generated_root, 'application')
              for node in list(custom_root):
                  local = node.tag.rsplit('}', 1)[-1]
                  if local == 'uses-sdk':
                      print('::warning::Ignoring <uses-sdk> in custom manifest; the generated Flutter project controls min/target SDK.')
                      continue
                  if local == 'application':
                      for key, value in node.attrib.items():
                          if key not in app_attrs_to_preserve:
                              generated_app.set(key, value)
                      for child in list(node):
                          name = child.get(android_name) or child.get(android_authorities)
                          existing = next((item for item in list(generated_app) if item.tag == child.tag and ((name and (item.get(android_name) == name or item.get(android_authorities) == name)) or (not name and ET.tostring(item, encoding='unicode') == ET.tostring(child, encoding='unicode')))), None)
                          if existing is None:
                              generated_app.append(copy.deepcopy(child))
                          else:
                              for key, value in child.attrib.items():
                                  if key != android_name:
                                      existing.set(key, value)
                              known_children = {ET.tostring(item, encoding='unicode') for item in list(existing)}
                              for sub in list(child):
                                  serialized = ET.tostring(sub, encoding='unicode')
                                  if serialized not in known_children:
                                      existing.append(copy.deepcopy(sub))
                      continue
                  name = node.get(android_name) or node.get(android_authorities)
                  existing = next((item for item in list(generated_root) if item.tag == node.tag and ((name and (item.get(android_name) == name or item.get(android_authorities) == name)) or (not name and ET.tostring(item, encoding='unicode') == ET.tostring(node, encoding='unicode')))), None)
                  if existing is None:
                      generated_root.append(copy.deepcopy(node))
                  else:
                      for key, value in node.attrib.items():
                          if key != android_name:
                              existing.set(key, value)
              tree.write(generated_path, encoding='utf-8', xml_declaration=True)

          def merge_values_resource(custom_bytes, generated_path):
              android_uri = 'http://schemas.android.com/apk/res/android'
              tools_uri = 'http://schemas.android.com/tools'
              ET.register_namespace('android', android_uri)
              ET.register_namespace('tools', tools_uri)
              try:
                  custom_root = ET.fromstring(custom_bytes)
              except ET.ParseError as exc:
                  raise SystemExit(f'Android values resource is not valid XML: {exc}')
              if custom_root.tag != 'resources':
                  raise SystemExit(f'Android values file {generated_path.name} must have a <resources> root element.')
              if not generated_path.is_file():
                  generated_path.write_bytes(custom_bytes)
                  return
              try:
                  tree = ET.parse(generated_path)
              except ET.ParseError as exc:
                  raise SystemExit(f'Generated Android values resource {generated_path} is invalid: {exc}')
              generated_root = tree.getroot()
              if generated_root.tag != 'resources':
                  raise SystemExit(f'Generated Android values file {generated_path} does not have a <resources> root.')
              for key, value in custom_root.attrib.items():
                  generated_root.set(key, value)
              for node in list(custom_root):
                  name = node.get('name')
                  existing = next((item for item in list(generated_root) if item.tag == node.tag and name and item.get('name') == name), None)
                  if existing is None:
                      serialized = ET.tostring(node, encoding='unicode')
                      if not any(ET.tostring(item, encoding='unicode') == serialized for item in list(generated_root)):
                          generated_root.append(copy.deepcopy(node))
                  else:
                      index = list(generated_root).index(existing)
                      generated_root.remove(existing)
                      generated_root.insert(index, copy.deepcopy(node))
              tree.write(generated_path, encoding='utf-8', xml_declaration=True)

          if bundle or archive_path.is_file():
              try:
                  zipped = base64.b64decode(bundle, validate=True) if bundle else archive_path.read_bytes()
                  if len(zipped) > 5 * 1024 * 1024:
                      raise ValueError('compressed source archive exceeds 5 MB')
                  with zipfile.ZipFile(io.BytesIO(zipped)) as archive:
                      entries = [info for info in archive.infolist() if not info.is_dir()]
                      if not entries:
                          raise ValueError('source archive is empty')
                      if len(entries) > 250:
                          raise ValueError('source archive has more than 250 files')
                      for info in entries:
                          rel = PurePosixPath(info.filename)
                          if rel.is_absolute() or '..' in rel.parts or '\\' in info.filename or any(part in ('', '.') for part in rel.parts):
                              raise ValueError(f'unsafe source path: {info.filename!r}')
                          path = rel.as_posix()
                          if is_safe_dart(path):
                              category = 'dart'
                          elif is_safe_android(path):
                              category = 'android'
                          else:
                              print(f'::warning::Skipping unsupported source archive entry: {path}')
                              continue
                          if info.file_size > 1024 * 1024:
                              raise ValueError(f'{path} is larger than 1 MB')
                          content = archive.read(info)
                          total_unpacked += len(content)
                          if total_unpacked > 5 * 1024 * 1024:
                              raise ValueError('supported source files exceed 5 MB unpacked')
                          if category == 'dart':
                              dart_bytes += len(content)
                              if dart_bytes > 2 * 1024 * 1024:
                                  raise ValueError('Dart source exceeds 2 MB')
                              destination = (target / path).resolve()
                              if lib_dir.resolve() not in destination.parents:
                                  raise ValueError(f'Dart path escapes lib/: {path!r}')
                              destination.parent.mkdir(parents=True, exist_ok=True)
                              destination.write_bytes(content)
                              restored.append(path)
                          else:
                              android_bytes += len(content)
                              if android_bytes > 3 * 1024 * 1024:
                                  raise ValueError('Android source/configuration exceeds 3 MB')
                              if path == 'android/app/src/main/AndroidManifest.xml':
                                  custom_manifest = content
                                  restored.append(path + ' (merge)')
                              else:
                                  destination = (target / path).resolve()
                                  android_root = (target / 'android').resolve()
                                  if android_root not in destination.parents:
                                      raise ValueError(f'Android path escapes android/: {path!r}')
                                  destination.parent.mkdir(parents=True, exist_ok=True)
                                  if re.fullmatch(r'android/app/src/main/res/values[^/]*/[a-z][a-z0-9_]*\.xml', path) and destination.is_file():
                                      merge_values_resource(content, destination)
                                      restored.append(path + ' (merged resources)')
                                  else:
                                      destination.write_bytes(content)
                                      restored.append(path)
              except (ValueError, zipfile.BadZipFile, OSError) as exc:
                  raise SystemExit(f'Could not restore Flutter/Android source archive: {exc}')
          else:
              if not legacy_source.strip():
                  raise SystemExit('No source archive or legacy dart_code was provided.')
              (lib_dir / 'main.dart').write_text(legacy_source, encoding='utf-8')
              restored.append('lib/main.dart')

          # If a Java MainActivity was imported, remove Flutter's generated Kotlin MainActivity
          # at the matching package path. Shipping both classes with the same package/name
          # creates a duplicate-class compile error. If both were explicitly imported, fail clearly.
          restored_paths = [item.split(' (merge)', 1)[0] for item in restored]
          imported_activities = [path for path in restored_paths if path.endswith('/MainActivity.kt') or path.endswith('/MainActivity.java')]
          java_activities = [path for path in imported_activities if path.endswith('/MainActivity.java')]
          kotlin_activities = [path for path in imported_activities if path.endswith('/MainActivity.kt')]
          for java_path in java_activities:
              rel_package = java_path.split('/java/', 1)[1].rsplit('/', 1)[0] if '/java/' in java_path else ''
              matching_kotlin = f'android/app/src/main/kotlin/{rel_package}/MainActivity.kt' if rel_package else 'android/app/src/main/kotlin/MainActivity.kt'
              if matching_kotlin in restored_paths:
                  raise SystemExit(f'Both Java and Kotlin MainActivity files were supplied for the same package: {java_path} and {matching_kotlin}. Keep one MainActivity implementation.')
              generated_kotlin = (target / matching_kotlin).resolve()
              if generated_kotlin.is_file():
                  generated_kotlin.unlink()
                  print(f'Removed generated Kotlin MainActivity because a Java implementation was imported: {matching_kotlin}')

          main_file = lib_dir / 'main.dart'
          if not main_file.is_file() or not main_file.read_text(encoding='utf-8').strip():
              raise SystemExit('Project source must contain a non-empty lib/main.dart entry point.')
          if custom_manifest is not None:
              merge_manifest(custom_manifest, target / 'android/app/src/main/AndroidManifest.xml')
          print(f'Restored {len(restored)} Flutter/Android source file(s):')
          for source_path in sorted(restored):
              print(f'  {source_path}')
          print(f'Source totals: {dart_bytes} Dart bytes, {android_bytes} Android bytes.')
          PYFILES

          python3 "$RUNNER_TEMP/patch_android_project.py" "$TARGET_DIR" "$PROJECT_NAME" "$PACKAGE_NAME" "$APP_VERSION"

          # Detect packages across every Dart source file, then merge with explicitly
          # requested packages. This supports imports in lib/screens/, lib/widgets/, etc.
          python3 - "$TARGET_DIR" > "$RUNNER_TEMP/target_dependencies.txt" <<'PYDEPS'
          import os, re, sys
          from pathlib import Path
          target = Path(sys.argv[1])
          packages = set()
          for source_file in (target / 'lib').rglob('*.dart'):
              source = source_file.read_text(encoding='utf-8')
              # Remove comments before dependency detection so examples, TODOs and commented
              # imports do not silently add native plugins that the app never uses.
              source = re.sub(r'/\*[\s\S]*?\*/', '', source)
              source = re.sub(r'(?m)^\s*//.*$', '', source)
              directives = re.findall(r'''(?m)^\s*(?:import|export|part)\s+['"]package:([A-Za-z][A-Za-z0-9_]*)/''', source)
              packages.update(directives)
          for dep in re.split(r'[,;\s]+', os.environ.get('DEPENDENCIES', '').strip()):
              if dep:
                  if not re.fullmatch(r'[a-z][a-z0-9_]*', dep):
                      raise SystemExit(f'Invalid dependency package name: {dep!r}')
                  packages.add(dep)
          own_package = os.environ.get('PACKAGE_NAME', '').split('.')[-1]
          ignored = {'flutter', 'flutter_test', 'integration_test', own_package}
          for package in sorted(packages - ignored):
              if re.fullmatch(r'[a-z][a-z0-9_]*', package):
                  print(package)
          PYDEPS
          mapfile -t EXTRA_DEPENDENCIES < "$RUNNER_TEMP/target_dependencies.txt"
          cd "$TARGET_DIR"
          if ((${#EXTRA_DEPENDENCIES[@]})); then
            echo "Installing detected/requested package dependencies: ${EXTRA_DEPENDENCIES[*]}"
            flutter pub add "${EXTRA_DEPENDENCIES[@]}"
          fi
          flutter pub get

          # Add caller-supplied native Android Maven dependencies to the generated app module.
          # Coordinates are validated before reaching this script; duplicates are skipped.
          python3 - "$TARGET_DIR" <<'PYMAVEN'
          import os, re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          coordinates = [x for x in re.split(r'[,;\s]+', os.environ.get('ANDROID_DEPENDENCIES', '').strip()) if x]
          if not coordinates:
              print('No Android Maven dependencies requested; skipping Gradle dependency injection.')
              raise SystemExit(0)
          if len(coordinates) > 20:
              raise SystemExit('Use at most 20 Android Maven dependencies.')
          for coordinate in coordinates:
              if not re.fullmatch(r'[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.+-]+', coordinate):
                  raise SystemExit(f'Invalid Android Maven coordinate: {coordinate!r}')
          gradle = root / 'android/app/build.gradle.kts'
          if not gradle.is_file(): gradle = root / 'android/app/build.gradle'
          if not gradle.is_file(): raise SystemExit('Could not find Android app Gradle file to add Maven dependencies.')
          data = gradle.read_text(encoding='utf-8')
          is_kts = gradle.suffix == '.kts'
          match = re.search(r'(?m)^([ \t]*)dependencies\s*\{', data)
          if not match:
              raise SystemExit('Could not find dependencies { } block in the generated Android app Gradle file.')
          opening = data.find('{', match.start())
          depth = 0; quote = None; escaped = False; closing = None
          for index in range(opening, len(data)):
              char = data[index]
              if quote:
                  if escaped: escaped = False
                  elif char == '\\': escaped = True
                  elif char == quote: quote = None
                  continue
              if char in ('\"', "'"): quote = char
              elif char == '{': depth += 1
              elif char == '}':
                  depth -= 1
                  if depth == 0: closing = index; break
          if closing is None: raise SystemExit('Unclosed dependencies block in Android app Gradle file.')
          lines = []
          for coordinate in coordinates:
              if coordinate in data: continue
              if is_kts: lines.append(f'    implementation("{coordinate}")')
              else: lines.append(f"    implementation '{coordinate}'")
          if lines:
              data = data[:closing] + '\n' + '\n'.join(lines) + '\n' + data[closing:]
              gradle.write_text(data, encoding='utf-8')
              print('Added Android Maven dependencies: ' + ', '.join(coordinates))
          else:
              print('No new Android Maven dependency lines were needed.')
          PYMAVEN

          # Best-effort compatibility repair for cached Flutter plugins with legacy or
          # out-of-order Kotlin/Android Gradle plugin declarations. The same preflight
          # also runs when building the builder APK itself.
          python3 "$RUNNER_TEMP/patch_flutter_plugin_gradle.py" "$TARGET_DIR"

      - name: Apply selected image or repository logo.png to Android launcher icons
        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        env:
          ICON_PATH: ${{ steps.app_payload.outputs.icon_path }}
          HAS_CUSTOM_ICON: ${{ steps.app_payload.outputs.has_custom_icon }}
          DYNAMIC_THEMED_ICON: ${{ steps.app_payload.outputs.dynamic_themed_icon }}
        run: |
          set -euo pipefail
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          ICON_SOURCE=""
          if [[ "${HAS_CUSTOM_ICON,,}" == "true" ]]; then
            if [[ ! "$ICON_PATH" =~ ^\.simple-app-builder/icons/[0-9]+-[0-9]+\.png$ ]]; then
              echo 'ERROR: The requested icon path is invalid.' >&2
              exit 1
            fi
            ICON_SOURCE="$GITHUB_WORKSPACE/$ICON_PATH"
            if [[ ! -f "$ICON_SOURCE" ]]; then
              echo "ERROR: A custom icon was requested, but $ICON_PATH is missing from the checked-out repository." >&2
              exit 1
            fi
          elif [[ -f "$GITHUB_WORKSPACE/logo.png" ]]; then
            ICON_SOURCE="$GITHUB_WORKSPACE/logo.png"
            echo 'No project-specific icon was selected; using repository-root logo.png as the fallback.'
          else
            echo 'No project icon and no logo.png fallback were found; keeping Flutter launcher icons.'
            exit 0
          fi
          if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y python3-pil
          fi
          mkdir -p "$TARGET_DIR/assets"
          DYNAMIC_THEMED_ICON="${DYNAMIC_THEMED_ICON:-true}"
          python3 "$RUNNER_TEMP/prepare_launcher_icons.py" "$ICON_SOURCE" "$TARGET_DIR/assets" "$DYNAMIC_THEMED_ICON"
          cd "$TARGET_DIR"
          flutter pub add --dev flutter_launcher_icons:^0.14.4
          cat >> pubspec.yaml <<'ICONCONFIG'
          flutter_launcher_icons:
            android: true
            image_path: "assets/app_icon.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/app_icon_foreground.png"
          ICONCONFIG
          if [[ "${DYNAMIC_THEMED_ICON,,}" == "true" && -f assets/app_icon_monochrome.png ]]; then
            printf '  adaptive_icon_monochrome: "assets/app_icon_monochrome.png"\n' >> pubspec.yaml
            echo 'Dynamic themed icon enabled from the original image transparency.'
          elif [[ "${DYNAMIC_THEMED_ICON,,}" == "true" ]]; then
            echo '::warning::The selected logo is not transparent, so its colors/background were preserved and a monochrome theme layer was not generated.'
          else
            echo 'Dynamic themed icon disabled by project settings.'
          fi
          dart run flutter_launcher_icons
          echo 'Applied color and adaptive launcher icons. Source colors were preserved; no background removal was performed.'

      - name: Configure Android release signing (optional)
        if: ${{ github.event_name == 'repository_dispatch' && steps.app_payload.outputs.sign_release == 'true' && (steps.app_payload.outputs.build_format == 'apk' || steps.app_payload.outputs.build_format == 'aab') }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_KEY_ALIAS" ]]; then
            echo 'Signing was requested, but one or more required Actions secrets are missing.' >&2
            echo 'Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS in Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$TARGET_DIR/android/upload-keystore.jks"
          cat > "$TARGET_DIR/android/key.properties" <<KEYPROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          KEYPROPS
          python3 - "$TARGET_DIR" <<'PYSIGN'
          import re, sys
          from pathlib import Path
          
          def block_range(source, pattern):
              match = re.search(pattern, source, re.M)
              if not match:
                  return None
              opening = source.find('{', match.start())
              if opening < 0:
                  return None
              depth = 0
              quote = None
              escaped = False
              for index in range(opening, len(source)):
                  char = source[index]
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in ('"', "'"):
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return opening, index
              return None
          
          def insert_line_before(source, index, content):
              line_start = source.rfind('\n', 0, index) + 1
              return source[:line_start] + content.rstrip() + '\n' + source[line_start:]
          
          root = Path(sys.argv[1])
          groovy = root / 'android/app/build.gradle'
          kotlin = root / 'android/app/build.gradle.kts'
          gradle = groovy if groovy.exists() else kotlin
          if not gradle.exists():
              raise SystemExit('Could not find app/build.gradle or app/build.gradle.kts for signing.')
          text = gradle.read_text(encoding='utf-8')
          is_kts = gradle.suffix == '.kts'
          if 'import java.util.Properties' not in text:
              text = 'import java.util.Properties\nimport java.io.FileInputStream\n' + text
          if is_kts:
              props = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) { keystoreProperties.load(FileInputStream(keystorePropertiesFile)) }
          '''
          else:
              props = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }
          '''
          if 'keystorePropertiesFile' not in text:
              android_match = re.search(r'(?m)^android\s*\{', text)
              if not android_match:
                  raise SystemExit('Could not find android { in app Gradle file; signing config cannot be applied safely.')
              text = text[:android_match.start()] + props.rstrip() + '\n\n' + text[android_match.start():]
          
          if is_kts:
              release_entry = '''        create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
          '''
          else:
              release_entry = '''        release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
          '''
          config_range = block_range(text, r'(?m)^\s*signingConfigs\s*\{')
          config_text = text[config_range[0]:config_range[1]+1] if config_range else ''
          if is_kts:
              has_release_config = 'create("release")' in config_text or bool(re.search(r'(?m)^\s*getByName\("release"\)\s*\{', config_text))
          else:
              has_release_config = bool(re.search(r'(?m)^\s*release\s*\{', config_text))
          if not has_release_config:
              if config_range:
                  text = insert_line_before(text, config_range[1], release_entry)
              else:
                  build_types = re.search(r'(?m)^\s*buildTypes\s*\{', text)
                  if not build_types:
                      raise SystemExit('Could not find buildTypes { in app Gradle file; signing config cannot be applied safely.')
                  if is_kts:
                      block = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
                  else:
                      block = '''    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
                  text = insert_line_before(text, build_types.start(), block)
          
          build_range = block_range(text, r'(?m)^\s*buildTypes\s*\{')
          if not build_range:
              raise SystemExit('Could not locate buildTypes block for release signing.')
          build_body = text[build_range[0]+1:build_range[1]]
          release_range = block_range(build_body, r'(?m)^\s*release\s*\{')
          if not release_range:
              raise SystemExit('Could not locate buildTypes.release block for release signing.')
          release_body = build_body[release_range[0]+1:release_range[1]]
          if is_kts:
              release_body = re.sub(r'signingConfig\s*=\s*signingConfigs(?:\.debug|\.getByName\(["\']debug["\']\))', 'signingConfig = signingConfigs.getByName("release")', release_body)
              if not re.search(r'(?m)^\s*signingConfig\s*=', release_body):
                  release_body = '\n            signingConfig = signingConfigs.getByName("release")' + release_body
          else:
              release_body = re.sub(r'signingConfig\s+(?:signingConfigs\.debug|signingConfigs\.getByName\(["\']debug["\']\))', 'signingConfig signingConfigs.release', release_body)
              if not re.search(r'(?m)^\s*signingConfig\s+', release_body):
                  release_body = '\n            signingConfig signingConfigs.release' + release_body
          absolute_release_start = build_range[0] + 1 + release_range[0] + 1
          absolute_release_end = build_range[0] + 1 + release_range[1]
          text = text[:absolute_release_start] + release_body + text[absolute_release_end:]
          gradle.write_text(text, encoding='utf-8')
          print(f'Configured optional release signing in {gradle}; keystore secrets were not logged.')
          PYSIGN

      - name: Build requested output
        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        env:
          BUILD_FORMAT: ${{ steps.app_payload.outputs.build_format }}
          SIGN_RELEASE: ${{ steps.app_payload.outputs.sign_release }}
        run: |
          set -euo pipefail
          TARGET_DIR="$RUNNER_TEMP/generated_flutter_app"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$TARGET_DIR"
          BUILD_FORMAT="${BUILD_FORMAT:-apk}"
          case "$BUILD_FORMAT" in
            aab)
              flutter build appbundle --release --no-pub
              cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/${{ steps.metadata.outputs.slug }}-release.aab"
              ;;
            apk)
              flutter build apk --release --no-pub
              cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/${{ steps.metadata.outputs.slug }}-release.apk"
              ;;
            *) echo "Unsupported build format: $BUILD_FORMAT" >&2; exit 1 ;;
          esac

      - name: Upload generated release APK
        if: ${{ github.event_name == 'repository_dispatch' && steps.app_payload.outputs.build_format == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk-${{ steps.metadata.outputs.slug }}
          path: dist/${{ steps.metadata.outputs.slug }}-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload generated Android App Bundle
        if: ${{ github.event_name == 'repository_dispatch' && steps.app_payload.outputs.build_format == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-aab-${{ steps.metadata.outputs.slug }}
          path: dist/${{ steps.metadata.outputs.slug }}-release.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

