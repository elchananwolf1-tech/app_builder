          String normalizeRepository(String value) {
            var normalized = value.trim();
            normalized = normalized.replaceFirst(RegExp(r'^https?://github\.com/', caseSensitive: false), '');
            normalized = normalized.replaceFirst(RegExp(r'^git@github\.com:', caseSensitive: false), '');
            normalized = normalized.split(RegExp(r'[?#]')).first;
            normalized = normalized.replaceFirst(RegExp(r'\.git/?$', caseSensitive: false), '');
            normalized = normalized.replaceAll(RegExp(r'\s*/\s*'), '/');
            normalized = normalized.replaceAll(RegExp(r'^/+|/+$'), '').trim();
