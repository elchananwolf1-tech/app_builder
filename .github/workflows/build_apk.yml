              final uri = cleanPath.startsWith('https://')
                  ? Uri.parse(cleanPath)
                  : Uri.parse('https://api.github.com${cleanPath.startsWith('/') ? cleanPath : '/$cleanPath'}');
              if (uri.scheme != 'https' || uri.host.toLowerCase() != 'api.github.com') {
                throw FormatException('Refusing to send GitHub credentials to an unexpected URL host: ${uri.host}.');
              }
