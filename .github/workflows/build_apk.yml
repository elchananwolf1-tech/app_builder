          AppProject? _decodeProjectBackup(Uint8List bytes) {
            try {
              final archive = ZipDecoder().decodeBytes(bytes, verify: true);
              ArchiveFile? metadataEntry;
              ArchiveFile? folderEntry;
              ArchiveFile? iconEntry;
              final dartFiles = <String, String>{};
              for (final entry in archive.files) {
                if (!entry.isFile) continue;
                final path = entry.name.replaceAll('\\', '/');
                if (path.startsWith('/') || path.split('/').any((part) => part == '.' || part == '..' || part.isEmpty)) continue;
                if (path == 'project.json') metadataEntry = entry;
                else if (path == 'folders.json') folderEntry = entry;
                else if (path == 'project-icon.png') iconEntry = entry;
                else if (_isSafeProjectFilePath(path)) {
                  dartFiles[path] = utf8.decode(entry.content as List<int>, allowMalformed: true);
                }
              }
              if (metadataEntry == null) return null;
              final metadata = jsonDecode(utf8.decode(metadataEntry.content as List<int>)) as Map<String, dynamic>;
              final hasMainFile = metadata['hasMainFile'] is bool
                  ? metadata['hasMainFile'] as bool
                  : dartFiles.containsKey('lib/main.dart');
              if (hasMainFile && !dartFiles.containsKey('lib/main.dart')) return null;
              final folders = <String>{};
              if (folderEntry != null) {
                final raw = jsonDecode(utf8.decode(folderEntry.content as List<int>));
                if (raw is List) for (final folder in raw) {
                  final value = folder.toString();
                  if (_isSafeFolderPath(value)) folders.add(value);
                }
              }
              for (final path in dartFiles.keys) { folders.addAll(_folderAncestors(path)); }
              metadata['dartCode'] = dartFiles.remove('lib/main.dart') ?? '';
              metadata['hasMainFile'] = hasMainFile;
              metadata['additionalFiles'] = dartFiles;
              metadata['folders'] = folders.toList();
              if (iconEntry != null) metadata['iconBase64'] = base64Encode(iconEntry.content as List<int>);
              return AppProject.fromJson(metadata);
            } catch (_) {
              return null;
            }
          }
          
