          bool _validRelativeSegments(String path) {
            if (path.isEmpty || path.startsWith('/') || path.contains('\\') || path.contains(RegExp(r'[\x00-\x1F]'))) return false;
            if (!RegExp(r'^[A-Za-z0-9_./-]+$').hasMatch(path)) return false;
            final segments = path.split('/');
            return !segments.any((part) => part.isEmpty || part == '.' || part == '..');
          }
          
          bool _isSafeDartPath(String path) {
            return path.startsWith('lib/') && path.endsWith('.dart') && _validRelativeSegments(path);
          }
          
          bool _isSafeAndroidFilePath(String path) {
            if (!_validRelativeSegments(path)) return false;
            if (path == 'android/app/src/main/AndroidManifest.xml') return true;
            if (path == 'android/app/proguard-rules.pro') return true;
            if (RegExp(r'^android/app/src/main/kotlin/[A-Za-z0-9_./-]+\.kt$').hasMatch(path)) return true;
            if (RegExp(r'^android/app/src/main/java/[A-Za-z0-9_./-]+\.java$').hasMatch(path)) return true;
            if (RegExp(r'^android/app/src/main/res/[a-z][a-z0-9_-]*/[a-z][a-z0-9_]*\.xml$').hasMatch(path)) return true;
            return false;
          }
          
          bool _isSafeProjectFilePath(String path) => _isSafeDartPath(path) || _isSafeAndroidFilePath(path);
          
          bool _isSafeFolderPath(String path) {
            if (!_validRelativeSegments(path) || path.length > 240 || path.split('/').length > 20) return false;
            if (path == 'lib' || path.startsWith('lib/')) return true;
            const exactRoots = <String>{'android', 'android/app', 'android/app/src', 'android/app/src/main', 'android/app/src/main/kotlin', 'android/app/src/main/java', 'android/app/src/main/res'};
            if (exactRoots.contains(path)) return true;
            if (path.startsWith('android/app/src/main/kotlin/') || path.startsWith('android/app/src/main/java/')) return true;
            if (RegExp(r'^android/app/src/main/res/[a-z][a-z0-9_-]*$').hasMatch(path)) return true;
            return false;
          }
          
          Set<String> _folderAncestors(String path) {
            final pieces = path.split('/');
            if (pieces.length < 2) return <String>{};
            final result = <String>{};
            var current = pieces.first;
            result.add(current);
            for (final piece in pieces.skip(1).take(pieces.length - 2)) {
              current = '$current/$piece';
              result.add(current);
            }
            return result;
          }
          
          String _languageKindForPath(String path) {
            final lower = path.toLowerCase();
            if (lower.endsWith('.kt')) return 'kotlin';
            if (lower.endsWith('.java')) return 'java';
            if (lower.endsWith('.xml')) return 'xml';
            if (lower.endsWith('.pro')) return 'proguard';
            if (lower.endsWith('.yaml') || lower.endsWith('.yml')) return 'yaml';
            return 'dart';
          }
          
          String _labelForProjectFile(String path) {
            if (path == 'lib/main.dart') return 'Flutter app entry point';
            if (path.startsWith('lib/')) return 'Dart / Flutter source';
            if (path.endsWith('.kt')) return 'Android Kotlin source';
            if (path.endsWith('.java')) return 'Android Java source';
            if (path.endsWith('AndroidManifest.xml')) return 'Android manifest (merged safely)';
            if (path.startsWith('android/app/src/main/res/')) return 'Android XML resource';
            return 'Android configuration';
          }
          
          String _widgetClassNameForPath(String path) {
            final stem = path.split('/').last.replaceFirst(RegExp(r'\.dart$'), '');
            final parts = stem.split(RegExp(r'[^A-Za-z0-9]+')).where((part) => part.isNotEmpty);
            var result = parts.map((part) => part[0].toUpperCase() + part.substring(1)).join();
            if (result.isEmpty || RegExp(r'^[0-9]').hasMatch(result)) result = 'Generated$result';
